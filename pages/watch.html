<body class="watch-page">
  <nav class="navbar" id="navbar"></nav>

<main class="container" id="main">
     <div class="loading"><div class="spinner"></div>Loading player...</div>
   </main>

   <h1 style="display:none;">Watch Anime Online - OtakuPier</h1>

   <footer id="siteFooter"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js?v=25"></script>
  <script src="../js/api.js?v=25"></script>
  <script src="../js/seo.js?v=25"></script>
  <script src="../js/app.js?v=25"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const providerParam = params.get("provider") || "";

    let animeData = null;
    let activeEmbedIndex = 0;
    let lastStreamEpisode = 0;
    let streamLang = "sub"; // "sub" | "dub" (AniPub); other providers ignore it
    let playerIframe = null;   // reused across episodes so Chrome keeps autoplay
    let playerIframeProvider = null; // provider.id the reused frame belongs to
    let anipubEpCount = 0;  // playable episodes AniPub actually lists for this title
    let anikotoEpCount = 0; // playable episodes AniKoto actually lists for this title

    async function load() {
      const main = document.getElementById("main");
      if (!id) {
        main.innerHTML = `<div class="empty-state"><a href="${pageHref("catalog")}" class="btn btn-primary">Browse the catalog</a>
          <p style="margin-top:12px;">No anime selected — open one to watch.</p></div>`;
        return;
      }
      try {
        const res = await JIKAN.getAnime(id);
        animeData = res.data;

        // Apply admin-curated overrides (title / image / status)
        if (supabase) {
          try {
            const { data: edit } = await supabase
              .from("anime_edits").select("*").eq("mal_id", Number(id)).maybeSingle();
            if (edit) {
              const a = animeData;
              if (edit.title) { a.title = edit.title; a.title_english = edit.title; }
              if (edit.image_url) {
                a.images = a.images || {};
                a.images.jpg = a.images.jpg || {};
                a.images.jpg.image_url = edit.image_url;
                a.images.jpg.large_image_url = edit.image_url;
              }
              if (edit.status) a.status = edit.status;
            }
          } catch (e) {}
        }

        renderPage();
        SEO.setAnimeMeta(animeData);
        // Pre-warm provider caches before first episode loads.
        await Promise.allSettled([
          JIKAN.anilistIdOf(animeData.mal_id),
          JIKAN.anikotoEpisodes(animeData),
          JIKAN.anipubEpisodes(animeData),
        ]);
        playEpisode(1);
      } catch (err) {
        main.innerHTML = `<div class="empty-state">Could not load this anime.</div>`;
      }
    }

    function renderPage() {
      const a = animeData;
      const title = JIKAN.title(a);
      document.title = `${title} - Watch - OtakuPier`;
      const main = document.getElementById("main");
      main.innerHTML = `
        <div class="watch-top">
          <div class="watch-top-actions">
            <a class="btn btn-outline btn-small" href="${pageHref("catalog")}?q=${encodeURIComponent(JIKAN.title(a))}">Open in catalog</a>
            <button class="btn btn-outline btn-small" onclick="goBack()">&larr; Back</button>
          </div>
        </div>
        <div id="watchTheater"></div>`;

      const embed = getStreamingProviders().filter((p) => p.mode === "embed");
      const idx = embed.findIndex((p) => p.id === providerParam);
      if (idx >= 0) activeEmbedIndex = idx;
      renderTheater();
      initWatchVolume();
      loadSavedState();
    }

    function getStreamingProviders() {
      return JIKAN.streamingProviders();
    }

    function listOfEpisodes() {
      // Only show episodes that have actually aired
      const totalEps = animeData?.episodes || 1;
      const status = animeData?.status || "";
      const isAiring = status === "RELEASING" || status === "Currently Airing";

      // For completed anime, show all episodes
      // For currently airing, show only episodes up to the current episode
      // We'll show all episodes but disable unaired ones
      const maxEp = Math.min(totalEps, 500);
      return Array.from({ length: Math.max(maxEp, anipubEpCount, anikotoEpCount) }, (_, i) => i + 1);
    }

    // Check if an episode has aired — must stay in sync with listOfEpisodes()
    // which extends the grid when AniPub/AniKoto report more episodes than Jikan.
    function isEpisodeAired(epNum) {
      const totalEps = animeData?.episodes || 1;
      const status = animeData?.status || "";
      const isAiring = status === "RELEASING" || status === "Currently Airing";
      const maxEp = Math.min(totalEps, 500);
      const effectiveMax = Math.max(maxEp, anipubEpCount, anikotoEpCount);
      // Completed anime: all listed episodes are available
      if (!isAiring || status === "FINISHED" || status === "Completed") {
        return epNum <= effectiveMax;
      }
      // Currently airing: provider-specific counts override Jikan's total
      return epNum <= effectiveMax;
    }

    // The currently-selected on-site (embed) provider.
    function activeProvider() {
      const embed = getStreamingProviders().filter((p) => p.mode === "embed");
      return embed[activeEmbedIndex] || embed[0] || null;
    }

    // ---------- On-site theater ----------
    function renderTheater() {
      const theater = document.getElementById("watchTheater");
      if (!theater) return;
      const embed = getStreamingProviders().filter((p) => p.mode === "embed");
      const provChips = embed.map((p, i) =>
`<button class="ep-chip provider-chip${i === activeEmbedIndex ? " is-active" : ""}" data-eprov="${i}" onclick="pickEmbedProvider(${i})"
            title="${JIKAN.esc(p.name)} — streams on this site">
            <span class="provider-chip-name">${JIKAN.esc(p.name)}</span>
            <span class="mode-dot" title="Streams on this site"></span>
          </button>`
      ).join("");
      const a = animeData || {};
      const miniImg = a.images?.jpg?.image_url || JIKAN.PLACEHOLDER;
      theater.innerHTML = `
        <div class="watch-theater">
          <div class="watch-player">
            <div class="watch-player-bar">
              <span class="watch-player-title" id="watchPlayerTitle">On-site player</span>
              <div class="watch-player-actions">
                <label class="watch-vol" title="Volume">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
                  <input type="range" id="watchVol" min="0" max="100" value="100" aria-label="Volume">
                  <span class="watch-vol-hint" id="watchVolHint"></span>
                </label>
                <button class="stream-nav" id="prevEpBtn" onclick="playEpisode(lastStreamEpisode - 1)" title="Previous episode (←)">‹</button>
                <button class="stream-nav" id="nextEpBtn" onclick="playEpisode(lastStreamEpisode + 1)" title="Next episode (→)">›</button>
                <button class="stream-nav" onclick="toggleWatchFullscreen()" title="Fullscreen (F)">
                  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                </button>
                <button class="watch-hide" onclick="hideTheater()" title="Hide player">&times;</button>
              </div>
            </div>
            <div class="watch-frame" id="watchFrame">
              <div class="stream-loading"><div class="spinner"></div><span>Preparing player…</span></div>
            </div>
            <div class="watch-lang-bar" id="watchLangBar" style="display:none">
              <span class="watch-lang-label">Audio</span>
              <button class="lang-btn" data-lang="sub" onclick="setLang('sub')">Sub</button>
              <button class="lang-btn" data-lang="dub" onclick="setLang('dub')">Dub</button>
            </div>
          </div>
          <div class="watch-side">
            <div class="watch-mini-info">
<img class="watch-mini-img" src="${JIKAN.esc(miniImg)}" alt="${JIKAN.esc(JIKAN.title(a))} cover"
                     onerror="this.onerror=null;this.src=JIKAN.PLACEHOLDER">
              <div class="watch-mini-body">
                <div class="watch-mini-title">${JIKAN.esc(JIKAN.title(a))}</div>
                ${a.title_japanese ? `<div class="watch-mini-jp">${JIKAN.esc(a.title_japanese)}</div>` : ""}
                <div class="watch-mini-stats">
                  <span class="stat">Score: <strong>${a.score ? a.score.toFixed(2) : "N/A"}</strong></span>
                  <span class="stat">Episodes: <strong>${a.episodes || "?"}</strong></span>
                  <span class="stat">Status: <strong>${JIKAN.esc(a.status || "N/A")}</strong></span>
                </div>
                <div class="watch-mini-actions">
                  <a class="btn btn-outline btn-small" href="${pageHref("anime")}?id=${a.mal_id}">Details</a>
                  <span id="watchSaveSlot"></span>
                </div>
              </div>
            </div>
            ${embed.length ? `<div class="watch-side-title">Provider</div>
              <div class="watch-providers">${provChips}</div>` : ""}
            <div class="watch-side-title">Episodes</div>
            <div class="watch-episodes" id="watchEps"></div>
          </div>
        </div>`;
      renderTheaterEps();
    }

    function renderTheaterEps() {
      const box = document.getElementById("watchEps");
      if (!box) return;
      box.innerHTML = listOfEpisodes().map((n) =>
        `<button class="ep-chip${!isEpisodeAired(n) ? " ep-unaired" : ""}" data-ep="${n}" onclick="playEpisode(${n})"${!isEpisodeAired(n) ? " disabled" : ""}>${n}</button>`
      ).join("");
      markTheaterEpisode(lastStreamEpisode);
    }

    function markTheaterEpisode(ep) {
      document.querySelectorAll("#watchEps .ep-chip").forEach((c) =>
        c.classList.toggle("is-active", Number(c.dataset.ep) === (ep || 0)));
    }

    function pickEmbedProvider(i) {
      activeEmbedIndex = i;
      document.querySelectorAll(".watch-providers .ep-chip[data-eprov]").forEach((c, idx) =>
        c.classList.toggle("is-active", idx === i));
      updateVolumeUI();
      playEpisode(lastStreamEpisode || 1);
    }

    function hideTheater() {
      const theater = document.getElementById("watchTheater");
      if (theater) theater.innerHTML = "";
    }

    // Fullscreen the whole player (bar + frame). On portrait phones the screen
    // is locked to landscape and the frame is rotated by CSS so the video
    // fills the screen instead of shrinking into a tiny vertical letterbox.
    // Keyboard: F toggles it.
    function lockLandscape() {
      try {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock("landscape").catch(() => {});
        }
      } catch (e) {}
    }
    function unlockOrientation() {
      try {
        if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
      } catch (e) {}
    }
    function toggleWatchFullscreen() {
      const player = document.querySelector(".watch-player");
      if (!player) return;
      const isFs = document.fullscreenElement || document.webkitFullscreenElement;
      if (isFs) {
        unlockOrientation();
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        const req = player.requestFullscreen || player.webkitRequestFullscreen;
        if (req) req.call(player);
      }
    }
    document.addEventListener("fullscreenchange", () => {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        lockLandscape();
      } else {
        unlockOrientation();
      }
    });
    document.addEventListener("webkitfullscreenchange", () => {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        lockLandscape();
      } else {
        unlockOrientation();
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "f" && e.target && /^(input|textarea)$/i.test(e.target.tagName)) return;
      if (e.key.toLowerCase() === "f" && document.getElementById("watchTheater")?.innerHTML) {
        e.preventDefault();
        toggleWatchFullscreen();
      }
    });

    // Load an episode into the on-site player. Embed providers stream right in
    // the page (AniKoto / AniPub); a shimmer overlays the frame until the
    // player has loaded, and prev/next buttons jump between episodes.
    async function playEpisode(ep) {
      const embed = getStreamingProviders().filter((p) => p.mode === "embed");
      if (!embed.length) {
        showToast("No on-site player is configured for this title.");
        return;
      }
      const provider = activeProvider() || embed[0];
      const frame = document.getElementById("watchFrame");
      const titleEl = document.getElementById("watchPlayerTitle");
      if (!frame) {
        renderTheater();
        return playEpisode(ep);
      }
      const eps = listOfEpisodes();
      if (ep < 1 || ep > eps.length) {
        showToast(`Episode ${ep} is out of range`);
        return;
      }
      lastStreamEpisode = ep;
      markTheaterEpisode(ep);
      const prevBtn = document.getElementById("prevEpBtn");
      const nextBtn = document.getElementById("nextEpBtn");
      if (prevBtn) prevBtn.disabled = ep <= 1;
      if (nextBtn) nextBtn.disabled = ep >= eps.length;
      if (titleEl) titleEl.textContent = `Episode ${ep}`;
      const langBar = document.getElementById("watchLangBar");
      if (langBar) {
        const showLang = ["anipub", "anikoto", "megavid", "anixo"].includes(provider.id);
        langBar.style.display = showLang ? "" : "none";
        langBar.querySelectorAll(".lang-btn").forEach((b) =>
          b.classList.toggle("is-active", b.dataset.lang === streamLang));
      }
      frame.innerHTML = `<div class="stream-loading"><div class="spinner"></div><span>Loading ${JIKAN.esc(provider.name)}…</span></div>`;

      let url;
      if (provider.id === "anipub") {
        // AniPub keys episodes by its own ids — resolve them via its API.
        // Timebox the resolve so "Loading…" can never persist if the API is
        // slow or blocked from the viewer's network (→ falls through to the
        // "couldn't resolve" notice below).
        url = await Promise.race([
          JIKAN.anipubUrl(animeData, ep, streamLang),
          new Promise((r) => setTimeout(() => r(null), 10000)),
        ]);
        if (!url) {
          frame.innerHTML = `<div class="stream-notice">
            <div class="not-found-title">Couldn't resolve this episode</div>
            <p style="margin-top:8px;">This title isn't available on ${JIKAN.esc(provider.name)}. Try switching to another provider above, or open the anime in the catalog for more options.</p>
          </div>`;
          return;
        }
        // AniPub may list more playable episodes than Jikan reports — extend
        // the episode grid to match so every available episode is reachable.
        try {
          const info = await JIKAN.anipubEpisodes(animeData);
          if (info?.eps?.length > anipubEpCount) {
            anipubEpCount = info.eps.length;
            renderTheaterEps();
            const nextBtn = document.getElementById("nextEpBtn");
            if (nextBtn) nextBtn.disabled = ep >= listOfEpisodes().length;
          }
        } catch (e) {}
      } else if (provider.id === "anikoto") {
        // AniKoto resolves each episode to a megaplay embed URL via its
        // public catalog API (search → episodes → servers → stream). Timeboxed
        // the same way as AniPub so "Loading…" never persists.
        url = await Promise.race([
          JIKAN.anikotoUrl(animeData, ep, streamLang),
          new Promise((r) => setTimeout(() => r(null), 8000)),
        ]);
        if (!url) {
          frame.innerHTML = `<div class="stream-notice">
            <div class="not-found-title">Couldn't resolve this episode</div>
            <p style="margin-top:8px;">This title isn't available on ${JIKAN.esc(provider.name)}. Try switching to another provider above, or open the anime in the catalog for more options.</p>
          </div>`;
          return;
        }
        // Extend the episode grid to whatever AniKoto actually lists.
        try {
          const info = await JIKAN.anikotoEpisodes(animeData);
          if (info?.eps?.length > anikotoEpCount) {
            anikotoEpCount = info.eps.length;
            renderTheaterEps();
            const nextBtn = document.getElementById("nextEpBtn");
            if (nextBtn) nextBtn.disabled = ep >= listOfEpisodes().length;
          }
        } catch (e) {}
      } else if (provider.id === "megavid") {
        url = JIKAN.megavidUrl(animeData, ep, streamLang);
        if (!url) {
          frame.innerHTML = `<div class="stream-notice">This provider could not build a link for this episode.</div>`;
          return;
        }
      } else if (provider.id === "anixo") {
        url = await Promise.race([
          JIKAN.anixoUrl(animeData, ep, streamLang),
          new Promise((r) => setTimeout(() => r(null), 8000)),
        ]);
        if (!url) {
          frame.innerHTML = `<div class="stream-notice">
            <div class="not-found-title">Couldn't resolve this episode</div>
            <p style="margin-top:8px;">This title isn't available on ${JIKAN.esc(provider.name)}. Try switching to another provider above, or open the anime in the catalog for more options.</p>
          </div>`;
          return;
        }
      } else {
        if (!url) {
          frame.innerHTML = `<div class="stream-notice">This provider could not build a link for this episode.</div>`;
          return;
        }
      }

      // Build the iframe + loading overlay via DOM so each new episode gets a
      // fresh, clean player and the shimmer is hidden when it actually loads.
      // replaceChildren clears the initial "Loading…" shimmer first so it can
      // never linger on top of the player. When switching episodes on the SAME
      // provider the existing iframe element is reused — Chrome keeps its
      // autoplay allowance across navigations, so the next episode starts with
      // sound instead of re-entering Chrome's autoplay-mute policy.
      const loading = document.createElement("div");
      loading.className = "stream-loading";
      loading.innerHTML = `<div class="spinner"></div><span>Preparing player…</span>`;
      const hideLoad = () => loading.classList.add("hide");
      const reuse = playerIframe && playerIframeProvider === provider.id && playerIframe.isConnected;
      const iframe = reuse ? playerIframe : document.createElement("iframe");
      playerIframe = iframe;
      playerIframeProvider = provider.id;
      iframe.src = url;
      iframe.title = `${JIKAN.esc(provider.name)} — Episode ${ep}`;
      iframe.referrerPolicy = provider.referrerPolicy || "no-referrer";
      iframe.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
      // Some players (e.g. AniPub) refuse to run sandboxed — providers can
      // opt out via `sandbox: false` in config.js.
      if (provider.sandbox !== false) {
        iframe.setAttribute("sandbox", "allow-scripts allow-same-origin");
      }
      iframe.allowFullscreen = true;
      const onLoad = () => {
        hideLoad();
        iframe.dataset.loaded = "1";
        pushVolumeToPlayer();
        for (const t of [300, 1000, 2500]) {
          setTimeout(pushVolumeToPlayer, t);
        }
      };
      iframe.onload = onLoad;
      frame.replaceChildren(loading, iframe);
      setTimeout(hideLoad, 8000);
      // If the provider host is unreachable (no load event), auto-fall back to
      // the next provider once instead of leaving a dead player on screen.
      let fallbackDone = false;
      setTimeout(() => {
        if (fallbackDone || iframe.dataset.loaded) return;
        fallbackDone = true;
        const idx = activeEmbedIndex;
        const nxt = activeEmbedIndex + 1;
        const embed = getStreamingProviders().filter((p) => p.mode === "embed");
        if (nxt < embed.length) {
          showToast(`${provider.name} is unreachable — trying ${embed[nxt].name}…`);
          pickEmbedProvider(nxt);
        }
      }, 12000);
    }

    // Switch the AniPub player between subtitled and English-dubbed audio and
    // reload the current episode. Dub availability is pre-checked so a title
    // without an English dub falls back to sub instead of showing an error.
    async function setLang(lang) {
      if (lang === streamLang) return;
      if (lang === "dub") {
        const prov = activeProvider();
        try {
          if (prov?.id === "anikoto") {
            const ok = await JIKAN.anikotoDubAvailable(animeData);
            if (!ok) {
              showToast("No English dub for this title on AniKoto — try switching provider.");
              return;
            }
          } else if (prov?.id === "anipub") {
            const eps = listOfEpisodes();
            const idx = Math.min(Math.max(lastStreamEpisode - 1, 0), eps.length - 1);
            const info = await JIKAN.anipubEpisodes(animeData);
            const item = info?.eps?.[idx];
            if (item) {
              const ok = await JIKAN.anipubDubAvailable(item.id);
              if (!ok) {
                showToast("No English dub for this title on AniPub — try switching provider.");
                return;
              }
            }
          }
        } catch (e) {}
      }
      streamLang = lang;
      if (lastStreamEpisode) playEpisode(lastStreamEpisode);
    }

    // ---------- Volume: persisted, pushed to whatever player supports it ----------
    function playerVol() {
      return Math.max(0, Math.min(1, Number(localStorage.getItem("otk.playerVolume") ?? 1)));
    }
    // Send the persisted volume into the mounted player using that provider's
    // postMessage API. Only AniXo supports a real volume message; megavid-style
    // players only unmute/play. Re-sent on a heartbeat so Chrome's autoplay
    // mute on episode changes is corrected as soon as the player is ready.
    function pushVolumeToPlayer() {
      const f = document.querySelector("#watchFrame iframe");
      if (!f || !f.contentWindow) return;
      const prov = activeProvider();
      const v = playerVol();
      try {
        if (prov?.volumeControl === "full") {
          f.contentWindow.postMessage({ type: "aniko:setVolume", volume: v }, "*");
        } else if (prov?.volumeControl === "mute") {
          f.contentWindow.postMessage(v > 0 ? "unmute" : "mute", "*");
        }
      } catch (e) {}
    }
    function updateVolumeUI() {
      const vol = document.getElementById("watchVol");
      const hint = document.getElementById("watchVolHint");
      if (!vol) return;
      const ctrl = (activeProvider() || {}).volumeControl || "none";
      vol.disabled = ctrl === "none";
      vol.classList.toggle("is-disabled", ctrl === "none");
      if (hint) {
        hint.textContent = ctrl === "full" ? "Syncs with the AniXo player"
          : ctrl === "mute" ? "This player only allows mute/unmute"
          : "Use the player's on-screen volume";
      }
    }
    function initWatchVolume() {
      const vol = document.getElementById("watchVol");
      if (!vol) return;
      vol.value = Math.round(playerVol() * 100);
      vol.addEventListener("input", () => {
        const v = Number(vol.value) / 100;
        localStorage.setItem("otk.playerVolume", String(v));
        pushVolumeToPlayer();
      });
      // Heartbeat: re-apply the volume every 2s while a player is mounted so
      // it survives player reloads and Chrome's autoplay mute.
      setInterval(pushVolumeToPlayer, 2000);
      updateVolumeUI();
    }

    // ---------- Save to My List ----------
    let isSaved = false;
    async function loadSavedState() {
      const slot = document.getElementById("watchSaveSlot");
      if (!slot) return;
      if (!isLoggedIn()) {
        slot.innerHTML = `<button class="btn btn-outline btn-small" onclick="location.href='${pageHref("login")}'">Save</button>`;
        return;
      }
      try {
        const { data } = await supabase
          .from("saved_anime")
          .select("id")
          .eq("anime_mal_id", Number(id))
          .eq("user_id", currentUser.id)
          .maybeSingle();
        isSaved = !!data;
        renderSaveButton(slot);
      } catch (err) {
        slot.innerHTML = "";
      }
    }

    function renderSaveButton(slot) {
      slot.innerHTML = isSaved
        ? `<button class="btn btn-outline btn-small" onclick="unsaveAnime()">✓ Saved</button>`
        : `<button class="btn btn-primary btn-small" onclick="saveAnime()">＋ Save</button>`;
    }

    async function saveAnime() {
      if (!isLoggedIn()) return;
      try {
        await dbInsert("saved_anime", {
          user_id: currentUser.id,
          anime_mal_id: Number(id),
          anime_title: JIKAN.title(animeData),
          anime_image: animeData.images?.jpg?.image_url,
        });
        isSaved = true;
        awardXp(5); // +5 XP for saving an anime
        awardRp("save"); // +3 RP
        showToast("Saved to My List! +5 XP");
        renderSaveButton(document.getElementById("watchSaveSlot"));
      } catch (err) {
        showToast("Could not save: " + err.message);
      }
    }

    async function unsaveAnime() {
      try {
        await supabase.from("saved_anime").delete().eq("anime_mal_id", Number(id)).eq("user_id", currentUser.id);
        isSaved = false;
        showToast("Removed from My List");
        renderSaveButton(document.getElementById("watchSaveSlot"));
      } catch (err) {
        showToast("Could not remove");
      }
    }
  </script>
</body>
