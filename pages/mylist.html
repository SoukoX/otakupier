<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="msvalidate.01" content="4F55345C289F9597335C55566F2B31F9" />

  <title>My Anime List - OtakuPier</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Your saved anime list on OtakuPier — track the shows you love.">
  <link rel="canonical" href="https://otakupier.2bd.net/pages/mylist">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="preconnect" href="https://api.jikan.moe">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://graphql.anilist.co">
  <link rel="preconnect" href="https://api.mangadex.org">
  <link rel="stylesheet" href="../css/style.css?v=25">
<link rel="dns-prefetch" href="https://soukox.goatcounter.com">
<script data-goatcounter="https://soukox.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="container">
    <h1 style="display:none;">My List - OtakuPier</h1>
    <div class="section-head">
      <h2>My List</h2>
    </div>
    <div class="cat-type-toggle" style="padding:0 0 12px;">
      <button class="cat-type-btn active" data-list="anime" onclick="switchList('anime')">Anime</button>
      <button class="cat-type-btn" data-list="manga" onclick="switchList('manga')">Manga</button>
    </div>
    <div class="grid" id="savedGrid"></div>
  </main>

  <footer id="siteFooter"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js?v=25"></script>
  <script src="../js/api.js?v=25"></script>
  <script src="../js/app.js?v=25"></script>
  <script>
    let currentList = "anime";

    function switchList(type) {
      currentList = type;
      document.querySelectorAll(".cat-type-btn").forEach(b => b.classList.toggle("active", b.dataset.list === type));
      loadList();
    }

    async function loadList() {
      const grid = document.getElementById("savedGrid");
      grid.innerHTML = skeletonGrid(12);
      if (!isLoggedIn()) {
        grid.innerHTML = `<div class="empty-state">
          <a href="login.html" class="btn btn-primary">Login</a>
          <p style="margin-top:12px;">Login to save anime and manga to your list.</p>
        </div>`;
        return;
      }
      if (currentList === "manga") {
        await loadSavedManga();
      } else {
        await loadSavedAnime();
      }
    }

    async function loadSavedAnime() {
      const grid = document.getElementById("savedGrid");
      try {
        const { data, error } = await supabase
          .from("saved_anime")
          .select("*")
          .eq("user_id", currentUser.id)
          .order("created_at", { ascending: false });
        if (error) throw error;
        grid.innerHTML = "";
        if (!data.length) {
          grid.innerHTML = `<div class="empty-state">
            No anime saved yet. Browse the <a href="catalog.html" style="color:var(--accent)">catalog</a> and hit "Save to My List".</div>`;
          return;
        }
        data.forEach((s) => {
          const el = document.createElement("div");
          el.className = "anime-card";
          el.innerHTML = `
            <div class="poster">
              <img src="${s.anime_image || JIKAN.PLACEHOLDER}"
                   alt="${JIKAN.esc(s.anime_title)}" loading="lazy"
                   onerror="this.onerror=null;this.src=JIKAN.PLACEHOLDER">
            </div>
            <div class="info">
              <div class="title">${JIKAN.esc(s.anime_title)}</div>
              <div class="meta">
                <button class="btn btn-danger btn-small" onclick="unsaveAnime(${s.anime_mal_id}, this)">Remove</button>
              </div>
            </div>`;
          el.addEventListener("click", (e) => {
            if (e.target.closest("button")) return;
            window.location.href = `${pageHref("anime")}?id=${s.anime_mal_id}`;
          });
          grid.appendChild(el);
        });
      } catch (err) {
        grid.innerHTML = `<div class="empty-state">Could not load your list.</div>`;
      }
    }

    async function loadSavedManga() {
      const grid = document.getElementById("savedGrid");
      try {
        const { data, error } = await supabase
          .from("saved_manga")
          .select("*")
          .eq("user_id", currentUser.id)
          .order("updated_at", { ascending: false });
        if (error) throw error;
        grid.innerHTML = "";
        if (!data.length) {
          grid.innerHTML = `<div class="empty-state">
            No manga saved yet. Browse the <a href="catalog.html?type=manga" style="color:var(--accent)">manga catalog</a> and hit "Save".</div>`;
          return;
        }
        data.forEach((s) => {
          const el = document.createElement("div");
          el.className = "anime-card";
          const hasChapter = s.last_chapter && s.last_chapter !== "";
          const readerUrl = pageHref("mangareader") + "?id=" + encodeURIComponent(s.manga_id) + "&title=" + encodeURIComponent(s.manga_title) + (hasChapter ? "&ch=" + encodeURIComponent(s.last_chapter) : "");
          el.innerHTML = `
            <div class="poster">
              <img src="${s.manga_image || JIKAN.PLACEHOLDER}"
                   alt="${JIKAN.esc(s.manga_title)}" loading="lazy"
                   onerror="this.onerror=null;this.src=JIKAN.PLACEHOLDER">
            </div>
            <div class="info">
              <div class="title">${JIKAN.esc(s.manga_title)}</div>
              ${hasChapter ? '<div class="meta" style="color:var(--accent-3);font-size:.8rem;">📖 Ch. ' + JIKAN.esc(s.last_chapter) + '</div>' : ''}
              <div class="meta">
                ${hasChapter ? '<a class="btn btn-primary btn-small" href="' + readerUrl + '">Continue</a>' : '<a class="btn btn-outline btn-small" href="' + pageHref("manga") + '?id=' + encodeURIComponent(s.manga_id) + '">View</a>'}
                <button class="btn btn-danger btn-small" onclick="unsaveManga('${JIKAN.esc(s.manga_id)}', this)">Remove</button>
              </div>
            </div>`;
          el.addEventListener("click", (e) => {
            if (e.target.closest("button") || e.target.closest("a")) return;
            window.location.href = pageHref("manga") + "?id=" + encodeURIComponent(s.manga_id);
          });
          grid.appendChild(el);
        });
      } catch (err) {
        grid.innerHTML = `<div class="empty-state">Could not load your list.</div>`;
      }
    }

    async function unsaveAnime(malId, btn) {
      try {
        await supabase.from("saved_anime").delete().eq("anime_mal_id", malId).eq("user_id", currentUser.id);
        const card = btn.closest(".anime-card");
        if (card) card.remove();
        showToast("Removed from My List");
      } catch (err) {
        showToast("Could not remove");
      }
    }

    async function unsaveManga(mangaId, btn) {
      try {
        await supabase.from("saved_manga").delete().eq("manga_id", mangaId).eq("user_id", currentUser.id);
        const card = btn.closest(".anime-card");
        if (card) card.remove();
        showToast("Removed from My List");
      } catch (err) {
        showToast("Could not remove");
      }
    }

    document.addEventListener("DOMContentLoaded", loadList);
  </script>
</body>
</html>
