<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="msvalidate.01" content="4F55345C289F9597335C55566F2B31F9" />

  <title>Profile - OtakuPier</title>
  <meta name="robots" content="index, follow">
  <meta name="description" content="User profile on OtakuPier — rank, reviews and activity.">
  <link rel="canonical" href="https://otakupier.2bd.net/pages/profile.html">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="preconnect" href="https://api.jikan.moe">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="../css/style.css?v=20">
<script data-goatcounter="https://soukox.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

<main class="container" id="main">
     <div class="loading"><div class="spinner"></div>Loading profile...</div>
   </main>

   <h1 style="display:none;">User Profile - OtakuPier</h1>

   <footer id="siteFooter"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js?v=20"></script>
  <script src="../js/api.js?v=20"></script>
  <script src="../js/app.js?v=20"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    let userId = params.get("id");
    let profileUser = null;

    async function load() {
      const main = document.getElementById("main");
      // No id param = my own profile
      if (!userId) {
        if (!isLoggedIn()) {
          main.innerHTML = `<div class="empty-state"><a href="login.html" class="btn btn-primary">Login</a>
            <p style="margin-top:12px;">Login to see your profile.</p></div>`;
          return;
        }
        userId = currentUser.id;
      }
      const st = await userStats(userId);
      if (!st.profile) {
        main.innerHTML = `<div class="empty-state">User not found.</div>`;
        return;
      }
      profileUser = st.profile;
      document.title = `${st.profile.name || "User"} - OtakuPier`;

      const isSelf = isLoggedIn() && currentUser.id === userId;
      const perks = await spendingsMap([userId]);
      const perk = perks[userId] || {};
      const profileBanner = perk.profile_banner ? "premium" : "default";
      const rank = effectiveRank(st.profile);
      const prog = st.profile.is_admin
        ? { cur: rank, next: null, pct: 1 }
        : xpProgress(st.profile.xp);
      const badges = badgesFor(st.profile, st.counts);
      const joined = new Date(st.profile.created_at).toLocaleDateString();

      const badgeHtml = badges.length
        ? badges.map((b) => `<span class="badge-chip" title="${b.label}">${b.icon} ${b.label}</span>`).join("")
        : `<span style="color:var(--text-dim); font-size:.85rem;">No badges yet — keep participating!</span>`;

      main.innerHTML = `
        <div class="profile-banner banner-${profileBanner}"></div>
        <div class="profile-card">
          <div style="display:flex; flex-direction:column; align-items:center; flex:0 0 auto;">
            <div class="avatar-lg${perk.avatar_ring ? " avatar-ring" : ""}${isSelf ? " avatar-clickable" : ""}"${isSelf ? ' title="Click to change avatar" onclick="toggleAvatarPicker()"' : ""}>${st.profile.avatar_url
              ? `<img src="${JIKAN.safeImg(st.profile.avatar_url)}" alt="${JIKAN.esc(st.profile.name || "User")} avatar">`
              : (st.profile.name || "U").charAt(0).toUpperCase()}</div>
            ${isSelf ? `<div style="text-align:center; margin-top:8px; font-size:.78rem; color:var(--text-dim);">Click your avatar to change it</div>` : ""}
          </div>
          <div style="flex:1; min-width:220px;">
            <h2 style="margin:0 0 4px;">${prestigeNameHTML(st.profile, perk)}</h2>
            ${perk.custom_title ? `<div class="custom-title">${JIKAN.esc(String(perk.custom_title))}</div>` : ""}
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              ${rankTag(userId, st.profile)}
              <span style="color:var(--text-dim); font-size:.85rem;">Joined ${joined}</span>
            </div>
            <div style="color:var(--text-dim); font-size:.75rem; margin-top:2px;">ID: <code id="profileUserId" style="font-size:.72rem; word-break:break-all; cursor:pointer;" title="Click to copy" onclick="copyProfileUserId()">${JIKAN.esc(userId)}</code> <button class="btn btn-outline btn-small" onclick="copyProfileUserId()" style="padding:1px 8px; font-size:.7rem;">Copy</button></div>
            ${st.profile.bio ? `<p style="margin:10px 0 0; color:var(--text-dim);">${JIKAN.esc(st.profile.bio)}</p>` : ""}
            <div class="stat-strip">
              <div class="stat"><b>${st.counts.reviews}</b> reviews</div>
              <div class="stat"><b>${st.counts.saved}</b> saved</div>
              <div class="stat"><b>${st.counts.votes}</b> votes</div>
              <div class="stat"><b>${st.counts.chat}</b> messages</div>
              <div class="stat"><b>${st.counts.likes}</b> likes given</div>
            </div>
            <div style="margin-top:14px; max-width:420px;">
              <div style="display:flex; justify-content:space-between; font-size:.8rem; color:var(--text-dim); margin-bottom:4px;">
                <span>${rank.icon} ${rank.name}</span>
                <span>${st.profile.xp || 0} XP${prog.next ? ` / next rank: ${prog.next.icon} ${prog.next.name}` : " (max rank!)"}</span>
              </div>
              <div class="xp-bar"><div style="width:${Math.round(prog.pct * 100)}%"></div></div>
            </div>
          </div>
          ${isSelf ? "" : `
            <div style="display:flex; flex-direction:column; gap:10px; min-width:140px;">
              <div id="friendBtn"></div>
              <a class="btn btn-outline" href="dms.html?with=${userId}">Message</a>
            </div>`}
        </div>

        <h3 class="sub-head">Badges</h3>
        <div class="badge-grid" style="margin-bottom:24px;">${badgeHtml}</div>

        <h3 class="sub-head">Reviews &amp; Comments</h3>
        <div id="reviews"></div>`;

      if (isSelf) {
        main.insertAdjacentHTML("afterbegin", `<div style="margin-bottom:16px;"><a class="btn btn-outline" href="mylist.html">My List</a> <a class="btn btn-outline" href="friends.html">Friends</a></div>`);
        renderInvitePanel();
        renderRewardShop();
      }
      if (!isSelf) loadFriendButton();
      loadProfileReviews();
    }

    async function loadFriendButton() {
      const slot = document.getElementById("friendBtn");
      if (!slot) return;
      if (!isLoggedIn()) {
        slot.innerHTML = `<a class="btn btn-outline" href="login.html">Add friend</a>`;
        return;
      }
      if (currentUser.id === userId) { slot.innerHTML = ""; return; }
      try {
        const { data } = await supabase
          .from("friendships")
          .select("*")
          .or(`and(requester_id.eq.${currentUser.id},addressee_id.eq.${userId}),and(requester_id.eq.${userId},addressee_id.eq.${currentUser.id})`)
          .maybeSingle();
        if (!data) {
          slot.innerHTML = `<button class="btn btn-primary" onclick="sendFriendReq()">Add friend</button>`;
        } else if (data.status === "accepted") {
          slot.innerHTML = `<button class="btn btn-outline" onclick="unfriend()">Unfriend</button>`;
        } else if (data.requester_id === currentUser.id) {
          slot.innerHTML = `<button class="btn btn-outline" disabled>Request sent</button>`;
        } else {
          slot.innerHTML = `<button class="btn btn-primary" onclick="acceptFriendReq('${data.id}')">Accept request</button>`;
        }
      } catch (e) {
        slot.innerHTML = "";
      }
    }

    async function sendFriendReq() {
      try {
        await dbInsert("friendships", { requester_id: currentUser.id, addressee_id: userId, status: "pending" });
        showToast("Friend request sent!");
        loadFriendButton();
      } catch (err) {
        showToast("Could not send request");
      }
    }

    async function acceptFriendReq(fid) {
      try {
        await supabase.from("friendships").update({ status: "accepted" }).eq("id", fid);
        showToast("You are now friends! +10 XP +10 RP");
        awardXp(10);
        awardRp("friend");
        loadFriendButton();
      } catch (err) {
        showToast("Could not accept");
      }
    }

    async function unfriend() {
      try {
        await supabase.from("friendships")
          .delete()
          .or(`and(requester_id.eq.${currentUser.id},addressee_id.eq.${userId}),and(requester_id.eq.${userId},addressee_id.eq.${currentUser.id})`);
        showToast("Unfriended");
        loadFriendButton();
      } catch (err) {
        showToast("Could not unfriend");
      }
    }

    async function loadProfileReviews() {
      const slot = document.getElementById("reviews");
      try {
        const { data, error } = await supabase
          .from("reviews")
          .select("*")
          .eq("user_id", userId)
          .is("parent_id", null)
          .order("created_at", { ascending: false })
          .limit(50);
        if (error) throw error;
        slot.innerHTML = "";
        if (!data.length) {
          slot.innerHTML = `<div class="empty-state">No reviews yet.</div>`;
          return;
        }
        data.forEach((r) => {
          const el = document.createElement("div");
          el.className = "review";
          const stars = r.rating
            ? `<span class="stars">${"\u2605".repeat(r.rating)}<span style="opacity:.25">${"\u2605".repeat(10 - r.rating)}</span></span>`
            : `<span class="review-date" style="padding:2px 8px; background:rgba(0,212,168,.12); border-radius:999px;">Comment</span>`;
          el.innerHTML = `
            <div class="review-top">
              <a href="anime.html?id=${r.anime_mal_id}" class="review-author" style="color:var(--text); text-decoration:none;">
                <div class="avatar" style="cursor:pointer;">${JIKAN.esc(r.anime_title || "Anime").charAt(0).toUpperCase()}</div>
                ${JIKAN.esc(r.anime_title || "Anime")}
              </a>
              ${stars}
            </div>
            <div class="review-date">${new Date(r.created_at).toLocaleString()}</div>
            <p style="margin-top:8px;">${JIKAN.esc(r.text)}</p>`;
          slot.appendChild(el);
        });
      } catch (err) {
        slot.innerHTML = `<div class="empty-state">Could not load reviews.</div>`;
      }
    }

    // ---------- Invite / Referral ----------
    async function renderInvitePanel() {
      let slot = document.getElementById("invitePanel");
      if (!slot) {
        slot = document.createElement("div");
        slot.id = "invitePanel";
        document.getElementById("main").insertAdjacentElement("beforeend", slot);
      }
      let code = "";
      try {
        const { data } = await supabase.from("invites")
          .select("code, used_by, created_at")
          .eq("inviter_id", currentUser.id)
          .order("created_at", { ascending: false })
          .limit(10);
        const active = (data || []).filter((i) => !i.used_by);
        const used = (data || []).filter((i) => i.used_by);
        code = active[0]?.code || "";
        if (!code) {
          const { data: made } = await supabase.rpc("create_invite");
          if (made) code = made;
        }
        const base = `${window.location.origin}${window.location.pathname.replace(/profile\.html.*$/, "signup.html")}`;
        const link = `${base}?invite=${code}`;
        slot.innerHTML = `
          <h3 class="sub-head">Invite friends</h3>
          <div class="invite-card">
            <p style="margin:0 0 8px; color:var(--text-dim); font-size:.9rem;">
              Give your friends this link — when they sign up you both get <b>20,000 Reward Points</b> each!
            </p>
            ${code ? `
              <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <input id="inviteLink" type="text" readonly value="${JIKAN.esc(link)}" style="flex:1; min-width:200px; padding:9px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);">
                <button class="btn btn-primary" onclick="copyInviteLink()">Copy link</button>
                <button class="btn btn-outline" onclick="genInvite()">New code</button>
              </div>
              <div style="margin-top:8px; font-size:.8rem; color:var(--text-dim);">
                ${active.length} active invite${active.length === 1 ? "" : "s"} · ${used.length} used · earn up to 10 bonuses/day
              </div>`
            : `<p style="color:var(--text-dim);">Couldn't create an invite right now — try again in a moment.</p>`}
          </div>`;
      } catch (e) {
        slot.innerHTML = `<h3 class="sub-head">Invite friends</h3><div class="invite-card"><p style="color:var(--text-dim);">Invites are unavailable right now.</p></div>`;
      }
    }

    async function genInvite() {
      const { data } = await supabase.rpc("create_invite");
      if (data) renderInvitePanel();
      else showToast("You already have 10 active invites — use one first.");
    }

    function copyInviteLink() {
      const input = document.getElementById("inviteLink");
      if (!input) return;
      input.select();
      try { navigator.clipboard.writeText(input.value); } catch (e) {}
      showToast("Invite link copied!");
    }

    // ---------- Reward Shop ----------
    async function renderRewardShop() {
      let slot = document.getElementById("rewardShop");
      if (!slot) {
        slot = document.createElement("div");
        slot.id = "rewardShop";
        document.getElementById("main").insertAdjacentElement("beforeend", slot);
      }

      const [profRes, spendRes, txRes] = await Promise.all([
        supabase.from("profiles").select("rp, rp_earned, xp").eq("id", currentUser.id).maybeSingle(),
        supabase.from("spendings").select("*").eq("user_id", currentUser.id),
        supabase.from("reward_transactions").select("*").eq("user_id", currentUser.id).order("created_at", { ascending: false }).limit(10),
      ]);
      const profile = profRes.data || {};
      const owned = (spendRes.data || []).filter((s) => s.active && (!s.expires_at || new Date(s.expires_at) > new Date()));
      const ownedIds = new Set(owned.map((s) => s.item_id));
      const txs = txRes.data || [];

      slot.innerHTML = `
        <h3 class="sub-head" style="margin-top:36px;">⛁ Reward Shop</h3>
        <div class="reward-balance">
          <div><span>⛁ ${profile.rp || 0}</span><small>Available points</small></div>
          <div><span>${profile.rp_earned || 0}</span><small>Earned all-time</small></div>
        </div>
        <p style="color:var(--text-dim); font-size:.9rem; margin-bottom:16px;">
          Earn points by reviewing, voting, saving anime, posting in forums &amp; clubs, chatting, and getting your watch links approved.
          Spend them on prestige and power perks that set you apart.
        </p>
        <div class="shop-grid">
          ${RP_SHOP.map((item) => {
            const own = ownedIds.has(item.id);
            const itemRow = owned.find((s) => s.item_id === item.id);
            return `
              <div class="shop-card">
                <div class="shop-icon">${item.icon}</div>
                <div class="shop-name">${item.name}</div>
                <div class="shop-desc">${item.desc}</div>
                <div class="shop-meta">
                  <span class="shop-price">⛁ ${item.price}</span>
                  <span class="shop-duration">${item.duration || "Permanent"}</span>
                </div>
                ${own
                  ? `<span class="shop-owned">Owned${itemRow?.expires_at ? ` — till ${new Date(itemRow.expires_at).toLocaleDateString()}` : ""}</span>
                     ${renderConfigEditor(item, itemRow)}`
                  : `<button class="btn btn-primary btn-block" onclick="buyReward('${item.id}')">${(profile.rp || 0) >= item.price ? "Buy" : "Not enough ⛁"}</button>`}
              </div>`;
          }).join("")}
        </div>
        ${txs.length ? `
          <h4 class="sub-head" style="margin-top:28px;">Recent activity</h4>
          <div class="tx-list">
            ${txs.map((t) => `
              <div class="tx-row">
                <span style="color:${t.amount < 0 ? "var(--danger)" : "var(--accent-3)"};">${t.amount > 0 ? `+${t.amount} ⛁` : `${t.amount} ⛁`}</span>
                <span class="tx-reason">${JIKAN.esc(reasonLabel(t))}</span>
                <span class="tx-date">${new Date(t.created_at).toLocaleDateString()}</span>
              </div>`).join("")}
          </div>` : ""}`;

      // Refresh the balance chip / header after a purchase
      slot._refresh = async () => {
        const r = await supabase.from("profiles").select("rp, rp_earned").eq("id", currentUser.id).maybeSingle();
        if (r.data) {
          const b = slot.querySelector(".reward-balance");
          if (b) b.innerHTML = `<div><span>⛁ ${r.data.rp || 0}</span><small>Available points</small></div>
            <div><span>${r.data.rp_earned || 0}</span><small>Earned all-time</small></div>`;
        }
      };
    }

    function reasonLabel(t) {
      const map = {
        review: "Review", reply: "Reply", like_received: "Like received", vote: "Vote",
        save: "Saved anime", thread: "Forum thread", forum_reply: "Forum reply",
        club: "Created club", club_join: "Joined club", club_post: "Club post",
        friend: "Friend accepted", chat: "Chat message", link_approved: "Watch link approved",
      };
      if (t.reason.startsWith("spend:")) {
        const item = rpShopItem(t.reason.slice(6));
        return `Bought ${item ? item.name : t.reason.slice(6)}`;
      }
      if (t.reason.startsWith("admin:")) return `Admin adjustment`;
      return map[t.reason] || t.reason || "Activity";
    }

    function renderConfigEditor(item, row) {
      if (item.id === "name_color") {
        const current = row?.config || "#e6465c";
        return `
          <div class="config-editor">
            <input type="color" id="cfgColor" value="${current}" onchange="setColor()" style="width:100%; height:36px; border:none; background:none; cursor:pointer;">
          </div>`;
      }
      if (item.id === "custom_title") {
        return `
          <div class="config-editor">
            <input type="text" id="cfgTitle" maxlength="24" placeholder="Your title..." value="${JIKAN.esc(row?.config || "")}" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text);">
            <button class="btn btn-outline btn-small" onclick="saveTitle()">Save title</button>
          </div>`;
      }
      return "";
    }

    async function buyReward(itemId) {
      const res = await buyRpItem(itemId, itemId === "name_color" ? "#e6465c" : "");
      if (res.ok) {
        showToast("Purchased! Enjoy your new perk.");
        renderRewardShop();
      } else {
        showToast(res.message || "Could not purchase");
      }
    }

    async function setColor() {
      const v = document.getElementById("cfgColor")?.value;
      if (!v) return;
      const res = await setRpConfig("name_color", v);
      if (res.ok) showToast("Name color updated!");
      else showToast(res.message || "Update failed");
    }

    async function saveTitle() {
      const v = document.getElementById("cfgTitle")?.value.trim();
      if (!v) { showToast("Enter a title"); return; }
      const res = await setRpConfig("custom_title", v);
      if (res.ok) { showToast("Title updated!"); renderRewardShop(); }
      else showToast(res.message || "Update failed");
    }

    async function copyProfileUserId() {
      const el = document.getElementById("profileUserId");
      if (!el) return;
      try {
        await navigator.clipboard.writeText(el.textContent.trim());
        showToast("User ID copied!");
      } catch (e) {
        showToast("Could not copy");
      }
    }

    // ---------- Avatar picker (non-copyright presets) ----------
    // Preset avatars are DiceBear illustrations (MIT/open licensed, same style
    // as the seeded community) — no upload storage needed. Swap in your own
    // style URL list if you prefer different art.
    const PRESET_BG = ["b6e3f4", "c0aede", "ffd5dc", "ffdfbf", "d1f4d9", "f5d5ff"];

    function presetAvatar(style, seed) {
      return `https://api.dicebear.com/9.x/${style}/svg?seed=${encodeURIComponent(seed)}&backgroundColor=${PRESET_BG[(seed.charCodeAt(0) || 0) % PRESET_BG.length]}`;
    }

    function presetGrid() {
      const styles = ["adventurer", "avataaars", "lorelei", "big-smile", "bottts-neutral", "fun-emoji"];
      const seeds = ["Sora", "Kaito", "Yuki", "Akira", "Mirai", "Hana", "Ryo", "Tenshi", "Ren", "Nao", "Iro", "Momo"];
      const out = [];
      for (let s = 0; s < styles.length; s++) {
        for (let i = 0; i < 4; i++) {
          const seed = seeds[(s * 4 + i) % seeds.length];
          out.push(seed + "|" + styles[s]);
        }
      }
      return out;
    }

    async function toggleAvatarPicker() {
      let slot = document.getElementById("avatarPicker");
      if (slot) { slot.remove(); return; }
      if (!isLoggedIn()) return;
      slot = document.createElement("div");
      slot.id = "avatarPicker";
      document.getElementById("main").insertAdjacentElement("afterbegin", slot);

      const { data: prof } = await supabase.from("profiles")
        .select("avatar_url").eq("id", currentUser.id).maybeSingle();
      const curName = getProfile().name || "User";
      const curAvatar = (prof && prof.avatar_url) || "";

      slot.innerHTML = `
        <div class="edit-profile-card">
          <h3 class="sub-head">Choose an avatar</h3>
          <p style="color:var(--text-dim); font-size:.85rem; margin:0 0 12px;">Pick any of these free, non-copyright avatars. They're generated from open-source art — safe to use anywhere.</p>
          <div style="display:flex; gap:10px; align-items:center; margin-bottom:12px;">
            <div class="avatar-lg avatar-preview">${`<img src="${JIKAN.safeImg(curAvatar || presetAvatar("adventurer", curName))}" alt="Current avatar preview">`}</div>
            <div style="color:var(--text-dim); font-size:.8rem;">Current avatar preview</div>
          </div>
          <div class="avatar-grid" id="avatarGrid">
            ${presetGrid().map((key) => {
              const [seed, style] = key.split("|");
              const url = presetAvatar(style, seed);
              return `<button type="button" class="avatar-choice" data-url="${JIKAN.esc(url)}" onclick="pickAvatar(this)" title="${style}">
                <img src="${url}" alt="${style} avatar preset" loading="lazy" onerror="this.closest('.avatar-choice').style.display='none'">
              </button>`;
            }).join("")}
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;">
            <button class="btn btn-primary" onclick="saveAvatar()">Set avatar</button>
            <button class="btn btn-outline" onclick="toggleAvatarPicker()">Cancel</button>
          </div>
        </div>`;

      // Highlight whichever preset is currently in use
      slot.querySelectorAll(".avatar-choice").forEach((b) => {
        if (b.dataset.url === curAvatar) b.classList.add("avatar-selected");
      });
    }

    function pickAvatar(btn) {
      document.querySelectorAll(".avatar-choice").forEach((b) => b.classList.remove("avatar-selected"));
      btn.classList.add("avatar-selected");
      const img = document.querySelector(".avatar-preview img");
      if (img) img.src = btn.dataset.url;
      window._pickedAvatar = btn.dataset.url;
    }

    async function saveAvatar() {
      if (!window._pickedAvatar) { showToast("Pick an avatar first"); return; }
      try {
        const { error } = await supabase.from("profiles")
          .update({ avatar_url: window._pickedAvatar }).eq("id", currentUser.id);
        if (error) throw error;
        currentProfile = { ...(currentProfile || {}), avatar_url: window._pickedAvatar };
        showToast("Avatar updated!");
        toggleAvatarPicker();
        load();
      } catch (e) {
        showToast("Could not save: " + e.message);
      }
    }

    document.addEventListener("DOMContentLoaded", load);
  </script>
</body>
</html>
