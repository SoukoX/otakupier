  <script>
    const id = new URLSearchParams(window.location.search).get("id");
    let animeData = null;
    let episodeCount = 0;

    async function loadAnime() {
      const main = document.getElementById("main");
      try {
        // Admin-added custom anime (not on MyAnimeList) render first
        if (supabase) {
          const { data: custom } = await supabase
            .from("custom_anime").select("*").eq("id", Number(id)).maybeSingle();
          if (custom) { renderCustom(custom); return; }
        }

        const res = await JIKAN.getAnime(id);
        animeData = res.data;

        // Apply admin-curated overrides (title / image / synopsis / status)
        if (supabase) {
          try {
            const { data: edit } = await supabase
              .from("anime_edits").select("*").eq("mal_id", Number(id)).maybeSingle();
            if (edit) {
              const a = animeData;
              if (edit.title) { a.title = edit.title; a.title_english = edit.title; }
              if (edit.synopsis) a.synopsis = edit.synopsis;
              if (edit.image_url) {
                a.images = a.images || {};
                a.images.jpg = a.images.jpg || {};
                a.images.jpg.image_url = edit.image_url;
                a.images.jpg.large_image_url = edit.image_url;
              }
              if (edit.status) a.status = edit.status;
            }
          } catch (e) {}
        }

        renderHeader();
        renderShareRow();
        renderTrailer();
        SEO.setAnimeMeta(animeData);
        loadNextEpisode();
        // Warm the MAL→AniList mapping used by the AniXo embed.
        JIKAN.anilistIdOf(animeData.mal_id).catch(() => {});
        loadSavedState();
        // Characters + episodes fetch in parallel (they're independent)
        await Promise.all([loadCharacters(), loadEpisodes()]);
      } catch (err) {
        SEO.setDefaultMeta("Anime not found - OtakuPier", "This anime could not be loaded.");
        main.innerHTML = `<div class="empty-state">Could not load this anime.</div>`;
      }
    }

    // Render an admin-added custom anime entry
    function renderCustom(c) {
      const main = document.getElementById("main");
      document.title = `${c.title} - OtakuPier`;
      animeData = {
        mal_id: c.id,
        title: c.title,
        title_english: c.title,
        title_japanese: c.jp_title,
        synopsis: c.synopsis || "No description yet.",
        score: null,
        type: c.type || "Anime",
        status: c.status || "Unknown",
        episodes: null,
        images: { jpg: { large_image_url: c.image_url || "", image_url: c.image_url || "" } },
      };
      main.innerHTML = `
        <div style="margin-bottom:14px;">
          <a class="btn btn-outline btn-small" href="#" onclick="location.href=pageHref('catalog');return false;">&larr; Back</a>
        </div>
        <div class="detail-header">
          <div class="detail-poster">
            <img src="${c.image_url || JIKAN.PLACEHOLDER}"
                 alt="${JIKAN.esc(c.title)}" onerror="this.onerror=null;this.src=JIKAN.PLACEHOLDER">
          </div>
          <div>
            <h1 class="detail-title">${JIKAN.esc(c.title)}</h1>
            ${c.jp_title ? `<div class="detail-jtitle">${JIKAN.esc(c.jp_title)}</div>` : ""}
            <div class="detail-stats">
              <span class="stat">Year: <strong>${c.year || "N/A"}</strong></span>
              <span class="stat">Type: <strong>${JIKAN.esc(c.type || "Anime")}</strong></span>
              <span class="stat">Status: <strong>${JIKAN.esc(c.status || "Unknown")}</strong></span>
            </div>
            <p class="detail-synopsis">${JIKAN.esc(c.synopsis || "No description yet.")}</p>
            <span class="pill" style="background:rgba(255,196,0,.15); color:#ffc400;">Community entry</span>
            <div class="share-row" id="shareRow"></div>
          </div>
        </div>

        <div id="saveSlot" style="margin-top:14px;"></div>`;

      SEO.setAnimeMeta(animeData);
      renderShareRow();
      loadSavedState();
    }

    function renderHeader() {
      const a = animeData;
      const synopsis = (a.synopsis || "No synopsis available.").replace(/\[Written by MAL Rewrite\]/, "");
      const mainTitle = a.title_english || a.title;
      const jpTitle = a.title_japanese || (a.title_english ? a.title : "");
      document.title = `${mainTitle} - OtakuPier`;

      const genres = (a.genres || []).map((g) => `<span class="genre-tag">${g.name}</span>`).join("");
      const studios = (a.studios || []).map((s) => s.name).join(", ") || "N/A";
      const licensors = (a.licensors || []).map((s) => s.name).join(", ") || "N/A";
      const aired = a.aired?.string || "N/A";

      document.getElementById("main").innerHTML = `
        <div style="margin-bottom:14px;">
          <a class="btn btn-outline btn-small" href="#" onclick="location.href=pageHref('catalog');return false;">&larr; Back</a>
        </div>
        <div class="anime-hero">
          <div class="anime-hero-bg" aria-hidden="true" style="background-image:url('${JIKAN.esc(a.images?.jpg?.large_image_url || a.images?.jpg?.image_url || "")}')"></div>
          <div class="anime-hero-overlay" aria-hidden="true"></div>
          <div class="anime-hero-inner">
            <div class="detail-poster">
              <img src="${a.images?.jpg?.large_image_url || a.images?.jpg?.image_url || JIKAN.PLACEHOLDER}"
                   alt="${JIKAN.esc(mainTitle)}" onerror="this.onerror=null;this.src=JIKAN.PLACEHOLDER">
            </div>
            <div class="anime-hero-body">
              <div class="anime-hero-kicker">${JIKAN.esc(a.type || "Anime")}${a.year ? " · " + a.year : ""}</div>
              <h1 class="detail-title">${JIKAN.esc(mainTitle)}</h1>
              ${jpTitle ? `<div class="detail-jtitle">${JIKAN.esc(jpTitle)}</div>` : ""}
              <div class="detail-meta-line">
                ${a.episodes ? `<span class="meta-item">${a.episodes} eps</span>` : ""}
                ${a.status ? `<span class="meta-item">${JIKAN.esc(a.status)}</span>` : ""}
                ${a.score ? `<span class="meta-score" title="MyAnimeList score">★ ${a.score.toFixed(2)}</span>` : ""}
                ${a.rank ? `<span class="meta-item">Rank #${a.rank}</span>` : ""}
              </div>
              <div class="detail-hero-actions">
                <button class="btn btn-primary btn-glow watch-hero-btn" id="watchNowBtn" onclick="startWatching()">▶ Watch Now</button>
                <button class="btn btn-outline watch-hero-trailer" id="trailerBtn" onclick="scrollToTrailer()" style="display:none;">▶ Trailer</button>
              </div>
              <div id="nextEpSlot"></div>
              <div class="detail-genres">${genres}</div>
              <p class="detail-synopsis">${JIKAN.esc(synopsis)}</p>
              <div class="share-row" id="shareRow"></div>
              <div id="watchSlot"></div>
              <div id="mangaLinks" style="margin-top:20px; padding-top:18px; border-top:1px solid rgba(255,255,255,0.08);"></div>
            </div>
          </div>
        </div>

        <div class="detail-facts">
          <span class="fact">Studio: <b>${JIKAN.esc(studios)}</b></span>
          <span class="fact">Aired: <b>${JIKAN.esc(aired)}</b></span>
          <span class="fact">Licensors: <b>${JIKAN.esc(licensors)}</b></span>
          <span class="fact">Source: <b>${JIKAN.esc(a.source || "N/A")}</b></span>
          <span class="fact">Rating: <b>${JIKAN.esc(a.rating || "N/A")}</b></span>
          <span class="fact">Duration: <b>${JIKAN.esc(a.duration || "N/A")}</b></span>
        </div>

        <div id="saveSlot" style="margin-top:14px;"></div>

        <div id="relatedSlot"></div>

        <div id="trailerSlot"></div>

        <h3 class="sub-head">Characters</h3>
        <div class="char-grid" id="charGrid"><div class="loading"><div class="spinner"></div></div></div>

        <h3 class="sub-head">Episodes</h3>
        <div class="ep-list" id="epList"><div class="loading"><div class="spinner"></div></div></div>`;

      loadMangaLinks();
      renderWatchPanel();
      loadRelated();
    }

    // Render social share buttons (X/Twitter, Reddit, copy link) for this anime
    function renderShareRow() {
      const row = document.getElementById("shareRow");
      if (!row || !animeData) return;
      const links = SEO.shareLinks(animeData);
      row.innerHTML = links.map((l) => l.copy
        ? `<button class="share-btn" onclick="copyShareLink()">${l.label}</button>`
        : `<a class="share-btn" href="${l.href}" target="_blank" rel="noopener">${l.label}</a>`
      ).join("");
    }

    function copyShareLink() {
      const url = SEO.BASE + "/pages/anime?id=" + encodeURIComponent(animeData.mal_id);
      navigator.clipboard?.writeText(url).then(() => showToast("Link copied!")).catch(() => showToast("Could not copy link"));
    }

    // ---------- Next episode air date (currently-airing shows) ----------
    // Fetches AniList's nextAiringEpisode and shows a countdown-style banner
    // ("Episode 12 airs in 2d 4h"). Hidden for finished/upcoming titles.
    async function loadNextEpisode() {
      const slot = document.getElementById("nextEpSlot");
      if (!slot || !animeData) return;
      const airing = await JIKAN.nextAiring(animeData.mal_id).catch(() => null);
      if (!airing) return;
      const diffMs = airing.airingAt * 1000 - Date.now();
      if (diffMs <= 0) return;
      const fmt = (ms) => {
        const d = Math.floor(ms / 86400000);
        const h = Math.floor((ms % 86400000) / 3600000);
        const m = Math.floor((ms % 3600000) / 60000);
        return d > 0 ? `${d}d ${h}h ${m}m` : h > 0 ? `${h}h ${m}m` : `${m}m`;
      };
      const dateStr = new Date(airing.airingAt * 1000).toLocaleString(undefined, {
        weekday: "short", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
      });
      const el = document.createElement("div");
      el.className = "next-ep-banner";
      el.innerHTML = `
        <div class="next-ep-label">Next episode</div>
        <div class="next-ep-text"><strong>Episode ${airing.episode}</strong> airs in <span id="nextEpCount">${fmt(diffMs)}</span></div>
        <div class="next-ep-date">${JIKAN.esc(dateStr)}</div>`;
      slot.appendChild(el);
      const count = document.getElementById("nextEpCount");
      const tick = () => {
        const ms = airing.airingAt * 1000 - Date.now();
        if (ms <= 0) { el.querySelector(".next-ep-text").innerHTML = "<strong>Episode " + airing.episode + "</strong> is airing now"; clearInterval(timer); return; }
        if (count) count.textContent = fmt(ms);
      };
      const timer = setInterval(tick, 60000);
      window.addEventListener("beforeunload", () => clearInterval(timer), { once: true });
    }

    // ---------- Seasons & related anime (sequels, movies, OVAs) ----------
    async function loadRelated() {
      const slot = document.getElementById("relatedSlot");
      if (!slot) return;
      let related = JIKAN.relatedAnime(animeData);

      // Jikan relations can be incomplete for some franchises. If we only
      // have a couple of entries, try to find sibling seasons by title.
      if (related.length < 3) {
        const extra = await franchiseFallback(animeData);
        const have = new Set(related.map((r) => r.mal_id));
        extra.forEach((r) => {
          if (!have.has(r.mal_id)) {
            have.add(r.mal_id);
            related.push(r);
          }
        });
      }

      // Wide franchise discovery via AniList: walks the SEQUEL/PREQUEL chain
      // so EVERY season of the anime appears (S1, S2, movies, OVAs, Final
      // Seasons) even when Jikan's relations are incomplete or Jikan search
      // is down. Runs in parallel with rendering; images arrive with the
      // entry itself so cards don't need a second lookup.
      const have = new Set(related.map((r) => r.mal_id));
      JIKAN.aniFranchise(animeData.mal_id).then((entries) => {
        (entries || []).forEach((r) => {
          if (have.has(r.mal_id)) return;
          have.add(r.mal_id);
          related.push(r);
        });
        renderRelated(related);
      }).catch(() => {});
      renderRelated(related);
    }

    function renderRelated(related) {
      const slot = document.getElementById("relatedSlot");
      if (!slot) return;
      if (!related.length) return;
      slot.innerHTML = `<h3 class="sub-head">Seasons &amp; Related</h3>
        <div class="grid" id="relatedGrid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));"></div>`;
      const grid = document.getElementById("relatedGrid");
      // Render cards immediately, but fetch each card's image/score in the
      // background *after* the main page content (characters, episodes) has
      // loaded, so those never wait behind this section.
      related.slice(0, 12).forEach((r) => {
        const el = document.createElement("div");
        el.className = "anime-card";
        el.dataset.malId = r.mal_id;
        const img = r.image || JIKAN.PLACEHOLDER;
        el.innerHTML = `<div class="poster">
            <img src="${img}" alt="${JIKAN.esc(r.name)}"
                 loading="lazy" onerror="this.onerror=null;this.src=JIKAN.PLACEHOLDER">
          </div>
          <div class="info">
            <div class="title">${JIKAN.esc(r.name)}</div>
            <div class="jtitle" style="color:var(--accent-3);">${JIKAN.esc(r.relation)}</div>
          </div>`;
        el.addEventListener("click", () => (window.location.href = `${pageHref("anime")}?id=${r.mal_id}`));
        grid.appendChild(el);
      });
      // Wait for the rest of the page to finish, then enrich the related cards.
      requestIdleCallback ? requestIdleCallback(() => enrichRelated(grid), { timeout: 4000 }) : setTimeout(() => enrichRelated(grid), 1200);
    }

    async function enrichRelated(grid) {
      if (!grid) return;
      const cards = [...grid.children];
      for (const el of cards) {
        const malId = Number(el.dataset.malId);
        if (!malId) continue;
        try {
          const res = await JIKAN.getAnime(malId);
          const a = res.data;
          const img = el.querySelector("img");
          if (img) img.src = a.images?.jpg?.image_url || JIKAN.PLACEHOLDER;
          const meta = el.querySelector(".info");
          const score = a.score ? a.score.toFixed(2) : "N/A";
          meta.insertAdjacentHTML("beforeend", `<div class="meta">
            <span class="score">★ ${score}</span>
            <span class="pill">${a.type || "Anime"}</span>
          </div>`);
        } catch (err) {
          const img = el.querySelector("img");
          if (img) img.src = JIKAN.PLACEHOLDER;
        }
      }
    }

    // Try to find other entries of the same franchise by searching the base
    // title (e.g., strip "Season 2" / "Part II" to find season 1 and movies).
    async function franchiseFallback(a) {
      const base = baseTitle(a);
      if (!base) return [];
      try {
        const res = await JIKAN.search(base, 1);
        const out = [];
        (res.data || []).forEach((it) => {
          if (it.mal_id === a.mal_id) return;
          const t = JIKAN.title(it).toLowerCase();
          const jp = it.title_japanese ? it.title_japanese.toLowerCase() : "";
          if (t.includes(base) || jp.includes(base)) {
            out.push({ mal_id: it.mal_id, name: JIKAN.title(it), relation: "Related", sort: 6 });
          }
        });
        return out.sort((x, y) => x.sort - y.sort);
      } catch (err) {
        return [];
      }
    }

    // Reduce a title like "Attack on Titan: Final Season Part 2" to "attack on titan"
    function baseTitle(a) {
      let t = (a.title_english || a.title || "").toLowerCase();
      t = t.replace(/\b(final|the|season|part|movie|film|ova|ona|special|live action|:|\|)\b/gi, " ");
      t = t.replace(/\b(1st|2nd|3rd|4th|5th|6th|7th|8th|9th|10th|11th|12th)\b/gi, " ");
      t = t.replace(/[0-9]+/g, " ");
      t = t.replace(/\b(ii|iii|iv|v|vi|vii|viii|ix|x)\b/g, " ");
      t = t.replace(/\s+/g, " ").trim();
      // Keep at most the first 4 significant words to avoid false positives
      const words = t.split(" ");
      return words.slice(0, 4).join(" ");
    }

    // ---------- Manga links (MangaDex + MAL) ----------
    // Renders instantly with guaranteed links (MangaDex search + MAL page),
    // then upgrades MangaDex to a direct title link when the API responds.
    function loadMangaLinks() {
      const slot = document.getElementById("mangaLinks");
      if (!slot) return;

      let manga = JIKAN.relatedManga(animeData);
      // MAL sometimes has no Adaptation relation for an anime (or the /full
      // endpoint fell back to /anime/:id which omits relations). In that case
      // search MangaDex by the anime title itself so the manga is still found.
      if (!manga.length) {
        const t = JIKAN.title(animeData);
        if (t) manga = [{ name: t, url: animeData.url || "", mal_id: null }];
      }
      if (!manga.length) return;

      const render = (directByName) => {
        const direct = directByName || new Map();
        let html = `<div class="detail-genres" style="margin-top:6px;"><span class="genre-tag" style="background:rgba(0,212,168,.15); border-color:rgba(0,212,168,.4); color:var(--accent-3);">Read the Manga</span></div>
          <div style="display:flex; flex-direction:column; gap:6px;">`;
        manga.slice(0, 3).forEach((m) => {
          const d = direct.get(m.name);
          if (d) {
            html += `<a href="${d.url}" target="_blank" rel="noopener" style="color:var(--accent-3); font-weight:600;">
              Read the manga on MangaDex: ${JIKAN.esc(d.title)} <span style="opacity:.6">&nearr;</span></a>`;
          } else {
            // MangaDex search link needs no API and always works.
            html += `<a href="${JIKAN.mangadexSearchLink(m.name)}" target="_blank" rel="noopener" style="color:var(--accent-3); font-weight:600;">
              Read the manga on MangaDex: ${JIKAN.esc(m.name)} <span style="opacity:.6">&nearr;</span></a>`;
          }
        });
        manga.slice(0, 3).forEach((m) => {
          if (m.url) {
            html += `<a href="${m.url}" target="_blank" rel="noopener" style="color:var(--accent); font-weight:600;">
              Read the manga: ${JIKAN.esc(m.name)} <span style="opacity:.6">(MyAnimeList)</span></a>`;
          }
        });
        html += `</div>`;
        slot.innerHTML = html;
      };

      // Guaranteed links show immediately — no network wait.
      render(null);

      // Upgrade to direct MangaDex title links in the background.
      (async () => {
        const direct = new Map();
        for (const m of manga.slice(0, 3)) {
          if (direct.has(m.name)) continue;
          const md = await JIKAN.mangadexSearch(m.name, 3);
          for (const r of md) {
            if (!direct.has(m.name)) direct.set(m.name, r);
          }
        }
        if (direct.size) render(direct);
      })();
    }

    // ---------- Where to Watch (external links panel) ----------
    // External ways to watch: the official platforms reported by MAL plus
    // open search gateways and (separately) community-submitted links.
    // On-site streaming is launched from the hero "▶ Watch Now" button, so the
    // providers themselves are not duplicated in this panel.
    async function renderWatchPanel() {
      const slot = document.getElementById("watchSlot");
      if (!slot) return;
      const a = animeData;
      const mainTitle = JIKAN.title(a);
      const q = encodeURIComponent(mainTitle);

      // Official streaming platforms reported by MAL (via Jikan /full).
      const seen = new Set();
      const official = (a.streaming || []).filter((s) => {
        const k = (s.name || "").toLowerCase();
        if (seen.has(k) || !s.url) return false;
        seen.add(k);
        return true;
      });
      const officialHtml = official.length
        ? `<div class="watch-btns">` +
          official.map((s) => `<a class="watch-btn" href="${s.url}" target="_blank" rel="noopener">${JIKAN.esc(s.name)} <span class="watch-ext">&nearr;</span></a>`).join("") +
          `</div>`
        : `<div class="watch-note">No stream is listed on MyAnimeList for this title.</div>`;

      // Search gateways as a fallback (open in a new tab).
      const searches = [
        { name: "Crunchyroll", url: `https://www.crunchyroll.com/search?q=${q}` },
        { name: "Netflix", url: `https://www.netflix.com/search?q=${q}` },
        { name: "AniList", url: `https://anilist.co/search/anime?search=${q}` },
        { name: "Internet Archive", url: `https://archive.org/search?query=${encodeURIComponent(mainTitle + " anime")}` },
        { name: "MyAnimeList", url: a.url || `https://myanimelist.net/search/all?q=${q}` },
      ];

      slot.innerHTML = `
        <h3 class="sub-head">Links to Watch</h3>
        <div class="watch-panel">
          ${official.length ? `<div class="watch-divider">Streaming</div>` : ""}
          ${officialHtml}
          <div class="watch-search">Still can't find it? Search:
            ${searches.map((s) => `<a href="${s.url}" target="_blank" rel="noopener">${JIKAN.esc(s.name)}</a>`).join(" · ")}
          </div>
        </div>
        <div id="communityWatch"></div>`;
      renderCommunityLinks();
    }

    // ---------- Community watch links (user-submitted, admin-approved) ----------
    async function renderCommunityLinks() {
      const box = document.getElementById("communityWatch");
      if (!box) return;
      if (!SUPABASE_READY || !supabase) return;
      const malId = Number(id);
      box.innerHTML = `<div class="loading"><div class="spinner"></div></div>`;
      try {
        const { data, error } = await supabase
          .from("watch_links")
          .select("*")
          .eq("anime_mal_id", malId)
          .order("created_at", { ascending: false });
        if (error) throw error;

        const approved = (data || []).filter((l) => l.approved);
        const pending = (data || []).filter((l) => !l.approved && isLoggedIn() && l.user_id === currentUser.id);

        let html = `<div class="watch-community">
          <h3 class="sub-head">Community Watch Links</h3>
          <div class="watch-panel">`;
        if (!approved.length) {
          html += `<div class="watch-note">No community links yet. Know a place to watch this? Add one below.</div>`;
        } else {
          html += `<div class="watch-btns">` + approved.map((l) =>
            `<a class="watch-btn" href="${JIKAN.safeImg(l.url)}" target="_blank" rel="noopener">${JIKAN.esc(l.provider_name)} <span class="watch-ext">&nearr;</span></a>`
          ).join("") + `</div>`;
        }
        if (pending.length) {
          html += `<div class="watch-note" style="margin-top:10px;">Your link is pending (awaiting admin approval):</div>
            <div class="watch-pending">
              ${pending.map((l) => `<span class="watch-pending-item">${JIKAN.esc(l.provider_name)}
                <button class="btn btn-danger btn-small" onclick="deleteCommunityLink(${l.id})">x</button></span>`).join("")}
            </div>`;
        }
        if (isLoggedIn()) {
          html += `
            <form class="watch-add-form" onsubmit="submitCommunityLink(event)">
              <input type="text" id="clProvider" placeholder="Provider (e.g. Crunchyroll)" required style="flex:1; min-width:140px;">
              <input type="url" id="clUrl" placeholder="https://..." required style="flex:2; min-width:220px;">
              <button type="submit" class="btn btn-primary">Suggest link</button>
            </form>
            <div class="stream-scroll-note">Links are shown publicly only after admin approval.</div>`;
        } else {
          html += `<div class="watch-note"><a href="login.html" style="color:var(--accent)">Login</a> to suggest a watch link.</div>`;
        }
        html += `</div></div>`;
        box.innerHTML = html;
      } catch (e) {
        box.innerHTML = "";
      }
    }

    function submitCommunityLink(ev) {
      ev.preventDefault();
      if (!isLoggedIn()) { showToast("Login to suggest a link"); return; }
      const provider = document.getElementById("clProvider").value.trim();
      const url = document.getElementById("clUrl").value.trim();
      if (!/^https?:\/\//i.test(url)) { showToast("URL must start with http:// or https://"); return; }
      const seasonLabel = (() => {
        if (!animeData) return "";
        const s = (animeData.season || "").toString();
        const y = animeData.year || "";
        return s ? `${s.charAt(0).toUpperCase() + s.slice(1)} ${y}`.trim() : (y ? String(y) : "");
      })();
      supabase
        .from("watch_links")
        .select("id", { count: "exact", head: true })
        .eq("anime_mal_id", Number(id))
        .eq("user_id", currentUser.id)
        .then(({ count }) => {
          if ((count || 0) >= 5) {
            showToast("You can only submit up to 5 links per anime");
            return;
          }
          dbInsert("watch_links", {
            anime_mal_id: Number(id),
            user_id: currentUser.id,
            provider_name: provider,
            url,
            approved: false,
            anime_title: JIKAN.title(animeData) || "",
            season: seasonLabel,
          }).then(() => {
            showToast("Link submitted for admin approval");
            renderCommunityLinks();
          }).catch((err) => showToast("Could not submit: " + err.message));
        })
        .catch(() => showToast("Could not submit link"));
    }

    async function deleteCommunityLink(linkId) {
      try {
        await supabase.from("watch_links").delete().eq("id", linkId);
        renderCommunityLinks();
      } catch (e) { showToast("Could not remove link"); }
    }

    // ---------- Watch Online (third-party streaming providers) ----------
    function getStreamingProviders() {
      return JIKAN.streamingProviders();
    }

    let activeProviderIndex = 0;
    function renderEpRow(list) {
      const row = document.getElementById("epRow");
      if (!row) return;
      row.innerHTML = list.map((n) =>
        `<button class="ep-chip" data-ep="${n}" onclick="openStream(${n})">${n}</button>`
      ).join("");
      // mark the previously active episode (if any) + provider button active
      document.querySelectorAll(".stream-panel .ep-chip").forEach((c) => {
        const isEp = c.dataset.ep;
        const isProv = c.dataset.provider !== undefined;
        c.classList.toggle("is-active",
          isEp ? Number(c.dataset.ep) === (lastStreamEpisode || 0)
               : (isProv && c.dataset.provider == activeProviderIndex));
      });
    }

    // Hero "▶ Watch Now" — asks which on-site provider to use. Only providers
    // that stream on this site (embed mode) are shown; the "Links to Watch"
    // panel below is where external providers open in a new tab.
    function startWatching() {
      const embed = getStreamingProviders().filter((p) => p.mode === "embed" || p.mode === "video");
      if (!embed.length) {
        showToast("No on-site streaming is configured for this title.");
        return;
      }
      const btn = document.getElementById("watchNowBtn");
      if (btn) btn.classList.add("pulse-once");
      showProviderPicker();
    }

    function showProviderPicker() {
      const embed = getStreamingProviders().filter((p) => p.mode === "embed" || p.mode === "video");
      const title = JIKAN.title(animeData) || "Anime";
      closeStreamModal();
      const overlay = document.createElement("div");
      overlay.className = "stream-modal-overlay";
      const rows = embed.map((p, i) => `
        <button class="provider-pick" onclick="pickProvider(${i})">
          <span class="provider-pick-name">${JIKAN.esc(p.name)}</span>
        </button>`).join("");
      overlay.innerHTML = `
        <div class="stream-modal" role="dialog" aria-modal="true" aria-label="Choose a provider">
          <div class="stream-modal-head">
            <div class="stream-modal-title">Watch &ldquo;${JIKAN.esc(title)}&rdquo; — pick a provider</div>
            <button class="stream-modal-close" onclick="closeStreamModal()" aria-label="Close">&times;</button>
          </div>
          <div class="provider-pick-list">${rows}</div>
          <div class="stream-modal-actions">
            <button class="btn btn-outline btn-small" onclick="closeStreamModal()">Close</button>
          </div>
        </div>`;
      overlay.addEventListener("click", (e) => { if (e.target === overlay) closeStreamModal(); });
      document.addEventListener("keydown", streamEscKey);
      document.body.appendChild(overlay);
    }

    function pickProvider(i) {
      const list = getStreamingProviders().filter((p) => p.mode === "embed" || p.mode === "video");
      const p = list[i];
      if (!p) return;
      closeStreamModal();
      // Video providers (e.g. 9anime HLS) stream in the on-site <video> modal
      // right here; embed providers redirect to the watch theater page.
      if (p.mode === "video") {
        activeProviderIndex = getStreamingProviders().findIndex((x) => x.id === p.id);
        renderEpRow(listOfEpisodes());
        openStream(1);
        return;
      }
      window.location.href = `${pageHref("watch")}?id=${animeData?.mal_id}&provider=${encodeURIComponent(p.id)}`;
    }

    // Open the streaming player modal for a given episode number.
    async function openStream(ep) {
      const providers = getStreamingProviders();
      if (!providers.length) {
        showToast("Streaming isn't configured yet.");
        return;
      }
      const provider = providers[activeProviderIndex] || providers[0];
      let url = null;
      // On-site embed providers resolve their episode source at runtime:
      // AniPub via its public API, AniKoto via its catalog API.
      if (provider.id === "anipub") {
        showToast("Resolving AniPub source…");
        // Timebox so we never hang on AniPub's API from a slow/blocked network.
        url = await Promise.race([
          JIKAN.anipubUrl(animeData, ep, streamLang),
          new Promise((r) => setTimeout(() => r(null), 10000)),
        ]);
        if (!url) {
          showToast(`Couldn't resolve episode ${ep} on ${provider.name}.`);
          const slot = document.getElementById("watchSlot");
          if (slot) slot.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
      } else if (provider.id === "anikoto") {
        showToast("Resolving AniKoto source…");
        // AniKoto resolves each episode to a megaplay embed URL via its public
        // catalog API (search → episodes → servers → stream). Timeboxed so a
        // slow/offline API never leaves the modal hanging.
        url = await Promise.race([
          JIKAN.anikotoUrl(animeData, ep, streamLang),
          new Promise((r) => setTimeout(() => r(null), 12000)),
        ]);
        if (!url) {
          showToast(`Couldn't resolve episode ${ep} on ${provider.name}. Try another provider.`);
          const slot = document.getElementById("watchSlot");
          if (slot) slot.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
      } else if (provider.id === "megavid") {
        url = JIKAN.megavidUrl(animeData, ep, streamLang);
      } else if (provider.id === "anixo") {
        showToast("Resolving AniXo source…");
        // AniXo needs the AniList id for this MAL id (one cached lookup).
        url = await Promise.race([
          JIKAN.anixoUrl(animeData, ep, streamLang),
          new Promise((r) => setTimeout(() => r(null), 8000)),
        ]);
        if (!url) {
          showToast(`Couldn't resolve episode ${ep} on ${provider.name}. Try another provider.`);
          const slot = document.getElementById("watchSlot");
          if (slot) slot.scrollIntoView({ behavior: "smooth", block: "center" });
          return;
        }
      } else {
        url = JIKAN.streamingUrl(provider, {
          mal_id: animeData?.mal_id,
          ep,
          title: JIKAN.title(animeData),
        });
      }
      if (!url) {
        showToast("This provider could not build a link for this episode.");
        return;
      }
      lastStreamEpisode = ep;
      renderEpRow(listOfEpisodes());
      const title = (animeData?.title_english || animeData?.title || "Anime") + " — Episode " + ep;
      openStreamModal({ provider, url, title, ep });
    }

    function listOfEpisodes() {
      return Array.from({ length: Math.min(animeData?.episodes || episodeCount || 1, 500) }, (_, i) => i + 1);
    }

    let lastStreamEpisode = 0;
    let streamLang = "sub"; // "sub" | "dub" (AniPub); other providers ignore it

    // Modal with an <iframe> embed (mode "embed"), a direct video file
    // (mode "video"), or an external link (mode "link"). The iframe sandbox
    // is kept deliberately restrictive: scripts allowed (players usually need
    // them), but no popups/forms to the parent and no top-navigation, so a
    // provider can't drive the host page.
    function openStreamModal({ provider, url, title, ep }) {
      closeStreamModal();
      const overlay = document.createElement("div");
      overlay.className = "stream-modal-overlay";

      const eps = listOfEpisodes();
      const hasEps = eps.length > 1;
      const prevBtn = hasEps && ep > 1
        ? `<button class="stream-nav" onclick="streamNav(${ep - 1})" title="Previous episode (←)">‹</button>` : "";
      const nextBtn = hasEps && ep < eps.length
        ? `<button class="stream-nav" onclick="streamNav(${ep + 1})" title="Next episode (→)">›</button>` : "";

      let frame = "";
      let link = "";
      let usesVideo = false;
      if (provider.mode === "embed") {
        // Some players (e.g. AniPub) detect the sandbox flag and refuse to
        // run — providers can opt out via `sandbox: false` in config.js.
        const sbx = provider.sandbox === false
          ? ""
          : ` sandbox="allow-scripts allow-same-origin"`;
        frame = `<div class="stream-frame-wrap" id="streamFrame">
            <div class="stream-loading"><div class="spinner"></div><span>Preparing player…</span></div>
            <iframe src="${JIKAN.esc(url)}" title="${JIKAN.esc(title)}"
                 referrerpolicy="${JIKAN.esc(provider.referrerPolicy || "no-referrer")}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture"${sbx}
                 allowfullscreen></iframe>
          </div>`;
        link = `<a class="btn btn-primary" href="${JIKAN.esc(url)}" target="_blank" rel="noopener noreferrer">▶ Watch on ${JIKAN.esc(provider.name)}</a>`;
      } else if (provider.mode === "video") {
        usesVideo = true;
        frame = `<div class="stream-frame-wrap" id="streamFrame">
            <video id="streamVideo" controls playsinline preload="metadata"
                 style="position:absolute; inset:0; width:100%; height:100%; background:#000;"></video>
            <div class="stream-loading" id="streamBuffer"><div class="spinner"></div><span>Buffering…</span></div>
          </div>`;
        link = `<a class="btn btn-primary" href="${JIKAN.esc(url)}" target="_blank" rel="noopener noreferrer">Open video file</a>`;
      } else {
        frame = `<div class="stream-notice" style="padding:8px 2px;">This provider opens in a new tab.</div>`;
        link = `<a class="btn btn-primary" href="${JIKAN.esc(url)}" target="_blank" rel="noopener noreferrer">▶ Watch on ${JIKAN.esc(provider.name)}</a>`;
      }

      overlay.innerHTML = `
        <div class="stream-modal" role="dialog" aria-modal="true" aria-label="${JIKAN.esc(title)}">
          <div class="stream-modal-head">
            <div class="stream-modal-title">
              <span class="stream-title-main">${JIKAN.esc(title)}</span>
              ${ep ? `<span class="stream-title-sub">Episode ${ep} · ${JIKAN.esc(provider.name)}</span>` : ""}
            </div>
            <div class="stream-head-actions">
              ${prevBtn}${nextBtn}
              <button class="stream-modal-close" onclick="closeStreamModal()" aria-label="Close player">&times;</button>
            </div>
          </div>
          ${frame}
          ${["anipub", "anikoto", "megavid", "anixo"].includes(provider.id) ? `<div class="watch-lang-bar stream-lang-bar">
            <span class="watch-lang-label">Audio</span>
            <button class="lang-btn${streamLang === "sub" ? " is-active" : ""}" data-lang="sub" onclick="streamSetLang('sub')">Sub</button>
            <button class="lang-btn${streamLang === "dub" ? " is-active" : ""}" data-lang="dub" onclick="streamSetLang('dub')">Dub</button>
          </div>` : ""}
          <div class="stream-modal-actions">
            ${link}
            <button class="btn btn-outline btn-small" onclick="closeStreamModal()">Close</button>
          </div>
        </div>`;
      overlay.addEventListener("click", (e) => { if (e.target === overlay) closeStreamModal(); });
      document.addEventListener("keydown", streamEscKey);
      document.body.appendChild(overlay);

      if (usesVideo) {
        const vid = document.getElementById("streamVideo");
        if (vid) loadVideoSource(vid, url);
      } else {
        // Hide the loading shimmer once the iframe finishes loading. A
        // safety timer covers providers whose page never fires a load event.
        const frameEl = document.getElementById("streamFrame");
        const iframe = frameEl ? frameEl.querySelector("iframe") : null;
        const loading = frameEl ? frameEl.querySelector(".stream-loading") : null;
        const hideLoad = () => { if (loading) loading.classList.add("hide"); };
        if (iframe) {
          iframe.addEventListener("load", hideLoad);
          setTimeout(hideLoad, 8000);
        }
      }
    }

    // Jump to the previous/next episode from the modal player controls.
    function streamNav(ep) {
      if (!ep) return;
      openStream(ep);
    }

    // Swap the AniPub player between subtitled and English-dubbed audio. Dub
    // availability is pre-checked so a title without an English dub falls
    // back to sub instead of showing the player's error page.
    async function streamSetLang(lang) {
      if (lang === streamLang) return;
      if (lang === "dub") {
        const provider = getStreamingProviders()[activeProviderIndex] || getStreamingProviders()[0];
        try {
          if (provider?.id === "anikoto") {
            const ok = await JIKAN.anikotoDubAvailable(animeData);
            if (!ok) {
              showToast("No English dub for this title on AniKoto — try switching provider.");
              return;
            }
          } else if (provider?.id === "anipub") {
            const info = await JIKAN.anipubEpisodes(animeData);
            const item = info?.eps?.[Math.min(Math.max(lastStreamEpisode - 1, 0), (info?.eps?.length || 1) - 1)];
            if (item) {
              const ok = await JIKAN.anipubDubAvailable(item.id);
              if (!ok) {
                showToast("No English dub for this title on AniPub — try switching provider.");
                return;
              }
            }
          }
        } catch (e) {}
      }
      streamLang = lang;
      if (lastStreamEpisode) openStream(lastStreamEpisode);
    }

    // Attach an MP4 or HLS (m3u8) source to a <video>. HLS needs hls.js
    // (loaded above); plain MP4/WebM plays natively. Appending a fresh
    // <source> guarantees a clean reload when switching episodes. A
    // "buffering" shimmer overlays the player until playback is ready.
    function loadVideoSource(video, src) {
      if (!video || !src) return;
      while (video.firstChild) video.removeChild(video.firstChild);
      const buff = document.getElementById("streamBuffer");
      const setBuf = (on) => { if (buff) buff.classList.toggle("hide", !on); };
      setBuf(true);
      ["playing", "canplay", "error"].forEach((ev) =>
        video.addEventListener(ev, () => setBuf(false), { once: true }));
      const isHls = /\.m3u8(\?|$)/i.test(src);
      if (isHls && window.Hls && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(src);
        hls.attachMedia(video);
        video.dataset.hls = hls;
      } else if (isHls && video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = src;
      } else {
        const s = document.createElement("source");
        s.src = src;
        video.appendChild(s);
        video.load();
      }
      video.play().catch(() => {});
    }

    function streamEscKey(e) {
      if (e.key === "Escape") { closeStreamModal(); return; }
      // Arrow keys jump between episodes while the modal player is open.
      if (e.key === "ArrowLeft") {
        if (lastStreamEpisode > 1) openStream(lastStreamEpisode - 1);
      } else if (e.key === "ArrowRight") {
        const eps = listOfEpisodes();
        if (lastStreamEpisode < eps.length) openStream(lastStreamEpisode + 1);
      }
    }

    function closeStreamModal() {
      const vid = document.querySelector("#streamVideo");
      if (vid) {
        if (vid.dataset.hls) { try { vid.dataset.hls.destroy(); } catch (e) {} }
        vid.pause();
        vid.removeAttribute("src");
      }
      const ov = document.querySelector(".stream-modal-overlay");
      if (ov) ov.remove();
      document.removeEventListener("keydown", streamEscKey);
    }

    function scrollToTrailer() {
      const slot = document.getElementById("trailerSlot");
      if (slot) slot.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function renderTrailer() {
      const slot = document.getElementById("trailerSlot");
      const t = animeData.trailer;
      const ytId = t?.youtube_id;
      if (ytId) {
        slot.innerHTML = `<h3 class="sub-head">Trailer</h3>
          <div class="trailer-wrap">
            <iframe src="https://www.youtube-nocookie.com/embed/${ytId}" allowfullscreen loading="lazy"></iframe>
          </div>`;
        const btn = document.getElementById("trailerBtn");
        if (btn) btn.style.display = "";
      }
    }

    async function loadCharacters() {
      const grid = document.getElementById("charGrid");
      try {
        const res = await JIKAN.characters(id);
        grid.innerHTML = "";
        res.data.slice(0, 12).forEach((c) => {
          const va = (c.voice_actors || []).find((v) => v.language === "Japanese");
          const vaName = va?.person?.name ? `VA: ${va.person.name}` : "";
          const el = document.createElement("div");
          el.className = "char-card";
          el.innerHTML = `
            <img src="${c.character.images?.jpg?.image_url || JIKAN.PLACEHOLDER}"
                 alt="${JIKAN.esc(c.character.name)}" loading="lazy"
                 onerror="this.onerror=null;this.src=JIKAN.PLACEHOLDER">
            <div class="char-name">${JIKAN.esc(c.character.name)}</div>
            <div class="char-role">${c.role || ""}</div>
            ${vaName ? `<div class="char-role" style="color:var(--accent-3);">${JIKAN.esc(vaName)}</div>` : ""}`;
          el.addEventListener("click", () => (window.location.href = `character?id=${c.character.mal_id}`));
          grid.appendChild(el);
        });
        if (!res.data.length) grid.innerHTML = `<div class="empty-state">No characters listed.</div>`;
      } catch (err) {
        grid.innerHTML = `<div class="empty-state">Could not load characters.</div>`;
      }
    }

    async function loadEpisodes() {
      const list = document.getElementById("epList");
      const all = [];
      try {
        // Fetch the first page to learn the total, then fetch remaining pages
        // in parallel (bounded at 10 pages / ~200 episodes). The global Jikan
        // pool still rate-limits the burst, so this is safe.
        const first = await JIKAN.episodes(id, 1);
        all.push(...(first.data || []));
        const lastPage = Math.min(first.pagination?.last_visible_page || 1, 10);
        if (lastPage > 1) {
          const rest = await Promise.all(
            Array.from({ length: lastPage - 1 }, (_, i) =>
              JIKAN.episodes(id, i + 2).catch(() => ({ data: [] }))
            )
          );
          rest.forEach((r) => all.push(...(r.data || [])));
        }

        list.innerHTML = "";
        if (!all.length) {
          list.innerHTML = `<div class="empty-state">Episode list unavailable.</div>`;
          return;
        }
        all.forEach((ep) => {
          const el = document.createElement("div");
          el.className = "ep-item";
          const score = ep.score ? `<span class="ep-score">★ ${ep.score.toFixed(2)}</span>` : "";
          const badges = (ep.filler ? `<span class="ep-badge">Filler</span>` : "")
                       + (ep.recap ? `<span class="ep-badge">Recap</span>` : "");
          const epNum = ep.episode || ep.mal_id;
          const watchChip = (epNum && getStreamingProviders().length)
            ? `<button class="btn btn-outline btn-small" style="padding:4px 10px;" onclick="openStream(${epNum})">▶ Watch</button>`
            : "";
          el.innerHTML = `
            <div class="ep-num">Episode ${ep.mal_id || "?"} ${badges}</div>
            <div class="ep-title">${JIKAN.esc(ep.title || "Untitled")}</div>
            ${ep.title_japanese ? `<div class="char-role" style="color:var(--text-dim);">${JIKAN.esc(ep.title_japanese)}</div>` : ""}
            <div class="ep-meta">
              ${score}
              ${ep.aired ? `<span class="char-role">${JIKAN.esc(String(ep.aired).slice(0, 10))}</span>` : ""}
              ${watchChip}
              ${ep.url ? `<a class="ep-link" href="${ep.url}" target="_blank" rel="noopener">MAL &nearr;</a>` : ""}
            </div>`;
          list.appendChild(el);
        });
        episodeCount = (animeData?.episodes) || all.length;
        renderWatchPanel();
      } catch (err) {
        list.innerHTML = `<div class="empty-state">Could not load episodes.</div>`;
      }
    }

    // ---------- Save to My List ----------
    let isSaved = false;
    async function loadSavedState() {
      const slot = document.getElementById("saveSlot");
      if (!slot) return;
      if (!isLoggedIn()) {
        slot.innerHTML = `<button class="btn btn-outline" onclick="location.href='login.html'">Save to My List</button>
          <span style="color:var(--text-dim); font-size:.85rem; margin-left:10px;">Login to save this anime.</span>`;
        return;
      }
      try {
        const { data } = await supabase
          .from("saved_anime")
          .select("id")
          .eq("anime_mal_id", Number(id))
          .eq("user_id", currentUser.id)
          .maybeSingle();
        isSaved = !!data;
        renderSaveButton(slot);
      } catch (err) {
        slot.innerHTML = "";
      }
    }

    function renderSaveButton(slot) {
      slot.innerHTML = isSaved
        ? `<button class="btn btn-outline" onclick="unsaveAnime()">✓ Saved</button>
           <span style="color:var(--text-dim); font-size:.85rem; margin-left:10px;">In your My List.</span>`
        : `<button class="btn btn-primary" onclick="saveAnime()">＋ Save to My List</button>`;
    }

    async function saveAnime() {
      if (!isLoggedIn()) return;
      try {
        await dbInsert("saved_anime", {
          user_id: currentUser.id,
          anime_mal_id: Number(id),
          anime_title: JIKAN.title(animeData),
          anime_image: animeData.images?.jpg?.image_url,
        });
        isSaved = true;
        awardXp(5); // +5 XP for saving an anime
        awardRp("save"); // +3 RP
        showToast("Saved to My List! +5 XP");
        renderSaveButton(document.getElementById("saveSlot"));
      } catch (err) {
        showToast("Could not save: " + err.message);
      }
    }

    async function unsaveAnime() {
      try {
        await supabase.from("saved_anime").delete().eq("anime_mal_id", Number(id)).eq("user_id", currentUser.id);
        isSaved = false;
        showToast("Removed from My List");
        renderSaveButton(document.getElementById("saveSlot"));
      } catch (err) {
        showToast("Could not remove");
      }
    }

    document.addEventListener("DOMContentLoaded", loadAnime);
  </script>
</body>
</html>
