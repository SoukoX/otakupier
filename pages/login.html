<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — OtakuPier</title>
  <meta name="robots" content="index, follow">
  <meta name="description" content="Log in to OtakuPier to track anime, join the community, chat and rank your favorite shows.">
  <link rel="canonical" href="https://soukox.github.io/otakupier/pages/login.html">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="preconnect" href="https://api.jikan.moe">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="container">
    <div class="auth-wrap">
      <h1>Welcome back</h1>
      <div class="form-error" id="formError" style="display:none;"></div>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" data-toggle-pw required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>
      <div class="form-switch">New here? <a href="signup.html">Create an account</a></div>
    </div>
  </main>

  <footer id="siteFooter"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (SUPABASE_READY) {
        setupPasswordToggle();
        setupAuthForm("loginForm", "login");
      } else {
        document.getElementById("loginForm").innerHTML =
          `<div class="empty-state">Accounts are coming soon — Supabase isn't configured yet.</div>`;
      }
    });
  </script>
</body>
</html>
