<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Read Manga - OtakuPier</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../css/style.css?v=25">
  <link rel="preconnect" href="https://api.mangadex.org">
  <link rel="preconnect" href="https://api.jikan.moe">
  <link rel="preconnect" href="https://graphql.anilist.co">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://soukox.goatcounter.com">
<script data-goatcounter="https://soukox.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body class="reader-body">
  <nav class="navbar" id="navbar"></nav>

  <div class="reader-page">
    <div class="reader-top-bar">
      <a class="reader-back" href="javascript:history.back()">← Back</a>
      <button class="reader-sidebar-open-btn" id="sidebarOpenBtn" aria-label="Show chapters">☰</button>
      <div class="reader-chapter-nav">
        <button class="btn btn-outline btn-small" id="prevChapter" disabled>← Prev</button>
        <span class="reader-chapter-label" id="chapterLabel">Select a chapter</span>
        <button class="btn btn-outline btn-small" id="nextChapter" disabled>Next →</button>
      </div>
    </div>

    <div class="reader-content">
      <div class="reader-backdrop" id="readerBackdrop"></div>
      <aside class="reader-sidebar" id="readerSidebar">
        <div class="reader-sidebar-head">
          <h2 class="reader-manga-title" id="mangaTitle">Loading...</h2>
          <button class="reader-sidebar-close" id="sidebarClose" aria-label="Hide chapters">✕</button>
        </div>
        <div class="reader-chapter-list" id="chapterList">
          <div class="loading"><div class="spinner"></div>Finding chapters...</div>
        </div>
      </aside>

      <div class="reader-main">
        <div class="reader-pages" id="readerPages">
          <div class="reader-placeholder" id="readerPlaceholder">
            <div class="empty-state">
              <h3>📖 Manga Reader</h3>
              <p>Select a chapter from the sidebar to start reading.</p>
            </div>
          </div>
        </div>
        <footer id="siteFooter"></footer>
      </div>
    </div>
  </div>

  <h1 style="display:none;">Read Manga - OtakuPier</h1>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js?v=25"></script>
  <script src="../js/api.js?v=25"></script>
  <script src="../js/seo.js?v=25"></script>
  <script src="../js/app.js?v=25"></script>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const mangaTitle = params.get("title") || "Manga";
      const mangaId = params.get("id") || "";
      let mangadexId = null;
      let chapters = [];
      let currentChapterIdx = -1;
      let sidebarOpen = true;

      const API = "https://api.mangadex.org";

      const $ = (id) => document.getElementById(id);

      $("mangaTitle").textContent = mangaTitle;
      document.title = mangaTitle + " - Read Manga | OtakuPier";

      // ── Sidebar ──
      function updateSidebar() {
        $("readerSidebar").classList.toggle("hidden", !sidebarOpen);
        $("sidebarOpenBtn").style.display = sidebarOpen ? "none" : "inline-block";
        $("sidebarClose").style.display = sidebarOpen ? "inline-block" : "none";
        $("readerBackdrop").classList.toggle("show", sidebarOpen && window.innerWidth <= 768);
      }
      $("sidebarOpenBtn").onclick = () => { sidebarOpen = true; updateSidebar(); };
      $("sidebarClose").onclick = () => { sidebarOpen = false; updateSidebar(); };
      $("readerBackdrop").onclick = () => { sidebarOpen = false; updateSidebar(); };
      window.addEventListener("resize", updateSidebar);

      // ── Title matching ──
      function norm(s) {
        return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "").replace(/ou/g, "o");
      }

      // ── Step 1: Find manga ──
      async function init() {
        $("chapterList").innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';

        // Search MangaDex via CORS proxy (MangaDex API has no CORS headers)
        const titles = [
          mangaTitle,
          mangaTitle.replace(/[:\-!]/g, " ").replace(/\s+/g, " ").trim(),
          mangaTitle.replace(/\s*\(.*?\)\s*/g, "").trim(),
          mangaTitle.split(":")[0].trim(),
        ].filter(Boolean);

        if (typeof JIKAN !== "undefined" && JIKAN.mangadexSearch) {
          for (const title of titles) {
            try {
              const results = await JIKAN.mangadexSearch(title);
              if (results.length) {
                // Find best match
                const best = results.find(r => {
                  const t = r.title.toLowerCase();
                  const target = mangaTitle.toLowerCase();
                  return t === target || t.includes(target) || target.includes(t);
                }) || results[0];

                mangadexId = best.id;
                $("mangaTitle").textContent = best.title || mangaTitle;
                await loadChaptersFromMangaDex();
                return;
              }
            } catch (e) { continue; }
          }
        }

        // MangaDex search failed — try WeebCentral directly
        await loadWeebCentralChapters();
      }

      // ── Step 2a: Load chapters from MangaDex (via CORS proxy) ──
      let currentProvider = "mangadex";
      let weebcentralMangaId = null;

      async function loadChaptersFromMangaDex() {
        const list = $("chapterList");
        list.innerHTML = '<div class="loading"><div class="spinner"></div>Loading chapters...</div>';
        try {
          // Fetch chapters via manga-scrape-api CORS proxy
          const res = await fetch(`${JIKAN.WEEBCENTRAL_API}/api/scrape/chapters?id=${mangadexId}&provider=mangadex`);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          const allChapters = Array.isArray(data) ? data : (data.data || data.chapters || []);

          // Filter to hosted chapters only (no externalUrl) and dedup by chapter number
          const seen = new Map();
          allChapters.forEach(ch => {
            if (!ch || !ch.id) return;
            // Skip external chapters (MangaPlus links)
            if (ch.attributes?.externalUrl) return;
            const chapNum = ch.chapter || ch.attributes?.chapter || ch.title?.match(/[\d.]+/)?.[0];
            if (!chapNum) return;
            const key = normKey(chapNum);
            const existing = seen.get(key);
            if (!existing) {
              seen.set(key, {
                id: ch.id,
                attributes: {
                  chapter: chapNum,
                  title: ch.title || ch.attributes?.title || "",
                  volume: ch.volume || ch.attributes?.volume || null,
                  pages: ch.pages || ch.attributes?.pages || 0,
                  provider: "mangadex"
                }
              });
            }
          });

          const hostedChapters = Array.from(seen.values());
          if (hostedChapters.length) {
            chapters = sortChapters(hostedChapters);
            renderChapterList();
            return;
          }
        } catch (e) {
          console.warn("[MangaDex] Chapter fetch failed:", e);
        }

        // MangaDex chapters failed — try WeebCentral
        await loadWeebCentralChapters();
      }

      // ── Step 2b: Load chapters from WeebCentral ──
      async function loadWeebCentralChapters() {
        const list = $("chapterList");
        list.innerHTML = '<div class="loading"><div class="spinner"></div>Trying WeebCentral...</div>';
        try {
          const wcResults = await JIKAN.weebcentralSearch(mangaTitle);
          const wcManga = wcResults.find(r => {
            const t = r.title.toLowerCase();
            const target = mangaTitle.toLowerCase();
            return t === target || t.includes(target) || target.includes(t);
          }) || wcResults[0];

          if (wcManga) {
            weebcentralMangaId = wcManga.id;
            currentProvider = "weebcentral";
            $("mangaTitle").textContent = wcManga.title || mangaTitle;
            const wcChapters = await JIKAN.weebcentralChapters(wcManga.id);
            if (wcChapters.length) {
              chapters = wcChapters.map(ch => ({
                id: ch.id,
                attributes: {
                  chapter: ch.number || ch.title?.match(/[\d.]+/)?.[0] || "?",
                  title: ch.title || "",
                  volume: null,
                  pages: 0,
                  provider: "weebcentral"
                }
              }));
              chapters = sortChapters(chapters);
              renderChapterList();
              return;
            }
          }
        } catch (e) {
          console.warn("[WeebCentral] Fallback failed:", e);
        }
        list.innerHTML = '<div class="empty-state">' +
          '<p>No chapters found.</p>' +
          '<p style="margin-top:8px;font-size:0.85em;">This manga may not have readable chapters available yet.</p></div>';
      }

      function sortChapters(arr) {
        return arr.sort((a, b) => {
          const na = parseNum(a.attributes.chapter);
          const nb = parseNum(b.attributes.chapter);
          if (na !== nb) return na - nb;
          const va = parseFloat(a.attributes.volume) || 0;
          const vb = parseFloat(b.attributes.volume) || 0;
          return va - vb;
        });
      }

      function parseNum(str) {
        const s = String(str).trim();
        const n = parseFloat(s);
        if (!isNaN(n)) return n;
        const m = s.match(/[\d.]+/);
        return m ? parseFloat(m[0]) : Infinity;
      }

      function normKey(str) {
        const n = parseNum(str);
        return n === Infinity ? String(str).trim().toLowerCase() : String(n);
      }

      function renderChapterList() {
        const list = $("chapterList");
        let html = `<div class="chapter-list-header">${chapters.length} chapters</div>`;
        chapters.forEach((ch, i) => {
          const a = ch.attributes;
          const vol = a.volume ? ` Vol.${a.volume}` : "";
          const chTitle = a.title ? ` - ${a.title}` : "";
          html += `<button class="chapter-item" data-idx="${i}">
            <span class="chapter-num">Ch. ${esc(a.chapter || "?")}${vol}</span>
            <span class="chapter-name">${esc(chTitle)}</span>
          </button>`;
        });
        list.innerHTML = html;
        list.querySelectorAll(".chapter-item").forEach(btn => {
          btn.addEventListener("click", () => goToChapter(parseInt(btn.dataset.idx)));
        });
      }

      // ── Step 3: Navigate to chapter ──
      let chapterGen = 0;

      function goToChapter(idx) {
        if (idx < 0 || idx >= chapters.length) return;
        currentChapterIdx = idx;
        const gen = ++chapterGen;

        const ch = chapters[idx];
        const vol = ch.attributes.volume ? ` Vol.${ch.attributes.volume}` : "";
        $("chapterLabel").textContent = "Ch. " + (ch.attributes.chapter || "?") + vol;

        $("chapterList").querySelectorAll(".chapter-item").forEach((el, i) => {
          el.classList.toggle("active", i === idx);
        });

        $("readerPlaceholder") && ($("readerPlaceholder").style.display = "none");
        $("readerPages").innerHTML = '<div class="reader-loading"><div class="spinner"></div><span>Loading...</span></div>';

        loadChapterImages(ch, gen);
      }

      function updateNavButtons() {
        $("prevChapter").disabled = currentChapterIdx <= 0;
        $("nextChapter").disabled = currentChapterIdx >= chapters.length - 1;
      }

      async function loadChapterImages(ch, gen) {
        const container = $("readerPages");

        // WeebCentral: fetch pages from the scrape API
        if (currentProvider === "weebcentral") {
          try {
            const pages = await JIKAN.weebcentralPages(weebcentralMangaId, ch.attributes.chapter);
            if (gen !== chapterGen) return;
            if (pages.length) {
              container.innerHTML = "";
              let failedCount = 0;
              pages.forEach((url, pi) => {
                const wrapper = document.createElement("div");
                wrapper.className = "reader-page-wrapper";
                const img = document.createElement("img");
                img.className = "reader-page-img";
                img.src = url;
                img.alt = `Page ${pi + 1}`;
                img.loading = pi < 3 ? "eager" : "lazy";
                const errLabel = document.createElement("div");
                errLabel.className = "reader-page-error";
                errLabel.style.display = "none";
                errLabel.textContent = "Failed to load";
                img.onerror = function() {
                  if (this.dataset.retried === "1") {
                    this.style.display = "none";
                    errLabel.style.display = "block";
                    failedCount++;
                    if (failedCount >= pages.length) {
                      container.innerHTML = '<div class="empty-state">Images unavailable.</div>';
                    }
                    return;
                  }
                  this.dataset.retried = "1";
                };
                wrapper.appendChild(img);
                wrapper.appendChild(errLabel);
                container.appendChild(wrapper);
              });
              window.scrollTo({ top: 0, behavior: "instant" });
              updateNavButtons();
              return;
            }
          } catch (e) {
            if (gen !== chapterGen) return;
          }
          container.innerHTML = '<div class="empty-state">Failed to load chapter images.</div>';
          return;
        }

        // MangaDex: fetch pages via CORS proxy
        try {
          const chapNum = ch.attributes.chapter;
          const res = await fetch(`${JIKAN.WEEBCENTRAL_API}/api/scrape/pages?id=${mangadexId}&chapterNumber=${chapNum}&provider=mangadex`);
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          const pages = Array.isArray(data) ? data : (data.data || data.pages || []);
          const sorted = pages
            .sort((a, b) => (a.order || 0) - (b.order || 0))
            .map(p => p.url || p.originalUrl || p)
            .filter(url => typeof url === "string" && url.startsWith("http"));

          if (gen !== chapterGen) return;
          if (sorted.length) {
            container.innerHTML = "";
            let failedCount = 0;
            sorted.forEach((url, pi) => {
              const wrapper = document.createElement("div");
              wrapper.className = "reader-page-wrapper";
              const img = document.createElement("img");
              img.className = "reader-page-img";
              img.src = url;
              img.alt = `Page ${pi + 1}`;
              img.loading = pi < 3 ? "eager" : "lazy";
              const errLabel = document.createElement("div");
              errLabel.className = "reader-page-error";
              errLabel.style.display = "none";
              errLabel.textContent = "Failed to load";
              img.onerror = function() {
                if (this.dataset.retried === "1") {
                  this.style.display = "none";
                  errLabel.style.display = "block";
                  failedCount++;
                  if (failedCount >= sorted.length) {
                    container.innerHTML = '<div class="empty-state">Images unavailable.</div>';
                  }
                  return;
                }
                this.dataset.retried = "1";
              };
              wrapper.appendChild(img);
              wrapper.appendChild(errLabel);
              container.appendChild(wrapper);
            });
            window.scrollTo({ top: 0, behavior: "instant" });
            updateNavButtons();
            return;
          }
        } catch (e) {
          if (gen !== chapterGen) return;
        }
        if (gen !== chapterGen) return;
        container.innerHTML = '<div class="empty-state">Chapter not available.</div>';
        updateNavButtons();
      }

      // ── Navigation ──
      $("prevChapter").addEventListener("click", () => goToChapter(currentChapterIdx - 1));
      $("nextChapter").addEventListener("click", () => goToChapter(currentChapterIdx + 1));
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
        if (e.key === "ArrowLeft") goToChapter(currentChapterIdx - 1);
        else if (e.key === "ArrowRight") goToChapter(currentChapterIdx + 1);
      });

      function esc(str) {
        if (!str) return "";
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
      }

      init();
    })();
  </script>
</body>
</html>
