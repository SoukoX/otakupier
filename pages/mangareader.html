<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Read Manga - OtakuPier</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../css/style.css?v=27">
  <link rel="preconnect" href="https://manga-scrape-api.vercel.app">
  <link rel="preconnect" href="https://mangakatana.com">
  <link rel="dns-prefetch" href="https://soukox.goatcounter.com">
<script data-goatcounter="https://soukox.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body class="reader-body">
  <nav class="navbar" id="navbar"></nav>

  <div class="reader-page">
    <div class="reader-top-bar">
      <a class="reader-back" href="javascript:history.back()">← Back</a>
      <button class="reader-sidebar-open-btn" id="sidebarOpenBtn" aria-label="Show chapters">☰</button>
      <div class="reader-chapter-nav">
        <button class="btn btn-outline btn-small" id="prevChapter" disabled>← Prev</button>
        <span class="reader-chapter-label" id="chapterLabel">Select a chapter</span>
        <button class="btn btn-outline btn-small" id="nextChapter" disabled>Next →</button>
      </div>
      <span id="readerSaveSlot"></span>
    </div>

    <div class="reader-content">
      <div class="reader-backdrop" id="readerBackdrop"></div>
      <aside class="reader-sidebar" id="readerSidebar">
        <div class="reader-sidebar-head">
          <h2 class="reader-manga-title" id="mangaTitle">Loading...</h2>
          <button class="reader-sidebar-close" id="sidebarClose" aria-label="Hide chapters">✕</button>
        </div>
        <div class="reader-chapter-list" id="chapterList">
          <div class="loading"><div class="spinner"></div>Finding chapters...</div>
        </div>
      </aside>

      <div class="reader-main">
        <div class="reader-pages" id="readerPages">
          <div class="reader-placeholder" id="readerPlaceholder">
            <div class="empty-state">
              <h3>📖 Manga Reader</h3>
              <p>Select a chapter from the sidebar to start reading.</p>
            </div>
          </div>
        </div>
        <footer id="siteFooter"></footer>
      </div>
    </div>
  </div>

  <h1 class="sr-only">Read Manga - OtakuPier</h1>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js?v=30"></script>
  <script src="../js/api.js?v=30"></script>
  <script src="../js/app.js?v=30"></script>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const mangaTitle = params.get("title") || "Manga";
      const mangaId = params.get("id") || "";
      let isAdult = params.get("adult") === "1";
      const resumeChapter = params.get("ch") || "";
      let mangadexId = null;
      let currentProvider = "mangadex";
      let weebcentralMangaId = null;
      let chapters = [];
      let currentChapterIdx = -1;
      let sidebarOpen = true;

      const API = "https://api.mangadex.org";

      const $ = (id) => document.getElementById(id);

      $("mangaTitle").textContent = mangaTitle;
      document.title = mangaTitle + " - Read Manga | OtakuPier";

      // Get format from URL params (passed from manga.html)
      const mangaFormat = params.get("format") || "";
      let isManhwa = mangaFormat.toUpperCase() === "MANHWA";
      let manhwaDetected = false;

      // Auto-detect manhwa from AniList if no format param passed
      async function detectManhwaFromAniList() {
        if (mangaFormat) return; // Already have format from URL
        try {
          const res = await fetch(`https://graphql.anilist.co`, {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({
              query: `query($s: String) { Page(page:1, perPage:1) { media(search: $s, type: MANGA) { id format countryOfOrigin genres } } }`,
              variables: { s: mangaTitle }
            })
          });
          const data = await res.json();
          const media = data?.data?.Page?.media?.[0];
          if (media) {
            manhwaDetected = media.format === "MANHWA" || media.countryOfOrigin === "KR";
            isManhwa = manhwaDetected;
            console.log("[Reader] Auto-detected format:", media.format, "country:", media.countryOfOrigin, "isManhwa:", isManhwa);
          }
        } catch (e) {
          console.warn("[Reader] Manhwa auto-detect failed:", e);
        }
      }

      // ── Sidebar ──
      function updateSidebar() {
        $("readerSidebar").classList.toggle("hidden", !sidebarOpen);
        $("sidebarOpenBtn").style.display = sidebarOpen ? "none" : "inline-block";
        $("sidebarClose").style.display = sidebarOpen ? "inline-block" : "none";
        $("readerBackdrop").classList.toggle("show", sidebarOpen && window.innerWidth <= 768);
      }
      $("sidebarOpenBtn").onclick = () => { sidebarOpen = true; updateSidebar(); };
      $("sidebarClose").onclick = () => { sidebarOpen = false; updateSidebar(); };
      $("readerBackdrop").onclick = () => { sidebarOpen = false; updateSidebar(); };
      window.addEventListener("resize", updateSidebar);

      // ── Title matching ──
      function norm(s) {
        return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "").replace(/ou/g, "o");
      }

      // CORS proxy for APIs without CORS headers
      const PROXY_BASE = "https://otakupier.ankitchand533.workers.dev?url=";
      async function proxyFetch(url, timeoutMs) {
        const target = PROXY_BASE + encodeURIComponent(url);
        const res = await fetch(target, { signal: AbortSignal.timeout(timeoutMs || 20000) });
        if (!res.ok) throw new Error("Proxy HTTP " + res.status);
        return res.json();
      }

      // ── Step 1: Find manga — search MangaDex + WeebCentral in parallel, pick best ──
      async function init() {
        $("chapterList").innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';

        // If ID is mdx-*, fetch chapters directly by MangaDex ID
        if (mangaId.startsWith("mdx-")) {
          const directId = mangaId.replace("mdx-", "");
          try {
            const directRating = isAdult
              ? "contentRating%5B%5D=pornographic&contentRating%5B%5D=erotica&contentRating%5B%5D=suggestive&contentRating%5B%5D=safe"
              : "contentRating%5B%5D=suggestive&contentRating%5B%5D=safe";
            const chData = await proxyFetch(
              `https://api.mangadex.org/manga/${directId}/feed?translatedLanguage%5B%5D=en&limit=500&order%5Bchapter%5D=asc&${directRating}`
            );
            const allChapters = (chData.data || []).filter(ch => ch.attributes && ch.attributes.chapter && !ch.attributes.externalUrl);
            const seen = new Map();
            allChapters.forEach(ch => {
              const chapNum = ch.attributes.chapter;
              if (!chapNum) return;
              const key = normKey(chapNum);
              const existing = seen.get(key);
              if (!existing) {
                seen.set(key, ch);
              } else {
                // Dedup: prefer the most recent chapter (consistent with search path)
                const curTime = new Date(ch.attributes.publishAt || 0).getTime();
                const exTime = new Date(existing.attributes.publishAt || 0).getTime();
                if (curTime > exTime) seen.set(key, ch);
              }
            });
            const uniqueChapters = [...seen.values()];
            uniqueChapters.sort((a, b) => {
              const aN = parseNum(a.attributes.chapter);
              const bN = parseNum(b.attributes.chapter);
              return aN - bN;
            });
            if (uniqueChapters.length) {
              chapters = uniqueChapters;
              mangadexId = directId;
              currentProvider = "mangadex";
              renderChapterList();
              loadReaderSaveState();
              if (resumeChapter) {
                const targetNum = resumeChapter.trim();
                const targetParsed = parseNum(targetNum);
                let idx = chapters.findIndex(ch => String(ch.attributes.chapter || "").trim() === targetNum);
                if (idx < 0 && !isNaN(targetParsed)) {
                  idx = chapters.findIndex(ch => parseNum(ch.attributes.chapter) === targetParsed);
                }
                if (idx >= 0) goToChapter(idx);
              }
              return;
            }
          } catch (e) {
            console.error("[Reader] Direct MangaDex fetch failed:", e);
          }
        }

        console.log("[Reader] mangaTitle:", mangaTitle, "isAdult:", isAdult, "mangaId:", mangaId);

        const titles = [
          mangaTitle,
          mangaTitle.replace(/[:\-!]/g, " ").replace(/\s+/g, " ").trim(),
          mangaTitle.replace(/\s*\(.*?\)\s*/g, "").trim(),
          mangaTitle.split(":")[0].trim(),
        ].filter(Boolean);

        // Auto-detect manhwa from AniList if no format param
        await detectManhwaFromAniList();

        // Collect results from MangaDex + WeebCentral + MangaKatan (no rendering yet)
        const [mdData, wcData, mkData] = await Promise.allSettled([
          fetchMangaDexChapters(titles),
          fetchWeebCentralChapters(),
          fetchMangaKatanChapters(titles),
        ]);

        const md = mdData.status === "fulfilled" ? mdData.value : null;
        const wc = wcData.status === "fulfilled" ? wcData.value : null;
        const mk = mkData.status === "fulfilled" ? mkData.value : null;
        console.log("[Reader] md:", md ? md.count : "null", "wc:", wc ? wc.count : "null", "mk:", mk ? mk.count : "null");

        // Verify provider returned the correct manga (not a random one)
        function titleMatches(providerResult) {
          if (!providerResult || !providerResult.title) return false;
          const provLower = providerResult.title.toLowerCase().trim();
          const searchLower = mangaTitle.toLowerCase().trim();
          if (provLower === searchLower) return true;
          const normP = norm(providerResult.title);
          const normS = norm(mangaTitle);
          if (normP === normS) return true;
          // Allow if one is a prefix/suffix of the other
          if (normP.includes(normS) || normS.includes(normP)) return true;
          return false;
        }

        // For adult manga, try ManhwaUS + Hentai20 (often more chapters than MangaDex)
        // For non-adult manhwa, try MangaKatan
        let mh = null;
        let h20 = null;
        let mk = null;
        if (isAdult) {
          console.log("[Reader] Trying ManhwaUS + Hentai20...");
          const adultResults = await Promise.allSettled([
            fetchManhwaUsChapters(titles),
            fetchHentai20Chapters(titles),
          ]);
          mh = adultResults[0].status === "fulfilled" ? adultResults[0].value : null;
          if (adultResults[0].status === "rejected") console.error("[Reader] ManhwaUS error:", adultResults[0].reason);
          h20 = adultResults[1].status === "fulfilled" ? adultResults[1].value : null;
          if (adultResults[1].status === "rejected") console.error("[Reader] Hentai20 error:", adultResults[1].reason);
          console.log("[Reader] mh:", mh ? mh.count : "null", "h20:", h20 ? h20.count : "null");
        } else if (isManhwa) {
          console.log("[Reader] Non-adult manhwa detected, MangaKatan already fetched");
        } else {
          console.log("[Reader] Non-adult manga, MangaKatan already fetched");
        }

        // Pick best provider
        // Non-adult manhwa: MangaKatan primary, MangaDex secondary
        // Non-adult manga: MangaKatan primary (if has chapters), MangaDex secondary, WeebCentral tertiary
        // Adult: ManhwaUS primary, Hentai20 secondary, MangaDex fallback
        let chosen = null;
        const candidates = [mk, mh, h20, md, wc].filter(c => c && c.count > 0);
        if (candidates.length) {
          if (isAdult) {
            // Adult manga: prefer ManhwaUS (most chapters), then Hentai20, then MangaDex
            if (mh && mh.count > 0) {
              chosen = mh;
            } else if (h20 && h20.count > 0) {
              chosen = h20;
            } else {
              // MangaDex as fallback for adult
              const exact = candidates.filter(c => titleMatches(c));
              chosen = exact.length
                ? exact.reduce((a, b) => a.count >= b.count ? a : b)
                : candidates.reduce((a, b) => a.count >= b.count ? a : b);
            }
          } else if (isManhwa) {
            // Non-adult manhwa: prefer MangaKatan, then MangaDex, then WeebCentral
            if (mk && mk.count > 0) {
              chosen = mk;
            } else if (md && md.count > 0) {
              chosen = md;
            } else if (wc && wc.count > 0) {
              chosen = wc;
            } else {
              const exact = candidates.filter(c => titleMatches(c));
              chosen = exact.length
                ? exact.reduce((a, b) => a.count >= b.count ? a : b)
                : candidates.reduce((a, b) => a.count >= b.count ? a : b);
            }
          } else {
            // Non-adult manga: prefer MangaKatan if it has chapters (many manhwa not tagged), then MangaDex, then WeebCentral
            if (mk && mk.count > 0) {
              chosen = mk;
            } else if (md && md.count > 0) {
              chosen = md;
            } else if (wc && wc.count > 0) {
              chosen = wc;
            } else {
              // Fallback: pick best from any available provider
              const exact = candidates.filter(c => titleMatches(c));
              chosen = exact.length
                ? exact.reduce((a, b) => a.count >= b.count ? a : b)
                : candidates.reduce((a, b) => a.count >= b.count ? a : b);
            }
          }
        }

        // CRITICAL FALLBACK: When MangaDex + WeebCentral both fail (common for
        // Korean manhwa which aren't on those platforms), always try ManhwaUS +
        // Hentai20 regardless of the isAdult flag. This ensures adult manhwa
        // like Secret Class, MILF Hunter, etc. are never stranded with "No chapters".
        if (!chosen || chosen.count === 0) {
          console.log("[Reader] All primary providers failed, trying fallback providers...");
          const fallbackProviders = isAdult
            ? [fetchManhwaUsChapters(titles), fetchHentai20Chapters(titles)]
            : [fetchMangaKatanChapters(titles), fetchManhwaUsChapters(titles), fetchHentai20Chapters(titles)];
          const fallbackResults = await Promise.allSettled(fallbackProviders);
          const fallbackValues = fallbackResults
            .filter(r => r.status === "fulfilled")
            .map(r => r.value)
            .filter(v => v && v.count > 0);
          console.log("[Reader] fallback providers:", fallbackValues.map(v => v?.provider + "(" + v?.count + ")"));
          if (fallbackValues.length) {
            const exactFb = fallbackValues.filter(c => titleMatches(c));
            chosen = exactFb.length
              ? exactFb.reduce((a, b) => a.count >= b.count ? a : b)
              : fallbackValues.reduce((a, b) => a.count >= b.count ? a : b);
            if (!isAdult && (chosen.provider === "manhwaus" || chosen.provider === "hentai20")) {
              isAdult = true; // Mark as adult so the reader knows
            }
          }
        }

        // If all primary providers failed, try NHentai (adult only, doujinshi focus)
        if ((!chosen || chosen.count === 0) && isAdult) {
          const [nhData] = await Promise.allSettled([
            fetchNhentaiChapters(titles),
          ]);
          const nh = nhData.status === "fulfilled" ? nhData.value : null;
          if (nh) chosen = nh;
        }

        console.log("[Reader] chosen:", chosen ? `${chosen.provider} (${chosen.count} ch)` : "null");

        if (chosen && chosen.count > 0) {
          chapters = chosen.chapters;
          currentProvider = chosen.provider;
          if (chosen.title) $("mangaTitle").textContent = chosen.title;
          if (chosen.mangadexId) mangadexId = chosen.mangadexId;
          if (chosen.weebcentralId) weebcentralMangaId = chosen.weebcentralId;
          renderChapterList();
          loadReaderSaveState();
          // Resume from saved chapter if ?ch= param present
          if (resumeChapter) {
            const targetNum = resumeChapter.trim();
            const targetParsed = parseNum(targetNum);
            let idx = -1;
            // Try exact string match first
            idx = chapters.findIndex(ch => String(ch.attributes.chapter || "").trim() === targetNum);
            // Fallback: numeric match
            if (idx < 0 && !isNaN(targetParsed)) {
              idx = chapters.findIndex(ch => parseNum(ch.attributes.chapter) === targetParsed);
            }
            if (idx >= 0) goToChapter(idx);
          }
        } else {
          $("chapterList").innerHTML = '<div class="empty-state">' +
            '<p>No chapters found.</p>' +
            '<p style="margin-top:8px;font-size:0.85em;">This manga may not have readable chapters available yet.</p></div>';
        }
      }

      async function fetchMangaDexChapters(titles) {
        for (const title of titles) {
          try {
            const searchRating = isAdult
              ? "contentRating%5B%5D=pornographic&contentRating%5B%5D=erotica&contentRating%5B%5D=suggestive&contentRating%5B%5D=safe"
              : "contentRating%5B%5D=suggestive&contentRating%5B%5D=safe";
            const data = await proxyFetch(`https://api.mangadex.org/manga?title=${encodeURIComponent(title)}&limit=10&includes[]=cover_art&${searchRating}`);
            if (data && data.data && data.data.length) {
              const lower = mangaTitle.toLowerCase();
              const normLower = norm(mangaTitle);
              const scored = data.data
                .map(m => {
                  const attrs = m.attributes || {};
                  const en = (attrs.title?.en || "").toLowerCase();
                  const jar = (attrs.title?.["ja-ro"] || "").toLowerCase();
                  const ko = (attrs.title?.ko || "").toLowerCase();
                  const alts = (attrs.altTitles || []).map(a => (a.en || a["ja-ro"] || a.ko || "")).filter(Boolean).map(s => s.toLowerCase());
                  const allTitles = [en, jar, ko, ...alts].filter(Boolean);
                  let best = 0;
                  for (const t of allTitles) {
                    const normT = norm(t);
                    if (normT === normLower || t === lower) { best = 200; break; }
                    if (best < 100 && (normT.includes(normLower) || normLower.includes(normT))) {
                      const shorter = normT.length < normLower.length ? normT : normLower;
                      const longer = normT.length >= normLower.length ? normT : normLower;
                      if (shorter.length > 3 && longer.includes(shorter)) {
                        best = Math.max(best, 100);
                      }
                    }
                    if (best < 80 && (normT.endsWith(normLower) || normT.startsWith(normLower))) best = 80;
                  }
                  return { manga: m, score: best };
                })
                .filter(x => x.score >= 100)
                .sort((a, b) => b.score - a.score);

              if (scored.length) {
                for (const candidate of scored) {
                  const mangaId = candidate.manga.id;
                  try {
                    const chRating = isAdult
                      ? "contentRating%5B%5D=pornographic&contentRating%5B%5D=erotica&contentRating%5B%5D=suggestive&contentRating%5B%5D=safe"
                      : "contentRating%5B%5D=suggestive&contentRating%5B%5D=safe";
                    const chData = await proxyFetch(
                      `https://api.mangadex.org/manga/${mangaId}/feed?translatedLanguage%5B%5D=en&limit=500&order%5Bchapter%5D=asc&${chRating}`
                    );
                    const allChapters = (chData.data || []).filter(ch => ch.attributes && ch.attributes.chapter && !ch.attributes.externalUrl);
                    const seen = new Map();
                    allChapters.forEach(ch => {
                      const chapNum = ch.attributes.chapter;
                      if (!chapNum) return;
                      const key = normKey(chapNum);
                      const existing = seen.get(key);
                      if (!existing) {
                        seen.set(key, ch);
                      } else {
                        const curTime = new Date(ch.attributes.publishAt || 0).getTime();
                        const exTime = new Date(existing.attributes.publishAt || 0).getTime();
                        if (curTime > exTime) seen.set(key, ch);
                      }
                    });
                    const hostedChapters = Array.from(seen.values());
                    if (hostedChapters.length) {
                      return {
                        provider: "mangadex",
                        count: hostedChapters.length,
                        chapters: sortChapters(hostedChapters),
                        title: candidate.manga.attributes?.title?.en || mangaTitle,
                        mangadexId: mangaId,
                      };
                    }
          } catch (_) { console.log("[MangaDex] Error on candidate:", candidate?.manga?.id, _); continue; }
                }
              }
            }
          } catch (e) { continue; }
        }
        return null;
      }

      async function fetchWeebCentralChapters() {
        const wcData = await proxyFetch(
          `https://manga-scrape-api.vercel.app/api/scrape/search?query=${encodeURIComponent(mangaTitle)}&provider=weebcentral`
        );
        const wcResults = Array.isArray(wcData) ? wcData : (wcData.results || wcData.data || []);
        const cleanTitle = (t) => (t || "").replace(/^Official\s+/, "").replace(/\s+/g, " ").trim();
        const lower = mangaTitle.toLowerCase();

        // Score each result — prefer exact match, then closest length match
        let bestMatch = null;
        let bestScore = -1;
        for (const r of wcResults) {
          const t = cleanTitle(r.title).toLowerCase();
          if (!t) continue;
          let score = 0;
          if (t === lower) score = 200;
          else if (lower === t.replace(/^official\s+/, "").trim()) score = 180;
          else if (t.endsWith(lower) || t.startsWith(lower)) score = 100;
          else if (t.includes(lower)) score = 80;
          else if (lower.includes(t) && t.length > 3) score = 40;
          // Penalize if the result title is much longer (extra words = wrong match)
          if (score > 0 && t.length > lower.length * 2) score -= 50;
          if (score > bestScore) {
            bestScore = score;
            bestMatch = r;
          }
        }

        if (!bestMatch || bestScore < 80) return null;

        const wcManga = bestMatch;

        const chData = await proxyFetch(
          `https://manga-scrape-api.vercel.app/api/scrape/chapters?id=${wcManga.id}&provider=weebcentral`
        );
        const wcChapters = Array.isArray(chData) ? chData : (chData.chapters || chData.data || []);
        if (!wcChapters.length) return null;

        const mapped = wcChapters.map(ch => ({
          id: ch.id,
          attributes: {
            chapter: ch.number || ch.title?.match(/[\d.]+/)?.[0] || "?",
            title: ch.title || "",
            volume: null,
            pages: ch.pages || 0,
            provider: "weebcentral"
          }
        }));

        return {
          provider: "weebcentral",
          count: mapped.length,
          chapters: sortChapters(mapped),
          title: cleanTitle(wcManga.title) || mangaTitle,
          weebcentralId: wcManga.id,
        };
      }

      // ── ManhwaUS provider ──
      async function fetchManhwaUsChapters(titles) {
        const toSlug = (t) => t.toLowerCase()
          .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        const slug = toSlug(mangaTitle);
        const allSlugs = [slug, ...titles.map(toSlug)];
        // Also try common suffix/infix variations
        const extraSlugs = [];
        for (const s of allSlugs) {
          if (s.includes("-hunter")) extraSlugs.push(s.replace("-hunter", "-hunting"));
          if (s.includes("-hunting")) extraSlugs.push(s.replace("-hunting", "-hunter"));
          if (s.includes("another-world") && !s.includes("-in-another-world")) {
            extraSlugs.push(s.replace("another-world", "in-another-world"));
          }
          if (s.includes("-in-another-world")) {
            extraSlugs.push(s.replace("-in-another-world", "-another-world"));
          }
          // Try dropping common prefixes like "the", "a", "an"
          const dropped = s.replace(/^(the|a|an)-/, "");
          if (dropped !== s) extraSlugs.push(dropped);
          // Try dropping -raw, -uncensored suffixes
          const cleaned = s.replace(/-raw$/, "").replace(/-uncensored$/, "");
          if (cleaned !== s) extraSlugs.push(cleaned);
        }
        const trySlugs = [...new Set([...allSlugs, ...extraSlugs])];
        console.log("[ManhwaUS] Trying slugs:", trySlugs);

        const normLower = norm(mangaTitle);
        const normVariant = (s) => s.replace(/hunting/g, "hunter").replace(/reading/g, "reader");
        // Try direct slug URLs first (faster than search)
        for (const s of trySlugs) {
          const url = `https://manhwaus.net/webtoon/${s}/`;
          try {
            const html = await proxyFetchText(url);
            if (!html) continue;
            const pageTitle = (html.match(/<title[^>]*>([^<]+)<\/title>/i) || [])[1] || "";
            if (pageTitle.toLowerCase().includes("not found")) continue;
            // Lenient title match: strip common words and check core overlap

            const scored = results.map(g => {
              const t = (g.english_title || g.japanese_title || "").toLowerCase();
              let score = 0;
              if (t === lower) score = 200;
              else if (t.includes(lower) || lower.includes(t)) score = 100;
              else {
                const words = lower.split(/\s+/);
                const matches = words.filter(w => t.includes(w)).length;
                score = matches / words.length * 80;
              }
              return { gallery: g, score };
            }).sort((a, b) => b.score - a.score);

            if (scored.length && scored[0].score >= 100) {
              const g = scored[0].gallery;
              const pages = g.num_pages || 0;
              if (!pages) continue;
              const chaps = [];

      // Fetch text content via proxy (for HTML scraping)
      async function proxyFetchText(url, timeoutMs) {
        const target = PROXY_BASE + encodeURIComponent(url);
        const res = await fetch(target, { signal: AbortSignal.timeout(timeoutMs || 20000) });
        if (!res.ok) throw new Error("Proxy HTTP " + res.status);
        return res.text();
      }

      function sortChapters(arr) {
        return arr.sort((a, b) => {
          const na = parseNum(a.attributes.chapter);
          const nb = parseNum(b.attributes.chapter);
          // Numeric chapters sort by number
          if (na !== Infinity && nb !== Infinity && na !== nb) return na - nb;
          // If one is numeric and the other isn't, numeric comes first
          if (na !== Infinity && nb === Infinity) return -1;
          if (na === Infinity && nb !== Infinity) return 1;
          // Both non-numeric: sort alphabetically by chapter label
          if (na === Infinity && nb === Infinity) {
            const la = String(a.attributes.chapter || "").toLowerCase();
            const lb = String(b.attributes.chapter || "").toLowerCase();
            return la.localeCompare(lb);
          }
          // Same number: tiebreak by volume
          const va = parseFloat(a.attributes.volume) || 0;
          const vb = parseFloat(b.attributes.volume) || 0;
          return va - vb;
        });
      }

      function parseNum(str) {
        const s = String(str).trim();
        const n = parseFloat(s);
        if (!isNaN(n)) return n;
        const m = s.match(/[\d.]+/);
        return m ? parseFloat(m[0]) : Infinity;
      }

      function normKey(str) {
        const s = String(str || "").trim();
        const n = parseNum(s);
        if (n !== Infinity && !isNaN(n)) {
          // Check for part suffixes (e.g., "13 Part 2", "13.5b") — don't merge these
          const afterNum = s.replace(/^[\d.]+/, "").trim().toLowerCase();
          if (afterNum && /^(part|pt|b|c|d|extra|appendix)/.test(afterNum)) {
            return String(n) + "_" + afterNum.replace(/[^a-z0-9]/g, "");
          }
          return String(n);
        }
        // Non-numeric chapters (Extra, Oneshot, etc.) — normalize for dedup
        return "n_" + s.toLowerCase()
          .replace(/[^a-z0-9]/g, "")
          .slice(0, 40)
          || "_unknown_" + Math.random().toString(36).slice(2, 6);
      }

      function renderChapterList() {
        const list = $("chapterList");
        let html = `<div class="chapter-list-header">${chapters.length} chapters</div>`;
        chapters.forEach((ch, i) => {
          const a = ch.attributes;
          const vol = a.volume ? ` Vol.${a.volume}` : "";
          const chTitle = a.title ? ` - ${a.title}` : "";
          html += `<button class="chapter-item" data-idx="${i}">
            <span class="chapter-num">Ch. ${esc(a.chapter || "?")}${vol}</span>
            <span class="chapter-name">${esc(chTitle)}</span>
          </button>`;
        });
        list.innerHTML = html;
        list.querySelectorAll(".chapter-item").forEach(btn => {
          btn.addEventListener("click", () => goToChapter(parseInt(btn.dataset.idx)));
        });
      }

      // ── Step 3: Navigate to chapter ──
      let chapterGen = 0;

      function goToChapter(idx) {
        if (idx < 0 || idx >= chapters.length) return;
        currentChapterIdx = idx;
        const gen = ++chapterGen;

        const ch = chapters[idx];
        const vol = ch.attributes.volume ? ` Vol.${ch.attributes.volume}` : "";
        $("chapterLabel").textContent = "Ch. " + (ch.attributes.chapter || "?") + vol;

        $("chapterList").querySelectorAll(".chapter-item").forEach((el, i) => {
          el.classList.toggle("active", i === idx);
        });

        $("readerPlaceholder") && ($("readerPlaceholder").style.display = "none");
        $("readerPages").innerHTML = '<div class="reader-loading"><div class="spinner"></div><span>Loading...</span></div>';

        loadChapterImages(ch, gen);
        if (isSaved) updateSavePosition();
      }

      function updateNavButtons() {
        $("prevChapter").disabled = currentChapterIdx <= 0;
        $("nextChapter").disabled = currentChapterIdx >= chapters.length - 1;
      }

      async function loadChapterImages(ch, gen) {
        const container = $("readerPages");

        // WeebCentral: fetch pages from the scrape API
        if (currentProvider === "weebcentral") {
          try {
            const pagesData = await proxyFetch(
              `https://manga-scrape-api.vercel.app/api/scrape/pages?id=${weebcentralMangaId}&chapterNumber=${ch.attributes.chapter}&provider=weebcentral`
            );
            const rawPages = Array.isArray(pagesData) ? pagesData : (pagesData.pages || pagesData.data || []);
            const pages = rawPages
              .sort((a, b) => (a.order || 0) - (b.order || 0))
              .map(p => p.url || p.originalUrl || p)
              .filter(url => typeof url === "string" && url.startsWith("http"));
            if (gen !== chapterGen) return;
            if (pages.length) {
              container.innerHTML = "";
              let failedCount = 0;
              pages.forEach((url, pi) => {
                const wrapper = document.createElement("div");
                wrapper.className = "reader-page-wrapper";
                const img = document.createElement("img");
                img.className = "reader-page-img";
                img.src = url;
                img.alt = `Page ${pi + 1}`;
                img.loading = pi < 3 ? "eager" : "lazy";
                const errLabel = document.createElement("div");
                errLabel.className = "reader-page-error";
                errLabel.style.display = "none";
                errLabel.textContent = "Failed to load";
                img.onerror = function() {
                  if (this.dataset.retried === "2") {
                    this.style.display = "none";
                    errLabel.style.display = "block";
                    failedCount++;
                    if (failedCount >= pages.length) {
                      container.innerHTML = '<div class="empty-state">Images unavailable.</div>';
                    }
                    return;
                  }
                  this.dataset.retried = String(parseInt(this.dataset.retried || "0") + 1);
                  const retry = parseInt(this.dataset.retried);
                  if (retry === 1) {
                    this.src = PROXY_BASE + encodeURIComponent(url);
                  } else {
                    this.style.display = "none";
                    errLabel.style.display = "block";
                    failedCount++;
                  }
                };
                wrapper.appendChild(img);
                wrapper.appendChild(errLabel);
                container.appendChild(wrapper);
              });
              window.scrollTo({ top: 0, behavior: "instant" });
              updateNavButtons();
              return;
            }
          } catch (e) {
            if (gen !== chapterGen) return;
          }
          container.innerHTML = '<div class="empty-state">Failed to load chapter images.</div>';
          return;
        }

        // ManhwaUS: fetch chapter page and extract image URLs
        if (currentProvider === "manhwaus") {
          try {
            const html = await proxyFetchText(ch._manhwausUrl);
            if (gen !== chapterGen) return;
            // ManhwaUS uses data-src for lazy loading and src for immediate; filter out non-manga images
            const imgMatches = [...html.matchAll(/(?:src|data-src)=['"](https?:\/\/[^'"]+\.(?:jpg|jpeg|png|webp))['"]/gi)];
            let pages = [...new Set(imgMatches.map(m => m[1])
              .filter(u => !u.includes("thumbnail") && !u.includes("logo") && !u.includes("avatar") && !u.includes("manhwaus-logo") && !u.includes("removebg") && !u.includes("banner") && !u.includes("icon")))];
            // Also try data-srcset for modern lazy-loading
            if (!pages.length) {
              const srcsetMatches = [...html.matchAll(/data-srcset=['"](https?:\/\/[^'"]+\.(?:jpg|jpeg|png|webp)[^'"]*)['"]/gi)];
              pages = [...new Set(srcsetMatches.map(m => m[1].split(" ")[0]).filter(u => u && !u.includes("thumbnail") && !u.includes("logo")))];
            }
            // Also try background-image style
            if (!pages.length) {
              const bgMatches = [...html.matchAll(/background-image:\s*url\(['"]?(https?:\/\/[^'")]+\.(?:jpg|jpeg|png|webp))['"]?\)/gi)];
              pages = [...new Set(bgMatches.map(m => m[1]).filter(u => !u.includes("thumbnail") && !u.includes("logo")))];
            }
            if (pages.length) {
              container.innerHTML = "";
              let failedCount = 0;
              pages.forEach((url, pi) => {
                const wrapper = document.createElement("div");
                wrapper.className = "reader-page-wrapper";
                const img = document.createElement("img");
                img.className = "reader-page-img";
                img.src = url;
                img.alt = `Page ${pi + 1}`;
                img.loading = pi < 3 ? "eager" : "lazy";
                const errLabel = document.createElement("div");
                errLabel.className = "reader-page-error";
                errLabel.style.display = "none";
                errLabel.textContent = "Failed to load";
                img.onerror = function() {
                  if (this.dataset.retried === "1") {
                    this.style.display = "none";
                    errLabel.style.display = "block";
                    failedCount++;
                    if (failedCount >= pages.length) container.innerHTML = '<div class="empty-state">Images unavailable.</div>';
                    return;
                  }
                  this.dataset.retried = "1";
                  this.src = PROXY_BASE + encodeURIComponent(url);
                };
                wrapper.appendChild(img);
                wrapper.appendChild(errLabel);
                container.appendChild(wrapper);
              });
              window.scrollTo({ top: 0, behavior: "instant" });
              updateNavButtons();
              return;
            }
          } catch (e) {
            console.error("[Reader] ManhwaUS image load failed:", e);
            if (gen !== chapterGen) return;
          }
          container.innerHTML = '<div class="empty-state">Failed to load chapter images.</div>';
          return;
        }

        // Hentai20: fetch chapter page and extract image URLs
        if (currentProvider === "hentai20") {
          try {
            const html = await proxyFetchText(ch._hentai20Url);
            if (gen !== chapterGen) return;
            // hentai20 images are on img.hentai1.io or similar CDN domains
            let imgMatches = [...html.matchAll(/src=["'](https?:\/\/img\.[^"']+\.(?:jpg|jpeg|png|webp))["']/gi)];
            let pages = [...new Set(imgMatches.map(m => m[1]).filter(u => !u.includes("thumbnail") && !u.includes("logo") && !u.includes("avatar") && !u.includes("removebg")))];
            // Broader fallback: any image from hentai1.io/hentai20 CDN
            if (!pages.length) {
              imgMatches = [...html.matchAll(/(?:src|data-src)=["'](https?:\/\/[^"']+\.(?:jpg|jpeg|png|webp))["']/gi)];
              pages = [...new Set(imgMatches.map(m => m[1]).filter(u => 
                (u.includes("hentai1.io") || u.includes("hentai20") || u.includes("cdn")) && 
                !u.includes("thumbnail") && !u.includes("logo") && !u.includes("banner")))];
            }
            if (pages.length) {
              container.innerHTML = "";
              let failedCount = 0;
              pages.forEach((url, pi) => {
                const wrapper = document.createElement("div");
                wrapper.className = "reader-page-wrapper";
                const img = document.createElement("img");
                img.className = "reader-page-img";
                img.src = url;
                img.alt = `Page ${pi + 1}`;
                img.loading = pi < 3 ? "eager" : "lazy";
                const errLabel = document.createElement("div");
                errLabel.className = "reader-page-error";
                errLabel.style.display = "none";
                errLabel.textContent = "Failed to load";
                img.onerror = function() {
                  if (this.dataset.retried === "1") {
                    this.style.display = "none";
                    errLabel.style.display = "block";
                    failedCount++;
                    if (failedCount >= pages.length) container.innerHTML = '<div class="empty-state">Images unavailable.</div>';
                    return;
                  }
                  this.dataset.retried = "1";
                  this.src = PROXY_BASE + encodeURIComponent(url);
                };
                wrapper.appendChild(img);
                wrapper.appendChild(errLabel);
                container.appendChild(wrapper);
              });
              window.scrollTo({ top: 0, behavior: "instant" });
              updateNavButtons();
              return;
            }
          } catch (e) {
            console.error("[Reader] Hentai20 image load failed:", e);
            if (gen !== chapterGen) return;
          }
          container.innerHTML = '<div class="empty-state">Failed to load chapter images.</div>';
          return;
        }

        // MangaKatan: fetch chapter page and extract image URLs
        if (currentProvider === "mangakatana") {
          try {
            const html = await proxyFetchText(ch._mangakatanaUrl);
            if (gen !== chapterGen) return;
            // MangaKatan stores images in a JS array: var thzq=['url1','url2',...];
            let pages = [];
            const thzqMatch = html.match(/var\s+thzq\s*=\s*\[([\s\S]*?)\];/);
            if (thzqMatch) {
              const urls = thzqMatch[1].match(/https?:\/\/[^'"]+\.(?:jpg|jpeg|png|webp)/g);
              if (urls) pages = [...new Set(urls)];
            }
            // Fallback: try to find any i1.mangakatana.com image URLs
            if (!pages.length) {
              const imgMatches = [...html.matchAll(/https:\/\/i1\.mangakatana\.com\/token\/[^'"]+\.(?:jpg|jpeg|png|webp)/g)];
              pages = [...new Set(imgMatches.map(m => m[0]))];
            }
            // Fallback: standard img/src extraction
            if (!pages.length) {
              let imgMatches = [...html.matchAll(/src=["'](https?:\/\/[^"']+\.(?:jpg|jpeg|png|webp))["']/gi)];
              pages = [...new Set(imgMatches.map(m => m[1]).filter(u => 
                !u.includes("thumbnail") && !u.includes("logo") && !u.includes("avatar") && !u.includes("banner") && !u.includes("icon")))];
            }
            // Also try data-src for lazy-loaded images
            if (!pages.length) {
              imgMatches = [...html.matchAll(/data-src=["'](https?:\/\/[^"']+\.(?:jpg|jpeg|png|webp))["']/gi)];
              pages = [...new Set(imgMatches.map(m => m[1]).filter(u => 
                !u.includes("thumbnail") && !u.includes("logo") && !u.includes("avatar") && !u.includes("banner")))];
            }
            if (pages.length) {
              container.innerHTML = "";
              let failedCount = 0;
              pages.forEach((url, pi) => {
                const wrapper = document.createElement("div");
                wrapper.className = "reader-page-wrapper";
                const img = document.createElement("img");
                img.className = "reader-page-img";
                img.src = url;
                img.alt = `Page ${pi + 1}`;
                img.loading = pi < 3 ? "eager" : "lazy";
                const errLabel = document.createElement("div");
                errLabel.className = "reader-page-error";
                errLabel.style.display = "none";
                errLabel.textContent = "Failed to load";
                img.onerror = function() {
                  if (this.dataset.retried === "1") {
                    this.style.display = "none";
                    errLabel.style.display = "block";
                    failedCount++;
                    if (failedCount >= pages.length) container.innerHTML = '<div class="empty-state">Images unavailable.</div>';
                    return;
                  }
                  this.dataset.retried = "1";
                  this.src = PROXY_BASE + encodeURIComponent(url);
                };
                wrapper.appendChild(img);
                wrapper.appendChild(errLabel);
                container.appendChild(wrapper);
              });
              window.scrollTo({ top: 0, behavior: "instant" });
              updateNavButtons();
              return;
            }
          } catch (e) {
            console.error("[Reader] MangaKatan image load failed:", e);
            if (gen !== chapterGen) return;
          }
          container.innerHTML = '<div class="empty-state">Failed to load chapter images.</div>';
          return;
        }

        // NHentai: construct image URLs from media_id
        if (currentProvider === "nhentai") {
          const mediaId = ch._nhentaiMediaId;
          const page = ch._nhentaiPage;
          if (mediaId && page) {
            container.innerHTML = "";
            const ext = "webp";
            const url = `https://i.nhentai.net/galleries/${mediaId}/${page}.${ext}`;
            const wrapper = document.createElement("div");
            wrapper.className = "reader-page-wrapper";
            const img = document.createElement("img");
            img.className = "reader-page-img";
            img.src = PROXY_BASE + encodeURIComponent(url);
            img.alt = `Page ${page}`;
            img.loading = "eager";
            img.onerror = function() {
              // Try jpg fallback
              this.src = PROXY_BASE + encodeURIComponent(`https://i.nhentai.net/galleries/${mediaId}/${page}.jpg`);
              this.onerror = function() {
                const errLabel = document.createElement("div");
                errLabel.className = "reader-page-error";
                errLabel.textContent = "Failed to load";
                wrapper.appendChild(errLabel);
                this.style.display = "none";
              };
            };
            wrapper.appendChild(img);
            container.appendChild(wrapper);
            window.scrollTo({ top: 0, behavior: "instant" });
            updateNavButtons();
            return;
          }
          container.innerHTML = '<div class="empty-state">Failed to load chapter images.</div>';
          return;
        }

        // MangaDex: fetch pages via CORS proxy
        try {
          let data = null;
          // Retry at-home server once if first call fails (MangaDex CDN can be flaky)
          for (let attempt = 0; attempt < 2; attempt++) {
            try {
              data = await proxyFetch(
                `https://api.mangadex.org/at-home/server/${ch.id}`
              );
              if (data && data.baseUrl && data.chapter) break;
            } catch (e) {
              if (attempt === 0) await new Promise(r => setTimeout(r, 1000));
              else throw e;
            }
          }
          if (gen !== chapterGen) return;
          if (data && data.baseUrl && data.chapter) {
            const full = data.chapter.data || [];
            const saver = data.chapter.dataSaver || [];
            const pages = [...new Set(full.length ? full : saver)];
            const basePath = full.length ? "data" : "data-saver";
            if (pages.length) {
              container.innerHTML = "";
              let failedCount = 0;
              pages.forEach((filename, pi) => {
                const wrapper = document.createElement("div");
                wrapper.className = "reader-page-wrapper";
                const img = document.createElement("img");
                img.className = "reader-page-img";
                const directUrl = `${data.baseUrl}/${basePath}/${data.chapter.hash}/${filename}`;
                img.src = directUrl;
                img.alt = `Page ${pi + 1}`;
                img.loading = pi < 3 ? "eager" : "lazy";
                const errLabel = document.createElement("div");
                errLabel.className = "reader-page-error";
                errLabel.style.display = "none";
                errLabel.textContent = "Failed to load";
                img.onerror = function() {
                  if (this.dataset.retried === "2") {
                    this.style.display = "none";
                    errLabel.style.display = "block";
                    failedCount++;
                    if (failedCount >= pages.length) {
                      container.innerHTML = '<div class="empty-state">Images unavailable.</div>';
                    }
                    return;
                  }
                  this.dataset.retried = String(parseInt(this.dataset.retried || "0") + 1);
                  const retry = parseInt(this.dataset.retried);
                  if (retry === 1) {
                    this.src = PROXY_BASE + encodeURIComponent(directUrl);
                  } else {
                    const saverPath = basePath === "data" ? "data-saver" : "data";
                    const saverUrl = `${data.baseUrl}/${saverPath}/${data.chapter.hash}/${filename}`;
                    this.src = saverUrl;
                  }
                };
                wrapper.appendChild(img);
                wrapper.appendChild(errLabel);
                container.appendChild(wrapper);
              });
              window.scrollTo({ top: 0, behavior: "instant" });
              updateNavButtons();
              return;
            }
          }
        } catch (e) {
          console.error("[Reader] MangaDex at-home failed:", e);
          if (gen !== chapterGen) return;
        }
        // MangaDex failed — try WeebCentral as fallback for this chapter
        if (gen !== chapterGen) return;
        try {
          container.innerHTML = '<div class="reader-loading"><div class="spinner"></div><span>Trying WeebCentral...</span></div>';
          const wcPagesData = await proxyFetch(
            `https://manga-scrape-api.vercel.app/api/scrape/search?query=${encodeURIComponent(mangaTitle)}&provider=weebcentral`
          );
          const wcResults = Array.isArray(wcPagesData) ? wcPagesData : (wcPagesData.results || wcPagesData.data || []);
          if (wcResults.length && gen === chapterGen) {
            const bestWc = wcResults[0];
            const wcChData = await proxyFetch(
              `https://manga-scrape-api.vercel.app/api/scrape/pages?id=${bestWc.id}&chapterNumber=${ch.attributes.chapter}&provider=weebcentral`
            );
            const rawPages = Array.isArray(wcChData) ? wcChData : (wcChData.pages || wcChData.data || []);
            const fallbackPages = rawPages
              .sort((a, b) => (a.order || 0) - (b.order || 0))
              .map(p => p.url || p.originalUrl || p)
              .filter(url => typeof url === "string" && url.startsWith("http"));
            if (fallbackPages.length && gen === chapterGen) {
              container.innerHTML = "";
              let failedCount = 0;
              fallbackPages.forEach((url, pi) => {
                const wrapper = document.createElement("div");
                wrapper.className = "reader-page-wrapper";
                const img = document.createElement("img");
                img.className = "reader-page-img";
                img.src = url;
                img.alt = `Page ${pi + 1}`;
                img.loading = pi < 3 ? "eager" : "lazy";
                const errLabel = document.createElement("div");
                errLabel.className = "reader-page-error";
                errLabel.style.display = "none";
                errLabel.textContent = "Failed to load";
                img.onerror = function() {
                  if (this.dataset.retried === "2") {
                    this.style.display = "none";
                    errLabel.style.display = "block";
                    failedCount++;
                    return;
                  }
                  this.dataset.retried = String(parseInt(this.dataset.retried || "0") + 1);
                  const retry = parseInt(this.dataset.retried);
                  if (retry === 1) this.src = PROXY_BASE + encodeURIComponent(url);
                  else this.style.display = "none";
                };
                wrapper.appendChild(img);
                wrapper.appendChild(errLabel);
                container.appendChild(wrapper);
              });
              window.scrollTo({ top: 0, behavior: "instant" });
              updateNavButtons();
              return;
            }
          }
        } catch (e) {
          console.error("[Reader] WeebCentral fallback failed:", e);
        }
        if (gen !== chapterGen) return;
        container.innerHTML = '<div class="empty-state">Chapter not available.</div>';
        updateNavButtons();
      }

      // ── Navigation ──
      $("prevChapter").addEventListener("click", () => goToChapter(currentChapterIdx - 1));
      $("nextChapter").addEventListener("click", () => goToChapter(currentChapterIdx + 1));
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
        if (e.key === "ArrowLeft") goToChapter(currentChapterIdx - 1);
        else if (e.key === "ArrowRight") goToChapter(currentChapterIdx + 1);
      });

      function esc(str) {
        if (!str) return "";
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
      }

      // ── Save manga with chapter position ──
      let isSaved = false;
      let savedRowId = null;

      async function loadReaderSaveState() {
        if (!isLoggedIn() || !mangaId) return;
        try {
          const { data, error } = await supabase
            .from("saved_manga")
            .select("id, last_chapter_idx")
            .eq("user_id", currentUser.id)
            .eq("manga_id", mangaId)
            .maybeSingle();
          if (error) throw error;
          if (data) {
            isSaved = true;
            savedRowId = data.id;
          }
        } catch (e) {
          console.warn("[manga save] load state failed:", e.message);
        }
        renderReaderSaveButton();
      }

      function renderReaderSaveButton() {
        const slot = $("readerSaveSlot");
        if (!slot) return;
        if (!isLoggedIn()) {
          slot.innerHTML = '<a class="btn btn-outline btn-small" href="' + pageHref("login") + '">Save</a>';
          return;
        }
        if (isSaved) {
          const ch = chapters[currentChapterIdx];
          const chLabel = ch ? "Ch. " + (ch.attributes.chapter || "?") : "";
          slot.innerHTML = '<button class="btn btn-outline btn-small" onclick="updateSavePosition()" title="Update save to current chapter">✓ Saved' +
            (chLabel ? ' · ' + chLabel : '') + '</button>';
        } else {
          slot.innerHTML = '<button class="btn btn-primary btn-small" onclick="saveMangaFromReader()">＋ Save</button>';
        }
      }

      async function saveMangaFromReader() {
        if (!isLoggedIn()) return;
        const ch = chapters[currentChapterIdx];
        const chLabel = ch ? (ch.attributes.chapter || "?") : "";
        const chTitle = ch ? (ch.attributes.title || "") : "";
        try {
          await dbInsert("saved_manga", {
            user_id: currentUser.id,
            manga_id: mangaId,
            manga_title: mangaTitle,
            manga_image: "",
            last_chapter: chLabel,
            last_chapter_idx: currentChapterIdx,
          });
          isSaved = true;
          awardXp(5);
          awardRp("save");
          showToast("Saved! +5 XP — " + (chLabel ? "Ch. " + chLabel : "position saved"));
          renderReaderSaveButton();
        } catch (err) {
          showToast("Could not save: " + err.message);
        }
      }

      async function updateSavePosition() {
        if (!isLoggedIn() || !isSaved) return;
        const ch = chapters[currentChapterIdx];
        const chLabel = ch ? (ch.attributes.chapter || "?") : "";
        try {
          await supabase.from("saved_manga").update({
            last_chapter: chLabel,
            last_chapter_idx: currentChapterIdx,
            updated_at: new Date().toISOString(),
          }).eq("user_id", currentUser.id).eq("manga_id", mangaId);
          showToast("Position updated — Ch. " + chLabel);
          renderReaderSaveButton();
        } catch (err) {
          showToast("Could not update position");
        }
      }

      init();
    })();
  </script>
</body>
</html>
