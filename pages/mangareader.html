<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Read Manga - OtakuPier</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../css/style.css?v=25">
  <link rel="preconnect" href="https://api.mangadex.org">
  <link rel="preconnect" href="https://api.jikan.moe">
  <link rel="preconnect" href="https://graphql.anilist.co">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://soukox.goatcounter.com">
<script data-goatcounter="https://soukox.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body class="reader-body">
  <nav class="navbar" id="navbar"></nav>

  <div class="reader-page">
    <div class="reader-top-bar">
      <a class="reader-back" href="javascript:history.back()">← Back</a>
      <button class="reader-sidebar-open-btn" id="sidebarOpenBtn" aria-label="Show chapters">☰</button>
      <div class="reader-chapter-nav">
        <button class="btn btn-outline btn-small" id="prevChapter" disabled>← Prev</button>
        <span class="reader-chapter-label" id="chapterLabel">Select a chapter</span>
        <button class="btn btn-outline btn-small" id="nextChapter" disabled>Next →</button>
      </div>
    </div>

    <div class="reader-content">
      <div class="reader-backdrop" id="readerBackdrop"></div>
      <aside class="reader-sidebar" id="readerSidebar">
        <div class="reader-sidebar-head">
          <h2 class="reader-manga-title" id="mangaTitle">Loading...</h2>
          <button class="reader-sidebar-close" id="sidebarClose" aria-label="Hide chapters">✕</button>
        </div>
        <div class="reader-chapter-list" id="chapterList">
          <div class="loading"><div class="spinner"></div>Finding chapters...</div>
        </div>
      </aside>

      <div class="reader-main">
        <div class="reader-pages" id="readerPages">
          <div class="reader-placeholder" id="readerPlaceholder">
            <div class="empty-state">
              <h3>📖 Manga Reader</h3>
              <p>Select a chapter from the sidebar to start reading.</p>
            </div>
          </div>
        </div>
        <footer id="siteFooter"></footer>
      </div>
    </div>
  </div>

  <h1 style="display:none;">Read Manga - OtakuPier</h1>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js?v=25"></script>
  <script src="../js/api.js?v=25"></script>
  <script src="../js/seo.js?v=25"></script>
  <script src="../js/app.js?v=25"></script>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const mangaTitle = params.get("title") || "Manga";
      let chapters = [];
      let currentChapterIdx = -1;
      let sidebarOpen = true;
      let activeProvider = "mangadex"; // "mangadex" | "komiku"
      let komikuSlug = null;

      const MD_API = "https://api.mangadex.org";
      const KOMIKU_API = "https://komiku-rest-api.vercel.app";

      const $ = (id) => document.getElementById(id);

      $("mangaTitle").textContent = mangaTitle;
      document.title = mangaTitle + " - Read Manga | OtakuPier";

      // ── Sidebar ──
      function updateSidebar() {
        $("readerSidebar").classList.toggle("hidden", !sidebarOpen);
        $("sidebarOpenBtn").style.display = sidebarOpen ? "none" : "inline-block";
        $("sidebarClose").style.display = sidebarOpen ? "inline-block" : "none";
        $("readerBackdrop").classList.toggle("show", sidebarOpen && window.innerWidth <= 768);
      }
      $("sidebarOpenBtn").onclick = () => { sidebarOpen = true; updateSidebar(); };
      $("sidebarClose").onclick = () => { sidebarOpen = false; updateSidebar(); };
      $("readerBackdrop").onclick = () => { sidebarOpen = false; updateSidebar(); };
      window.addEventListener("resize", updateSidebar);

      // ── Fast fetch with timeout ──
      async function apiFetch(url, timeout = 8000) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeout);
        try {
          const res = await fetch(url, { signal: ctrl.signal });
          clearTimeout(timer);
          if (!res.ok) throw new Error("HTTP " + res.status);
          return await res.json();
        } catch (e) {
          clearTimeout(timer);
          throw e;
        }
      }

      // ── Title matching helpers ──
      function norm(s) {
        return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "").replace(/ou/g, "o");
      }

      function titleScore(target, candidate) {
        const q = target.toLowerCase().trim();
        const n = norm(candidate);
        const qn = norm(q);
        if (n === qn) return 100;
        if (n.startsWith(qn) || qn.startsWith(n)) return 80;
        if (n.includes(qn) || qn.includes(n)) return 50;
        const words = qn.split(" ").filter(w => w.length > 2);
        if (words.length && words.every(w => n.includes(w))) return 40;
        return 0;
      }

      // ── MangaDex: pick best match ──
      function pickBestManga(results, targetTitle) {
        let best = results[0];
        let bestScore = -Infinity;
        for (const m of results) {
          const attrs = m.attributes;
          const allTitles = [attrs.title?.en, attrs.title?.["ja-ro"], attrs.title?.romaji, attrs.title?.native]
            .filter(Boolean);
          let score = 0;
          for (const t of allTitles) score = Math.max(score, titleScore(targetTitle, t));
          const name = (attrs.title?.en || attrs.title?.["ja-ro"] || "").toLowerCase();
          if (/\b(colored|colour|full.color)\b/.test(name)) score -= 60;
          if (/\b(doujin|spin.?off|short story|prototype|one shot)\b/i.test(name)) score -= 100;
          if (score > bestScore) { bestScore = score; best = m; }
        }
        return best;
      }

      // ── Komiku: pick best match ──
      function pickBestKomiku(results, targetTitle) {
        let best = results[0];
        let bestScore = -Infinity;
        for (const m of results) {
          let score = titleScore(targetTitle, m.title || "");
          if (m.altTitle) score = Math.max(score, titleScore(targetTitle, m.altTitle));
          if (score > bestScore) { bestScore = score; best = m; }
        }
        return best;
      }

      // ── Step 1: Find manga ──
      async function init() {
        $("chapterList").innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';

        // Try MangaDex first
        let mdOk = false;
        try {
          const data = await apiFetch(`${MD_API}/manga?title=${encodeURIComponent(mangaTitle)}&limit=10&includes[]=cover_art`);
          if (data.data && data.data.length) {
            const best = pickBestManga(data.data, mangaTitle);
            const mdId = best.id;
            $("mangaTitle").textContent =
              best.attributes.title.en || best.attributes.title["ja-ro"] || mangaTitle;

            // Try to load English chapters
            try {
              const chData = await apiFetch(
                `${MD_API}/manga/${mdId}/feed?translatedLanguage%5B%5D=en&limit=500&order%5Bchapter%5D=asc`
              );
              const allCh = (chData.data || []).filter(ch => ch.attributes && ch.attributes.chapter);
              const hosted = allCh.filter(ch => !ch.attributes.externalUrl);
              if (hosted.length > 0) {
                activeProvider = "mangadex";
                loadMdChapters(allCh);
                mdOk = true;
              }
            } catch (e) {}
          }
        } catch (e) {
          console.error("[MangaDex]", e);
        }

        if (mdOk) return;

        // Fallback: Komiku
        try {
          $("chapterList").innerHTML = '<div class="loading"><div class="spinner"></div>Trying Komiku...</div>';
          const data = await apiFetch(`${KOMIKU_API}/search?q=${encodeURIComponent(mangaTitle)}`);
          const results = data.data || [];
          if (!results.length) {
            $("chapterList").innerHTML = '<div class="empty-state">Manga not found.</div>';
            return;
          }
          const best = pickBestKomiku(results, mangaTitle);
          komikuSlug = best.slug;
          $("mangaTitle").textContent = best.title || mangaTitle;
          activeProvider = "komiku";
          await loadKomikuChapters(best.slug);
        } catch (e) {
          console.error("[Komiku]", e);
          $("chapterList").innerHTML = '<div class="empty-state">Could not connect to manga service.</div>';
        }
      }

      // ── MangaDex: process chapters ──
      function loadMdChapters(allCh) {
        const seen = new Map();
        allCh.forEach(ch => {
          if (!ch.attributes.chapter) return;
          const key = normKey(ch.attributes.chapter);
          const existing = seen.get(key);
          if (!existing) { seen.set(key, ch); return; }
          const aExt = !!existing.attributes.externalUrl;
          const bExt = !!ch.attributes.externalUrl;
          if (aExt && !bExt) { seen.set(key, ch); return; }
          if (!aExt && bExt) return;
          const aP = existing.attributes.pages || 0;
          const bP = ch.attributes.pages || 0;
          if (bP > aP) seen.set(key, ch);
        });
        chapters = Array.from(seen.values())
          .filter(ch => !ch.attributes.externalUrl)
          .sort((a, b) => {
            const na = parseNum(a.attributes.chapter);
            const nb = parseNum(b.attributes.chapter);
            if (na !== nb) return na - nb;
            return (parseFloat(a.attributes.volume) || 0) - (parseFloat(b.attributes.volume) || 0);
          });
        if (!chapters.length) {
          $("chapterList").innerHTML = '<div class="empty-state">No readable chapters.</div>';
          return;
        }
        renderChapterList();
        goToChapter(0);
      }

      // ── Komiku: load chapters ──
      async function loadKomikuChapters(slug) {
        const list = $("chapterList");
        try {
          const data = await apiFetch(`${KOMIKU_API}/detail-komik/${slug}/`);
          const chList = data.chapters || [];
          if (!chList.length) {
            list.innerHTML = '<div class="empty-state">No chapters available.</div>';
            return;
          }
          chapters = chList
            .filter(ch => ch.apiLink)
            .map(ch => ({
              _komiku: true,
              title: ch.title || "",
              chapter: ch.chapterNumber || "",
              apiLink: ch.apiLink,
              date: ch.date || "",
            }))
            .sort((a, b) => {
              const na = parseNum(a.chapter);
              const nb = parseNum(b.chapter);
              return na - nb;
            });
          if (!chapters.length) {
            list.innerHTML = '<div class="empty-state">No chapters available.</div>';
            return;
          }
          renderChapterList();
          goToChapter(0);
        } catch (e) {
          console.error("[Komiku chapters]", e);
          list.innerHTML = '<div class="empty-state">Failed to load chapters.</div>';
        }
      }

      // ── Parse chapter number ──
      function parseNum(str) {
        const s = String(str).toLowerCase().trim();
        const chMatch = s.match(/(?:ch(?:apter)?\.?\s*)([\d.]+)/i);
        if (chMatch) return parseFloat(chMatch[1]);
        const m = s.match(/[\d.]+/);
        return m ? parseFloat(m[0]) : Infinity;
      }

      function normKey(str) {
        const n = parseNum(str);
        return n === Infinity ? String(str).trim().toLowerCase() : String(n);
      }

      // ── Render chapter list ──
      function renderChapterList() {
        const list = $("chapterList");
        let html = `<div class="chapter-list-header">${chapters.length} chapters</div>`;
        chapters.forEach((ch, i) => {
          const label = ch._komiku ? ch.title : ("Ch. " + (ch.attributes?.chapter || "?"));
          const sub = ch._komiku ? "" : (ch.attributes?.title || "");
          html += `<button class="chapter-item" data-idx="${i}">
            <span class="chapter-num">${esc(label)}</span>
            ${sub ? `<span class="chapter-name">${esc(sub)}</span>` : ''}
          </button>`;
        });
        list.innerHTML = html;
        list.querySelectorAll(".chapter-item").forEach(btn => {
          btn.addEventListener("click", () => goToChapter(parseInt(btn.dataset.idx)));
        });
      }

      // ── Navigate to chapter ──
      let chapterGen = 0;

      function goToChapter(idx) {
        if (idx < 0 || idx >= chapters.length) return;
        currentChapterIdx = idx;
        const gen = ++chapterGen;

        const ch = chapters[idx];
        const label = ch._komiku ? ch.title : ("Ch. " + (ch.attributes?.chapter || "?"));
        $("chapterLabel").textContent = label;

        $("chapterList").querySelectorAll(".chapter-item").forEach((el, i) => {
          el.classList.toggle("active", i === idx);
        });

        $("readerPlaceholder") && ($("readerPlaceholder").style.display = "none");
        $("readerPages").innerHTML = '<div class="reader-loading"><div class="spinner"></div><span>Loading...</span></div>';

        if (ch._komiku) {
          loadKomikuChapterImages(ch, gen);
        } else {
          loadMdChapterImages(ch, gen);
        }
      }

      function updateNavButtons() {
        $("prevChapter").disabled = currentChapterIdx <= 0;
        $("nextChapter").disabled = currentChapterIdx >= chapters.length - 1;
      }

      // ── MangaDex: load chapter images ──
      async function loadMdChapterImages(ch, gen) {
        const container = $("readerPages");
        try {
          const data = await apiFetch(`${MD_API}/at-home/server/${ch.id}`);
          if (gen !== chapterGen) return;
          if (data && data.baseUrl && data.chapter) {
            const full = data.chapter.data || [];
            const saver = data.chapter.dataSaver || [];
            const pages = full.length ? full : saver;
            const basePath = full.length ? "data" : "data-saver";
            if (pages.length) {
              renderPages(container, pages.map(f => `${data.baseUrl}/${basePath}/${data.chapter.hash}/${f}`), gen);
              return;
            }
          }
        } catch (e) {
          if (gen !== chapterGen) return;
        }
        if (gen !== chapterGen) return;
        container.innerHTML = '<div class="empty-state">Chapter not available.</div>';
        updateNavButtons();
      }

      // ── Komiku: load chapter images ──
      async function loadKomikuChapterImages(ch, gen) {
        const container = $("readerPages");
        try {
          const data = await apiFetch(`${KOMIKU_API}${ch.apiLink}`);
          if (gen !== chapterGen) return;
          const imgs = (data.images || []).map(img => img.src || img).filter(Boolean);
          if (imgs.length) {
            renderPages(container, imgs, gen);
            return;
          }
        } catch (e) {
          if (gen !== chapterGen) return;
        }
        if (gen !== chapterGen) return;
        container.innerHTML = '<div class="empty-state">Chapter not available.</div>';
        updateNavButtons();
      }

      // ── Shared: render page images ──
      function renderPages(container, urls, gen) {
        container.innerHTML = "";
        let failedCount = 0;
        urls.forEach((url, pi) => {
          const wrapper = document.createElement("div");
          wrapper.className = "reader-page-wrapper";
          const img = document.createElement("img");
          img.className = "reader-page-img";
          img.src = url;
          img.alt = `Page ${pi + 1}`;
          img.loading = pi < 3 ? "eager" : "lazy";
          const errLabel = document.createElement("div");
          errLabel.className = "reader-page-error";
          errLabel.style.display = "none";
          errLabel.textContent = "Failed to load";
          img.onerror = function() {
            if (this.dataset.retried === "2") {
              this.style.display = "none";
              errLabel.style.display = "block";
              failedCount++;
              if (failedCount >= urls.length) {
                container.innerHTML = '<div class="empty-state">Images unavailable.</div>';
              }
              return;
            }
            this.dataset.retried = String(parseInt(this.dataset.retried || "0") + 1);
            const tryPaths = ["data", "data-saver"];
            const nextPath = tryPaths[parseInt(this.dataset.retried) - 1];
            if (activeProvider === "mangadex" && url.includes("/data")) {
              this.src = url.replace("/data/", "/" + nextPath + "/");
            }
          };
          wrapper.appendChild(img);
          wrapper.appendChild(errLabel);
          container.appendChild(wrapper);
        });
        window.scrollTo({ top: 0, behavior: "instant" });
        updateNavButtons();
      }

      // ── Navigation ──
      $("prevChapter").addEventListener("click", () => goToChapter(currentChapterIdx - 1));
      $("nextChapter").addEventListener("click", () => goToChapter(currentChapterIdx + 1));
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
        if (e.key === "ArrowLeft") goToChapter(currentChapterIdx - 1);
        else if (e.key === "ArrowRight") goToChapter(currentChapterIdx + 1);
      });

      function esc(str) {
        if (!str) return "";
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
      }

      init();
    })();
  </script>
</body>
</html>
