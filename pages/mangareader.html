<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Read Manga - OtakuPier</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" href="../css/style.css?v=25">
  <link rel="preconnect" href="https://api.mangadex.org">
  <link rel="preconnect" href="https://api.jikan.moe">
  <link rel="preconnect" href="https://graphql.anilist.co">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://soukox.goatcounter.com">
<script data-goatcounter="https://soukox.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body class="reader-body">
  <nav class="navbar" id="navbar"></nav>

  <div class="reader-page">
    <div class="reader-top-bar">
      <a class="reader-back" href="javascript:history.back()">← Back</a>
      <button class="reader-sidebar-open-btn" id="sidebarOpenBtn" aria-label="Show chapters">☰</button>
      <div class="reader-chapter-nav">
        <button class="btn btn-outline btn-small" id="prevChapter" disabled>← Prev</button>
        <span class="reader-chapter-label" id="chapterLabel">Select a chapter</span>
        <button class="btn btn-outline btn-small" id="nextChapter" disabled>Next →</button>
      </div>
    </div>

    <div class="reader-content">
      <div class="reader-backdrop" id="readerBackdrop"></div>
      <aside class="reader-sidebar" id="readerSidebar">
        <div class="reader-sidebar-head">
          <h2 class="reader-manga-title" id="mangaTitle">Loading...</h2>
          <button class="reader-sidebar-close" id="sidebarClose" aria-label="Hide chapters">✕</button>
        </div>
        <div class="reader-chapter-list" id="chapterList">
          <div class="loading"><div class="spinner"></div>Finding chapters...</div>
        </div>
      </aside>

      <div class="reader-main">
        <div class="reader-pages" id="readerPages">
          <div class="reader-placeholder" id="readerPlaceholder">
            <div class="empty-state">
              <h3>📖 Manga Reader</h3>
              <p>Select a chapter from the sidebar to start reading.</p>
            </div>
          </div>
        </div>
        <footer id="siteFooter"></footer>
      </div>
    </div>
  </div>

  <h1 style="display:none;">Read Manga - OtakuPier</h1>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js?v=25"></script>
  <script src="../js/api.js?v=25"></script>
  <script src="../js/seo.js?v=25"></script>
  <script src="../js/app.js?v=25"></script>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const mangaTitle = params.get("title") || "Manga";
      const mangaId = params.get("id") || "";
      let mangadexId = null;
      let chapters = [];
      let currentChapterIdx = -1;
      let sidebarOpen = true;

      const API = "https://api.mangadex.org";

      const $ = (id) => document.getElementById(id);

      $("mangaTitle").textContent = mangaTitle;
      document.title = mangaTitle + " - Read Manga | OtakuPier";

      // ── Sidebar ──
      function updateSidebar() {
        $("readerSidebar").classList.toggle("hidden", !sidebarOpen);
        $("sidebarOpenBtn").style.display = sidebarOpen ? "none" : "inline-block";
        $("sidebarClose").style.display = sidebarOpen ? "inline-block" : "none";
        $("readerBackdrop").classList.toggle("show", sidebarOpen && window.innerWidth <= 768);
      }
      $("sidebarOpenBtn").onclick = () => { sidebarOpen = true; updateSidebar(); };
      $("sidebarClose").onclick = () => { sidebarOpen = false; updateSidebar(); };
      $("readerBackdrop").onclick = () => { sidebarOpen = false; updateSidebar(); };
      window.addEventListener("resize", updateSidebar);

      // ── MangaDex fetch with multiple proxy fallbacks ──
      const PROXIES = [
        "",
        "https://api.cors.lol/?url=",
        "https://api.allorigins.win/raw?url=",
      ];
      async function mdFetch(url) {
        for (const proxy of PROXIES) {
          try {
            const target = proxy ? proxy + encodeURIComponent(url) : url;
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), proxy ? 12000 : 8000);
            const res = await fetch(target, { signal: ctrl.signal });
            clearTimeout(timer);
            if (!res.ok) throw new Error("HTTP " + res.status);
            const data = await res.json();
            if (data && (data.result === "ok" || data.data || data.baseUrl)) return data;
            throw new Error("Invalid response");
          } catch (e) {
            continue;
          }
        }
        throw new Error("All MangaDex fetch attempts failed");
      }

      // ── Title matching ──
      function norm(s) {
        return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "").replace(/ou/g, "o");
      }

      function getDisplayTitle(attrs) {
        return attrs.title?.en || attrs.title?.["ja-ro"] || attrs.title?.romaji || "";
      }

      function scoreManga(m, targetTitle) {
        const attrs = m.attributes;
        const lower = targetTitle.toLowerCase().trim();
        const normLower = norm(lower);
        const allTitles = [attrs.title?.en, attrs.title?.["ja-ro"], attrs.title?.romaji, attrs.title?.native]
          .filter(Boolean);
        let score = 0;
        for (const t of allTitles) {
          const tn = t.toLowerCase();
          const nn = norm(t);
          if (tn === lower) score = Math.max(score, 200);
          else if (nn === normLower) score = Math.max(score, 190);
          else if (tn.startsWith(lower)) score = Math.max(score, 150);
          else if (nn.startsWith(normLower)) score = Math.max(score, 140);
          else if (tn.includes(lower)) score = Math.max(score, 50);
          else if (nn.includes(normLower)) score = Math.max(score, 40);
        }
        const name = getDisplayTitle(attrs).toLowerCase();
        if (/\b(colored|colour|full.color)\b/.test(name)) score -= 60;
        if (/\b(doujin|spin.?off|short story|prototype|one shot)\b/i.test(name)) score -= 100;
        return score;
      }

      // ── Check if manga has hosted English chapters ──
      async function hasHostedEnglishChapters(mangaId) {
        try {
          const data = await mdFetch(
            `${API}/manga/${mangaId}/feed?translatedLanguage%5B%5D=en&limit=50&order%5Bchapter%5D=desc`
          );
          return (data.data || []).some(ch =>
            ch.attributes && ch.attributes.chapter && !ch.attributes.externalUrl
          );
        } catch (e) {
          return false;
        }
      }

      // ── Step 1: Find manga ──
      async function init() {
        $("chapterList").innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';

        // If mangaId looks like a MangaDex UUID, try directly first
        if (mangaId && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(mangaId)) {
          try {
            const data = await mdFetch(`${API}/manga/${mangaId}`);
            if (data && data.data) {
              mangadexId = mangaId;
              $("mangaTitle").textContent = getDisplayTitle(data.data.attributes) || mangaTitle;
              await loadChapters();
              return;
            }
          } catch (e) { /* fall through */ }
        }

        // Strategy: Search MangaDex by title (best match wins)
        const titles = [
          mangaTitle,
          mangaTitle.replace(/[:\-!]/g, " ").replace(/\s+/g, " ").trim(),
          mangaTitle.replace(/\s*\(.*?\)\s*/g, "").trim(),
          mangaTitle.split(":")[0].trim(),
        ].filter(Boolean);

        for (const title of titles) {
          try {
            const data = await mdFetch(`${API}/manga?title=${encodeURIComponent(title)}&limit=10&includes[]=cover_art`);
            if (data.data && data.data.length) {
              const scored = data.data
                .map(m => ({ manga: m, score: scoreManga(m, mangaTitle) }))
                .filter(x => x.score > 0)
                .sort((a, b) => b.score - a.score);

              if (scored.length) {
                mangadexId = scored[0].manga.id;
                $("mangaTitle").textContent = getDisplayTitle(scored[0].manga.attributes) || mangaTitle;
                await loadChapters();
                return;
              }
            }
          } catch (e) { continue; }
        }

        $("chapterList").innerHTML = '<div class="empty-state">' +
          '<p>Manga not found on MangaDex.</p>' +
          '<p style="margin-top:8px;font-size:0.85em;"><a href="https://mangadex.org/search?q=' +
          encodeURIComponent(mangaTitle) + '" target="_blank" rel="noopener">Search MangaDex →</a></p></div>';
      }

      // ── Step 2: Load ALL chapters (hosted + external) ──
      async function loadChapters() {
        const list = $("chapterList");
        try {
          list.innerHTML = '<div class="loading"><div class="spinner"></div>Loading chapters...</div>';

          let data;
          try {
            data = await mdFetch(
              `${API}/manga/${mangadexId}/feed?translatedLanguage%5B%5D=en&limit=500&order%5Bchapter%5D=asc`
            );
          } catch (e) {
            data = { data: [], total: 0 };
          }
          const allChapters = data.data || [];

          // Dedup: keep BEST entry per chapter number (hosted preferred over external)
          const seen = new Map();
          allChapters.forEach(ch => {
            if (!ch.attributes || !ch.attributes.chapter) return;
            const key = normKey(ch.attributes.chapter);
            const existing = seen.get(key);
            if (!existing) { seen.set(key, ch); return; }
            // Prefer hosted over external, and more pages over fewer
            const existingExternal = !!existing.attributes.externalUrl;
            const chExternal = !!ch.attributes.externalUrl;
            if (existingExternal && !chExternal) { seen.set(key, ch); return; }
            if (existingExternal === chExternal) {
              const aPages = existing.attributes.pages || 0;
              const bPages = ch.attributes.pages || 0;
              if (bPages > aPages) seen.set(key, ch);
            }
          });

          chapters = Array.from(seen.values()).sort((a, b) => {
            const na = parseNum(a.attributes.chapter);
            const nb = parseNum(b.attributes.chapter);
            if (na !== nb) return na - nb;
            return (parseFloat(a.attributes.volume) || 0) - (parseFloat(b.attributes.volume) || 0);
          });

          if (!chapters.length) {
            list.innerHTML = '<div class="empty-state">' +
              '<p>No chapters found.</p>' +
              '<p style="margin-top:8px;font-size:0.85em;"><a href="https://mangadex.org/title/' +
              mangadexId + '" target="_blank" rel="noopener">View on MangaDex →</a></p></div>';
            return;
          }

          renderChapterList();
          goToChapter(0);
        } catch (e) {
          console.error("[Chapters]", e);
          list.innerHTML = '<div class="empty-state">Failed to load chapters.</div>';
        }
      }

      function parseNum(str) {
        const s = String(str).trim();
        const n = parseFloat(s);
        if (!isNaN(n)) return n;
        const m = s.match(/[\d.]+/);
        return m ? parseFloat(m[0]) : Infinity;
      }

      function normKey(str) {
        const n = parseNum(str);
        return n === Infinity ? String(str).trim().toLowerCase() : String(n);
      }

      function renderChapterList() {
        const list = $("chapterList");
        const hosted = chapters.filter(ch => !ch.attributes.externalUrl);
        const external = chapters.filter(ch => !!ch.attributes.externalUrl);
        let html = `<div class="chapter-list-header">${hosted.length} hosted · ${external.length} external</div>`;

        chapters.forEach((ch, i) => {
          const a = ch.attributes;
          const vol = a.volume ? ` Vol.${a.volume}` : "";
          const chTitle = a.title ? ` - ${a.title}` : "";
          const isExternal = !!a.externalUrl;
          const icon = isExternal ? "🔗 " : "";
          const cls = isExternal ? "chapter-item external-chapter" : "chapter-item";
          if (isExternal) {
            html += `<a class="${esc(cls)}" href="${esc(a.externalUrl)}" target="_blank" rel="noopener" data-idx="${i}">
              <span class="chapter-num">${icon}Ch. ${esc(a.chapter || "?")}${vol}</span>
              <span class="chapter-name">${esc(chTitle)}</span>
            </a>`;
          } else {
            html += `<button class="${esc(cls)}" data-idx="${i}">
              <span class="chapter-num">${icon}Ch. ${esc(a.chapter || "?")}${vol}</span>
              <span class="chapter-name">${esc(chTitle)}</span>
            </button>`;
          }
        });
        list.innerHTML = html;
        // Hosted chapters: click to load inline
        list.querySelectorAll(".chapter-item:not(.external-chapter)").forEach(btn => {
          btn.addEventListener("click", () => goToChapter(parseInt(btn.dataset.idx)));
        });
      }

      // ── Step 3: Navigate to chapter ──
      let chapterGen = 0;

      function goToChapter(idx) {
        if (idx < 0 || idx >= chapters.length) return;
        currentChapterIdx = idx;
        const gen = ++chapterGen;

        const ch = chapters[idx];

        // External chapter: open in new tab
        if (ch.attributes.externalUrl) {
          window.open(ch.attributes.externalUrl, "_blank", "noopener");
          return;
        }

        const vol = ch.attributes.volume ? ` Vol.${ch.attributes.volume}` : "";
        $("chapterLabel").textContent = "Ch. " + (ch.attributes.chapter || "?") + vol;

        $("chapterList").querySelectorAll(".chapter-item:not(.external-chapter)").forEach((el, i) => {
          el.classList.toggle("active", i === idx);
        });

        $("readerPlaceholder") && ($("readerPlaceholder").style.display = "none");
        $("readerPages").innerHTML = '<div class="reader-loading"><div class="spinner"></div><span>Loading...</span></div>';

        loadChapterImages(ch, gen);
      }

      function updateNavButtons() {
        $("prevChapter").disabled = currentChapterIdx <= 0;
        $("nextChapter").disabled = currentChapterIdx >= chapters.length - 1;
      }

      async function loadChapterImages(ch, gen) {
        const container = $("readerPages");
        try {
          const data = await mdFetch(`${API}/at-home/server/${ch.id}`);
          if (gen !== chapterGen) return;
          if (data && data.baseUrl && data.chapter) {
            const full = data.chapter.data || [];
            const saver = data.chapter.dataSaver || [];
            const pages = full.length ? full : saver;
            const basePath = full.length ? "data" : "data-saver";
            if (pages.length) {
              container.innerHTML = "";
              let failedCount = 0;
              pages.forEach((filename, pi) => {
                const wrapper = document.createElement("div");
                wrapper.className = "reader-page-wrapper";
                const img = document.createElement("img");
                img.className = "reader-page-img";
                img.src = `${data.baseUrl}/${basePath}/${data.chapter.hash}/${filename}`;
                img.alt = `Page ${pi + 1}`;
                img.loading = pi < 3 ? "eager" : "lazy";
                const errLabel = document.createElement("div");
                errLabel.className = "reader-page-error";
                errLabel.style.display = "none";
                errLabel.textContent = "Failed to load";
                img.onerror = function() {
                  if (this.dataset.retried === "2") {
                    this.style.display = "none";
                    errLabel.style.display = "block";
                    failedCount++;
                    if (failedCount >= pages.length) {
                      container.innerHTML = '<div class="empty-state">Images unavailable.</div>';
                    }
                    return;
                  }
                  this.dataset.retried = String(parseInt(this.dataset.retried || "0") + 1);
                  const tryPaths = ["data", "data-saver"];
                  const nextPath = tryPaths[parseInt(this.dataset.retried) - 1];
                  this.src = `${data.baseUrl}/${nextPath}/${data.chapter.hash}/${filename}`;
                };
                wrapper.appendChild(img);
                wrapper.appendChild(errLabel);
                container.appendChild(wrapper);
              });
              window.scrollTo({ top: 0, behavior: "instant" });
              updateNavButtons();
              return;
            }
          }
        } catch (e) {
          if (gen !== chapterGen) return;
        }
        if (gen !== chapterGen) return;
        container.innerHTML = '<div class="empty-state">Chapter not available.</div>';
        updateNavButtons();
      }

      // ── Navigation ──
      $("prevChapter").addEventListener("click", () => goToChapter(currentChapterIdx - 1));
      $("nextChapter").addEventListener("click", () => goToChapter(currentChapterIdx + 1));
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
        if (e.key === "ArrowLeft") goToChapter(currentChapterIdx - 1);
        else if (e.key === "ArrowRight") goToChapter(currentChapterIdx + 1);
      });

      function esc(str) {
        if (!str) return "";
        const d = document.createElement("div");
        d.textContent = str;
        return d.innerHTML;
      }

      init();
    })();
  </script>
</body>
</html>
