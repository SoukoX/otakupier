  <script>
    const params = new URLSearchParams(window.location.search);
    let catType = params.get("type") || "anime";
    let state = {
      q: params.get("q") || "",
      genre: "",
      page: 1,
    };

    // ── Anime / Manga toggle ──
    function switchCatType(type) {
      catType = type;
      document.querySelectorAll(".cat-type-btn").forEach(b => b.classList.toggle("active", b.dataset.type === type));
      state.page = 1;
      document.getElementById("searchBox").placeholder = type === "manga" ? "Search manga..." : "Search anime...";
      const animeHero = document.getElementById("catHero");
      const animeRows = document.getElementById("catRows");
      const mangaHero = document.getElementById("mangaHero");
      const mangaRows = document.getElementById("mangaRows");
      const animeRestore = document.getElementById("heroRestore");
      const mangaRestore = document.getElementById("mangaHeroRestore");
      if (type === "manga") {
        animeHero.style.display = "none";
        animeRows.style.display = "none";
        if (animeRestore) animeRestore.hidden = true;
        mangaHero.style.display = "";
        mangaRows.style.display = "";
        loadMangaHero();
        loadMangaRows();
      } else {
        animeHero.style.display = "";
        animeRows.style.display = "";
        mangaHero.style.display = "none";
        mangaRows.style.display = "none";
        if (mangaRestore) mangaRestore.hidden = true;
        loadHero();
        loadRows();
      }
      state.genre = "";
      loadGenres();
      loadCatalog();
      try {
        const newParams = new URLSearchParams(window.location.search);
        newParams.set("type", type);
        history.replaceState(null, "", window.location.pathname + "?" + newParams.toString());
      } catch (_) {}
    }

    function isFiltered() {
      return state.q || state.genre;
    }

    function goPage(delta) {
      state.page = Math.max(1, state.page + delta);
      loadCatalog();
      scrollToBrowse();
    }

    // Keep the user on the browse grid when paging — the hero and rows at the
    // top never change, so jumping there on every page change is just noise.
    function scrollToBrowse() {
      const el = document.querySelector(".catalog-body");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function clearFilters() {
      document.getElementById("searchBox").value = "";
      document.getElementById("genreSelect").value = "";
      state.q = "";
      state.genre = "";
      state.page = 1;
      showBrowse();
    }

    function applyFilters(p) {
      state.q = document.getElementById("searchBox").value.trim();
      state.genre = document.getElementById("genreSelect").value;
      state.page = p || 1;
      hideSuggest();
      if (catType === "anime") {
        document.getElementById("catHero").style.display = "none";
        document.getElementById("catRows").style.display = "none";
      } else {
        document.getElementById("mangaHero").style.display = "none";
        document.getElementById("mangaRows").style.display = "none";
      }
      loadCatalog();
      scrollToBrowse();
    }

    // ---------- Live typeahead suggestions ----------
    let suggestTimer = null;
    let suggestIndex = -1;

    function onSearchInput(v) {
      clearTimeout(suggestTimer);
      const q = v.trim();
      if (q.length < 2) { hideSuggest(); return; }
      suggestTimer = setTimeout(async () => {
        try {
          if (catType === "manga") {
            const items = await JIKAN.mangaSearch(q, 8);
            renderMangaSuggest(items, q);
          } else {
            const items = await JIKAN.suggest(q);
            renderSuggest(items, q);
          }
        } catch (e) { hideSuggest(); }
      }, 220);
    }

    function renderSuggest(items, q) {
      const box = document.getElementById("searchSuggest");
      if (!box) return;
      if (!items.length) { hideSuggest(); return; }
      box.innerHTML = items.map((a, i) => `
        <a class="suggest-item" data-i="${i}" href="${pageHref("anime")}?id=${a.mal_id}">
<img class="suggest-img" src="${JIKAN.esc(a.images?.jpg?.image_url || JIKAN.PLACEHOLDER)}"
                 alt="${JIKAN.esc(JIKAN.title(a))}" loading="lazy"
                 onerror="this.onerror=null;this.src=JIKAN.PLACEHOLDER">
          <span class="suggest-body">
            <span class="suggest-title">${JIKAN.esc(JIKAN.title(a))}</span>
            <span class="suggest-meta">${JIKAN.esc(a.type || "Anime")}${a.year ? " · " + a.year : ""}${a.status === "RELEASING" ? " · Airing" : ""}</span>
          </span>
          <span class="suggest-score">${a.score ? "★ " + a.score.toFixed(1) : ""}</span>
        </a>`).join("");
      box.hidden = false;
      suggestIndex = -1;
      box.querySelectorAll(".suggest-item").forEach((el, i) =>
        el.addEventListener("mousedown", (e) => {
          e.preventDefault();
          hideSuggest();
          window.location.href = el.getAttribute("href");
        }));
      box.classList.add("show");
    }

    function renderMangaSuggest(items, q) {
      const box = document.getElementById("searchSuggest");
      if (!box) return;
      if (!items.length) { hideSuggest(); return; }
      box.innerHTML = items.map((m, i) => {
        const href = pageHref("manga") + "?id=" + encodeURIComponent(m.id);
        const cover = m.cover || JIKAN.PLACEHOLDER;
        return `<a class="suggest-item" data-i="${i}" href="${href}">
<img class="suggest-img" src="${JIKAN.esc(cover)}"
                 alt="${JIKAN.esc(m.title)}" loading="lazy"
                 onerror="mangaImgError(this)">
          <span class="suggest-body">
            <span class="suggest-title">${JIKAN.esc(m.title)}</span>
            <span class="suggest-meta">${JIKAN.esc(m.status || "Manga")}${m.author ? " · " + JIKAN.esc(m.author) : ""}</span>
          </span>
          <span class="suggest-score">${m.genres && m.genres.length ? JIKAN.esc(typeof m.genres[0] === "string" ? m.genres[0] : m.genres[0].name || "") : ""}</span>
        </a>`;
      }).join("");
      box.hidden = false;
      suggestIndex = -1;
      box.querySelectorAll(".suggest-item").forEach((el) =>
        el.addEventListener("mousedown", (e) => {
          e.preventDefault();
          hideSuggest();
          window.location.href = el.getAttribute("href");
        }));
      box.classList.add("show");
    }

    function moveSuggest(dir) {
      const box = document.getElementById("searchSuggest");
      const items = box ? box.querySelectorAll(".suggest-item") : [];
      if (!items.length) return;
      suggestIndex = (suggestIndex + dir + items.length) % items.length;
      items.forEach((el, i) => el.classList.toggle("is-active", i === suggestIndex));
    }

    function hideSuggest() {
      const box = document.getElementById("searchSuggest");
      if (box) { box.hidden = true; box.classList.remove("show"); }
      suggestIndex = -1;
    }

    function onSearchKey(e) {
      const box = document.getElementById("searchSuggest");
      const open = box && !box.hidden && box.querySelectorAll(".suggest-item").length > 0;
      if (e.key === "Escape") { hideSuggest(); return; }
      if (open && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
        e.preventDefault();
        moveSuggest(e.key === "ArrowDown" ? 1 : -1);
        return;
      }
      if (e.key === "Enter") {
        if (open && suggestIndex >= 0) {
          e.preventDefault();
          const el = box.querySelectorAll(".suggest-item")[suggestIndex];
          if (el) { hideSuggest(); window.location.href = el.getAttribute("href"); return; }
        }
        hideSuggest();
        applyFilters(1);
      }
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-box")) hideSuggest();
    });

    // ---------- Default browse grid (rotating catalog) ----------
    async function loadCatalog() {
      const grid = document.getElementById("catalogGrid");
      grid.innerHTML = skeletonGrid(20);

      // ── Manga mode ──
      if (catType === "manga") {
        try {
          const q = state.q || "";
          const g = state.genre || "";
          let results;
          if (q) {
            const searchRes = await JIKAN.mangaSearch(q, 20);
            results = Array.isArray(searchRes) ? searchRes : (searchRes.data || []);
          } else if (g) {
            const genreRes = await JIKAN.mangaByGenre(g, state.page, 20);
            results = Array.isArray(genreRes) ? genreRes : (genreRes.data || []);
          } else {
            const popRes = await JIKAN.mangaPopular(state.page, 20);
            results = Array.isArray(popRes) ? popRes : (popRes.data || []);
          }
          grid.innerHTML = "";
          if (!results.length) {
            grid.innerHTML = q
              ? '<div class="empty-state">No manga found for this search.</div>'
              : '<div class="empty-state">Could not load manga catalog. <small>Try refreshing</small></div>';
            return;
          }
          results.forEach((m, i) => {
            const wrapper = document.createElement("div");
            wrapper.innerHTML = mangaCard(m);
            const el = wrapper.firstElementChild;
            if (el) {
              el.style.animationDelay = ((i % 24) * 40) + "ms";
              grid.appendChild(el);
            }
          });
          const rt = document.getElementById("resultsTitle");
          if (rt) rt.textContent = q ? 'Manga results for "' + q + '"' : g ? "Manga by genre" : "Popular manga";
          document.getElementById("pageInfo").textContent = "Page " + state.page;
          document.getElementById("prevBtn").style.visibility = state.page > 1 ? "visible" : "hidden";
          document.getElementById("nextBtn").style.visibility = results.length >= 20 ? "visible" : "hidden";
          } catch (err) {
          console.error("[Manga catalog]", err);
          grid.innerHTML = '<div class="empty-state">Could not load manga. ' + (err.message ? '(' + JIKAN.esc(err.message) + ')' : '') + '</div>';
        }
        return;
      }

      // ── Anime mode (original) ──
      try {
        const PER_PAGE = 4;
        const firstPage = (state.page - 1) * PER_PAGE + 1;
        const fetchers = [];
        for (let p = 0; p < PER_PAGE; p++) {
          if (state.q) {
            fetchers.push(JIKAN.smartSearch(state.q, firstPage + p, state.genre || ""));
          } else if (state.genre) {
            fetchers.push(JIKAN.byGenre(state.genre, firstPage + p));
          } else {
            fetchers.push(JIKAN.catalog(firstPage + p));
          }
        }
        const settled = await Promise.allSettled(fetchers);
        const results = settled
          .filter((s) => s.status === "fulfilled" && s.value && s.value.data)
          .map((s) => s.value);

        grid.innerHTML = "";
        await JIKAN.loadEdits();
        let count = 0;
        results.forEach((res) => {
          res.data.forEach((a) => {
            const el = JIKAN.card(a);
            el.style.animationDelay = ((count % 24) * 40) + "ms";
            grid.appendChild(el);
            count++;
          });
        });

        if (!count) {
          grid.innerHTML = results.length
            ? `<div class="empty-state">No anime found for this search. Try a different title or genre.</div>`
            : `<div class="empty-state">Couldn't reach the anime database right now (Jikan/MAL may be down). Try again in a moment.</div>`;
        }

        const metaRes = results[0] || settled.find((s) => s.status === "fulfilled")?.value;
        const total = metaRes?.pagination?.items?.total;
        const apiLast = metaRes?.pagination?.last_visible_page || state.page;
        const lastPage = Math.max(state.page, Math.ceil(apiLast / PER_PAGE));
        const rt = document.getElementById("resultsTitle");
        if (rt) {
          rt.textContent = state.q
            ? `Results for "${state.q}"`
            : state.genre
              ? "By genre"
              : "Browse the catalog";
        }
        document.getElementById("pageInfo").textContent =
          total ? `Page ${state.page} of ${lastPage} (${total.toLocaleString()} titles)` : `Page ${state.page} of ${lastPage}`;
        document.getElementById("prevBtn").style.visibility = state.page > 1 ? "visible" : "hidden";
        document.getElementById("nextBtn").style.visibility = state.page < lastPage ? "visible" : "hidden";
      } catch (err) {
        grid.innerHTML = `<div class="empty-state">Could not load anime. Please try again later.</div>`;
      }
    }

    function mangaImgError(el) {
      if (!el.dataset.retries) el.dataset.retries = "0";
      const retries = parseInt(el.dataset.retries);
      const src = el.src;
      if (retries === 0 && src.includes("mangadex.org/covers/")) {
        el.dataset.retries = "1";
        el.src = src.replace("/covers/", "/media/uploads/");
      } else if (retries <= 1 && src.includes("anilist.co")) {
        el.dataset.retries = String(retries + 1);
        el.src = src.replace("/large/", "/medium/");
      } else {
        el.onerror = null;
        el.src = JIKAN.PLACEHOLDER;
      }
    }

    function mangaCard(m) {
      const href = pageHref("manga") + "?id=" + encodeURIComponent(m.id);
      const cover = m.cover || JIKAN.PLACEHOLDER;
      const fmt = (m.format || "Manga").replace(/_/g, " ");
      const statusLabel = m.status === "RELEASING" ? "Ongoing"
        : m.status === "FINISHED" ? "Completed"
        : m.status === "NOT_YET_RELEASED" ? "Coming Soon"
        : m.status || "";
      const fmtClass = /manhwa/i.test(fmt) ? "fmt-manhwa" : /manhua/i.test(fmt) ? "fmt-manhua" : "fmt-manga";
      return '<a class="card stream-card manga-card" href="' + href + '">' +
        '<div class="card-poster"><img src="' + JIKAN.esc(cover) + '" alt="' + JIKAN.esc(m.title) + '" loading="lazy" onerror="mangaImgError(this)">' +
        '<span class="card-fmt-badge ' + fmtClass + '">' + JIKAN.esc(fmt) + '</span>' +
        (statusLabel ? '<span class="card-badge">' + JIKAN.esc(statusLabel) + '</span>' : '') +
        '</div>' +
        '<div class="card-body">' +
          '<div class="card-title">' + JIKAN.esc(m.title) + '</div>' +
          '<div class="card-meta-row">' +
            (m.genres && m.genres.length ? '<span class="card-genres">' + JIKAN.esc(typeof m.genres[0] === "string" ? m.genres[0] : m.genres[0].name || "") + '</span>' : '') +
            (m.chapters ? '<span class="card-chapters">' + m.chapters + ' ch</span>' : '') +
          '</div>' +
          (m.author ? '<div class="card-meta">' + JIKAN.esc(m.author) + '</div>' : '') +
        '</div>' +
      '</a>';
    }

    async function loadGenres() {
      const sel = document.getElementById("genreSelect");
      sel.innerHTML = '<option value="">All genres</option>';
      try {
        const genres = catType === "manga" ? JIKAN.mangaGenres() : await JIKAN.genres();
        genres.forEach((g) => {
          const opt = document.createElement("option");
          opt.value = g.mal_id;
          opt.textContent = g.name;
          sel.appendChild(opt);
        });
      } catch (err) {}
    }

    // ---------- Streaming rows + hero ----------
    function showBrowse() {
      if (catType === "anime") {
        document.getElementById("catHero").style.display = "";
        document.getElementById("catRows").style.display = "";
        loadHero();
        loadRows();
      } else {
        document.getElementById("mangaHero").style.display = "";
        document.getElementById("mangaRows").style.display = "";
        loadMangaHero();
        loadMangaRows();
      }
      loadCatalog();
      try { history.replaceState(null, "", "catalog?type=" + catType); } catch (_) {}
    }

    async function loadHero() {
      const track = document.getElementById("heroSlides");
      if (!track) return;
      try {
        const res = await JIKAN.airingNow(1);
        const list = (res.data || []).slice(0, 6);
        if (!list.length) { track.innerHTML = ""; return; }
        await JIKAN.loadEdits();
        track.innerHTML = list.map((a, i) => heroSlide(a, i === 0)).join("");
        initHero(list.length);
      } catch (e) { track.innerHTML = ""; }
    }

    function heroSlide(a, active) {
      const title = JIKAN.title(a);
      const img = a.images?.jpg?.image_url || "";
      const bgLayers = a.banner
        ? `url('${JIKAN.esc(a.banner)}'), url('${JIKAN.esc(img)}')`
        : `url('${JIKAN.esc(img)}')`;
      const genres = (a.genres || []).slice(0, 3).map((g) => `<span>${JIKAN.esc(g.name)}</span>`).join("");
      const next = a.nextAiringEpisode;
      let air = "";
      if (a.status === "RELEASING") {
        air = next
          ? ` · Next Ep ${next.episode} in ${JIKAN.esc(JIKAN.countdownLabel(next.airingAt))}`
          : "";
      }
      return `<div class="cat-hero-slide${active ? " active" : ""}" data-i="${a.mal_id}">
        <div class="cat-hero-bg" data-src="${JIKAN.esc(bgLayers)}"${active ? ` style="background-image:${bgLayers}"` : ""}></div>
        <div class="cat-hero-overlay"></div>
        <div class="cat-hero-content">
          <div class="cat-hero-cover"><img data-src="${JIKAN.esc(img)}"${active ? ` src="${JIKAN.esc(img)}"` : ` src="${JIKAN.PLACEHOLDER}"`} alt="${JIKAN.esc(title)}" onerror="this.onerror=null;this.src=JIKAN.PLACEHOLDER"></div>
          <div class="cat-hero-info">
            <span class="cat-hero-badge">Now Airing</span>
            <h2 class="cat-hero-title">${JIKAN.esc(title)}</h2>
            <div class="cat-hero-tags">${genres}${a.score ? `<span class="sc-badge-inline">★ ${a.score.toFixed(1)}</span>` : ""}</div>
            <div class="cat-hero-meta">${JIKAN.esc(a.type || "TV")}${air}</div>
            <div class="cat-hero-actions">
              <a class="btn btn-primary btn-glow" href="${pageHref("anime")}?id=${a.mal_id}">View Details</a>
              <a class="btn btn-outline" href="${pageHref("watch")}?id=${a.mal_id}">▶ Watch Now</a>
            </div>
          </div>
        </div>
      </div>`;
    }

    function initHero(n) {
      const track = document.getElementById("heroSlides");
      const dotsEl = document.getElementById("heroDots");
      let idx = 0, timer = null;
      dotsEl.innerHTML = Array.from({ length: n }, (_, i) =>
        `<button class="cat-hero-dot${i === 0 ? " active" : ""}" data-i="${i}" aria-label="Slide ${i + 1}"></button>`).join("");

      const show = (i) => {
        idx = (i + n) % n;
        track.querySelectorAll(".cat-hero-slide").forEach((s, k) => {
          const on = k === idx;
          s.classList.toggle("active", on);
          if (on) {
            // Hydrate the slide's backdrop + cover lazily on first activation
            // (only the initial slide ships with its media preloaded).
            const bg = s.querySelector(".cat-hero-bg");
            if (bg && bg.dataset.src && !bg.style.backgroundImage) bg.style.backgroundImage = bg.dataset.src;
            const img = s.querySelector("img");
            if (img && img.dataset.src && img.src !== img.dataset.src) img.src = img.dataset.src;
          }
        });
        dotsEl.querySelectorAll(".cat-hero-dot").forEach((d, k) => d.classList.toggle("active", k === idx));
      };

      const start = () => { clearInterval(timer); if (!document.hidden && !collapsed) timer = setInterval(() => show(idx + 1), 5000); };
      const stop = () => clearInterval(timer);

      const hero = document.getElementById("catHero");
      const collapseBtn = document.getElementById("heroCollapse");
      const restoreBtn = document.getElementById("heroRestore");
      let collapsed = localStorage.getItem("otk.catHeroCollapsed") === "1";
      const applyCollapsed = () => {
        hero.classList.toggle("collapsed", collapsed);
        restoreBtn.hidden = !collapsed;
        if (collapsed) {
          hero.style.height = "0px";
          hero.style.minHeight = "0px";
          stop();
        } else {
          hero.style.height = "";
          hero.style.minHeight = "";
          start();
        }
      };
      collapseBtn.addEventListener("click", () => {
        collapsed = true;
        localStorage.setItem("otk.catHeroCollapsed", "1");
        applyCollapsed();
      });
      restoreBtn.addEventListener("click", () => {
        collapsed = false;
        localStorage.setItem("otk.catHeroCollapsed", "0");
        applyCollapsed();
      });
      applyCollapsed();

      document.getElementById("heroPrev").addEventListener("click", () => { show(idx - 1); start(); });
      document.getElementById("heroNext").addEventListener("click", () => { show(idx + 1); start(); });
      dotsEl.addEventListener("click", (e) => {
        const b = e.target.closest(".cat-hero-dot");
        if (b) { show(Number(b.dataset.i)); start(); }
      });
      hero.addEventListener("mouseenter", stop);
      hero.addEventListener("mouseleave", start);
      document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); else start(); });
      let tx = null;
      hero.addEventListener("touchstart", (e) => { tx = e.changedTouches[0].clientX; stop(); }, { passive: true });
      hero.addEventListener("touchend", (e) => {
        if (tx === null) return;
        const dx = e.changedTouches[0].clientX - tx;
        tx = null;
        if (Math.abs(dx) > 40) { show(idx + (dx < 0 ? 1 : -1)); start(); }
      }, { passive: true });
      start();
    }

    async function loadRows() {
      const loadRow = (id, fetcher) => {
        const row = document.getElementById(id);
        if (!row) return;
        fetcher(1).then((res) => {
          row.innerHTML = "";
          (res?.data || []).slice(0, 20).forEach((a) => row.appendChild(JIKAN.streamCard(a)));
          row.dispatchEvent(new Event("scroll"));
        }).catch(() => { row.innerHTML = `<div class="empty-state">Could not load.</div>`; });
      };
      loadRow("rowTrending", () => JIKAN.aniBrowse({ sort: ["TRENDING_DESC"] }));
      loadRow("rowUpdated", () => JIKAN.aniBrowse({ sort: ["UPDATED_AT_DESC"] }));
      loadRow("rowPopular", () => JIKAN.aniBrowse({ sort: ["POPULARITY_DESC"] }));
    }

    // ── Manga hero + rows ──
    async function loadMangaHero() {
      const track = document.getElementById("mangaHeroSlides");
      if (!track) return;
      try {
        const res = await JIKAN.mangaTrending(1);
        const newList = (res.data || []).slice(0, 6);
        if (!newList.length) { track.innerHTML = ""; return; }

        // Compare with cached hero entries — only update if new entries are genuinely better
        let cached = [];
        try { cached = JSON.parse(localStorage.getItem("otk.mangaHero") || "[]"); } catch(e) {}

        const merged = mergeHeroEntries(cached, newList);
        try { localStorage.setItem("otk.mangaHero", JSON.stringify(merged)); } catch(e) {}

        track.innerHTML = merged.map((m, i) => mangaHeroSlide(m, i === 0)).join("");
        initMangaHero(merged.length);
      } catch (e) { track.innerHTML = ""; }
    }

    // Merge cached hero entries with new trending: keep existing unless new entry is better
    function mergeHeroEntries(cached, newList) {
      if (!cached.length) return newList;
      const merged = [...cached];
      for (const newItem of newList) {
        const existingIdx = merged.findIndex(e => e.id === newItem.id);
        if (existingIdx >= 0) {
          // Already in hero — update with fresh data
          merged[existingIdx] = newItem;
        } else if (merged.length < 6) {
          // Slot available — add new entry
          merged.push(newItem);
        } else {
          // Full — find lowest-scored entry and replace if new is better
          const worstIdx = merged.reduce((worst, m, i) => {
            const score = (m.chapters || 0) + (m.score || 0) * 10;
            const worstScore = (merged[worst].chapters || 0) + (merged[worst].score || 0) * 10;
            return score < worstScore ? i : worst;
          }, 0);
          const newScore = (newItem.chapters || 0) + (newItem.score || 0) * 10;
          const worstScore = (merged[worstIdx].chapters || 0) + (merged[worstIdx].score || 0) * 10;
          if (newScore > worstScore) {
            merged[worstIdx] = newItem;
          }
        }
      }
      return merged.slice(0, 6);
    }

    function mangaHeroSlide(m, active) {
      const img = m.cover || JIKAN.PLACEHOLDER;
      const bgLayers = `url('${JIKAN.esc(img)}')`;
      const genres = (m.genres || []).slice(0, 3).map((g) => {
        const name = typeof g === "string" ? g : (g.name || "");
        return `<span>${JIKAN.esc(name)}</span>`;
      }).join("");
      let status = "";
      if (m.status === "RELEASING") status = m.chapters ? `${m.chapters}+ ch` : "Ongoing";
      else if (m.status === "FINISHED") status = m.chapters ? `${m.chapters} ch` : "Completed";
      return `<div class="cat-hero-slide${active ? " active" : ""}" data-i="${m.id}">
        <div class="cat-hero-bg" data-src="${JIKAN.esc(bgLayers)}"${active ? ` style="background-image:${bgLayers}"` : ""}></div>
        <div class="cat-hero-overlay"></div>
        <div class="cat-hero-content">
          <div class="cat-hero-cover"><img data-src="${JIKAN.esc(img)}"${active ? ` src="${JIKAN.esc(img)}"` : ` src="${JIKAN.PLACEHOLDER}"`} alt="${JIKAN.esc(m.title)}" onerror="this.onerror=null;this.src=JIKAN.PLACEHOLDER"></div>
          <div class="cat-hero-info">
            <span class="cat-hero-badge">Manga</span>
            <h2 class="cat-hero-title">${JIKAN.esc(m.title)}</h2>
            <div class="cat-hero-tags">${genres}</div>
            <div class="cat-hero-meta">${JIKAN.esc(status || m.format || "Manga")}</div>
            <div class="cat-hero-actions">
              <a class="btn btn-primary btn-glow" href="${pageHref("manga")}?id=${m.id}">View Details</a>
              <a class="btn btn-outline" href="${pageHref("mangareader")}?id=${m.id}&title=${encodeURIComponent(m.title)}">📖 Read Now</a>
            </div>
          </div>
        </div>
      </div>`;
    }

    function initMangaHero(n) {

      dotsEl.innerHTML = Array.from({ length: n }, (_, i) =>

      const show = (i) => {

      const collapseBtn = document.getElementById("mangaHeroCollapse");

      const applyCollapsed = () => {

        } else {

        }
      };
      collapseBtn.addEventListener("click", () => {
        collapsed = true;
        localStorage.setItem("otk.mangaHeroCollapsed", "1");
        applyCollapsed();
      });
      restoreBtn.addEventListener("click", () => {
        collapsed = false;
        localStorage.setItem("otk.mangaHeroCollapsed", "0");
        applyCollapsed();

      applyCollapsed();

      document.getElementById("mangaHeroPrev").addEventListener("click", () => { show(idx - 1); start(); });
      document.getElementById("mangaHeroNext").addEventListener("click", () => { show(idx + 1); start(); });
      dotsEl.addEventListener("click", (e) => {
        const b = e.target.closest(".cat-hero-dot");
        if (b) { show(Number(b.dataset.i)); start(); }
      });
      hero.addEventListener("mouseenter", stop);
      hero.addEventListener("mouseleave", start);
      document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); else start(); });
      let tx = null;
      hero.addEventListener("touchstart", (e) => { tx = e.changedTouches[0].clientX; stop(); }, { passive: true });
      hero.addEventListener("touchend", (e) => {
        if (tx === null) return;
        const dx = e.changedTouches[0].clientX - tx;
        tx = null;
        if (Math.abs(dx) > 40) { show(idx + (dx < 0 ? 1 : -1)); start(); }
      }, { passive: true });
      start();
    }

    async function loadMangaRows() {
      const loadMangaRow = (id, fetcher) => {
        const row = document.getElementById(id);
        if (!row) return;
        fetcher(1).then((res) => {
          row.innerHTML = "";
          const list = Array.isArray(res) ? res : (res?.data || []);
          list.slice(0, 20).forEach((m) => row.appendChild(JIKAN.mangaStreamCard(m)));
          row.dispatchEvent(new Event("scroll"));
        }).catch(() => { row.innerHTML = `<div class="empty-state">Could not load.</div>`; });
      };
      loadMangaRow("mangaRowTrending", () => JIKAN.mangaTrending(1));
      loadMangaRow("mangaRowNew", () => JIKAN.mangaNewReleases(1));
      loadMangaRow("mangaRowRated", () => JIKAN.mangaTopRated(1));
    }

    function setupScrollRow(el) {
      if (!el || el.dataset.scwired) return;
      el.dataset.scwired = "1";
      const wrap = el.closest(".sc-row-wrap");
      if (!wrap) return;
      const prev = wrap.querySelector(".sc-row-btn.prev");
      const next = wrap.querySelector(".sc-row-btn.next");
      const updateEdges = () => {
        const max = el.scrollWidth - el.clientWidth;
        const atStart = el.scrollLeft <= 2;
        const atEnd = el.scrollLeft >= max - 2;
        if (prev) prev.classList.toggle("off", atStart);
        if (next) next.classList.toggle("off", atEnd);
        wrap.classList.toggle("show-fade-l", !atStart);
        wrap.classList.toggle("show-fade-r", !atEnd);
      };
      el.addEventListener("scroll", updateEdges, { passive: true });
      // Native smooth scroll landing exactly on a card boundary. Using the
      // browser's own smooth scroll (plus proximity snap) behaves identically
      // in Chrome and Firefox — Chrome's mandatory snap otherwise re-snaps mid
      // animation, which is what made the buttons appear to not work there.
      const snapStep = () => {
        const gap = parseFloat(getComputedStyle(el).gap) || 0;
        const w = (el.firstElementChild ? el.firstElementChild.offsetWidth : 0) + gap;
        return Math.max(w, 320);
      };
      let settleTimer = null;
      const animateTo = (dir) => {
        const w = snapStep();
        const max = el.scrollWidth - el.clientWidth;
        const cur = el.scrollLeft;
        // Advance roughly one visible page per click, landing exactly on a card
        // boundary so the end position is identical in Chrome and Firefox.
        const cards = Math.max(1, Math.round((el.clientWidth * 0.8) / w));
        const n = dir > 0 ? Math.floor(cur / w) + cards : Math.ceil(cur / w) - cards;
        const target = Math.max(0, Math.min(n * w, max));
        if (Math.abs(target - cur) < 2) return;
        // Disable snap while the native smooth scroll runs — Chrome otherwise
        // re-snaps mid-animation and the row stops short of the target.
        clearTimeout(settleTimer);
        el.classList.add("no-snap");
        el.scrollTo({ left: target, behavior: "smooth" });
        const settle = () => {
          if (Math.abs(el.scrollLeft - target) >= 4) { settleTimer = setTimeout(settle, 120); return; }
          el.classList.remove("no-snap");
        };
        settleTimer = setTimeout(settle, 250);
      };
      if (prev) prev.addEventListener("click", () => animateTo(-1));
      if (next) next.addEventListener("click", () => animateTo(1));
updateEdges();
    }

    document.addEventListener("DOMContentLoaded", () => {
      // Initialize toggle state from URL
      if (catType === "manga") {
        document.querySelectorAll(".cat-type-btn").forEach(b => b.classList.toggle("active", b.dataset.type === "manga"));
        document.getElementById("catHero").style.display = "none";
        document.getElementById("catRows").style.display = "none";
        document.getElementById("mangaHero").style.display = "";
        document.getElementById("mangaRows").style.display = "";
        document.getElementById("heroRestore").hidden = true;
      }
      if (state.q) {
        document.getElementById("searchBox").value = state.q;
        document.getElementById("catHero").style.display = "none";
        document.getElementById("catRows").style.display = "none";
        document.getElementById("mangaHero").style.display = "none";
        document.getElementById("mangaRows").style.display = "none";
      }
      loadGenres();
      showBrowse();
      document.querySelectorAll(".scroll-row").forEach(setupScrollRow);
    });
  </script>
