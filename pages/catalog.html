<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Catalog & Search - OtakuPier</title>
  <meta name="robots" content="index, follow">
  <meta name="description" content="Search and browse the anime catalog on OtakuPier. Filter by genre, popularity and score.">
  <link rel="canonical" href="https://otakupier.2bd.net/pages/catalog.html">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="preconnect" href="https://api.jikan.moe">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="catalog-page">
    <header class="catalog-hero">
      <div class="catalog-hero-inner">
        <p class="catalog-kicker">The full pier</p>
        <h1>Anime Catalog</h1>
        <p class="catalog-sub">Search thousands of titles, filter by genre, and find watch links for everything you love.</p>
        <div class="catalog-searchbar">
          <input type="text" id="searchBox" placeholder="Search anime..." onkeydown="if(event.key==='Enter')applyFilters(1)">
          <select id="genreSelect" onchange="applyFilters(1)">
            <option value="">All genres</option>
          </select>
          <button class="btn btn-primary" onclick="applyFilters(1)">Search</button>
          <button class="btn btn-outline" onclick="clearFilters()">Clear</button>
        </div>
      </div>
    </header>

    <div class="catalog-body">
      <div class="catalog-results-head">
        <h2 id="resultsTitle">Latest titles</h2>
      </div>
      <div class="grid catalog-grid" id="catalogGrid"></div>

      <div class="pagination">
        <button class="btn btn-outline btn-small" id="prevBtn" onclick="goPage(-1)">&larr; Prev</button>
        <span class="page-info" id="pageInfo"></span>
        <button class="btn btn-outline btn-small" id="nextBtn" onclick="goPage(1)">Next &rarr;</button>
      </div>
    </div>
  </main>

  <footer id="siteFooter"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    let state = {
      q: params.get("q") || "",
      genre: "",
      page: 1,
    };

    function goPage(delta) {
      state.page = Math.max(1, state.page + delta);
      loadCatalog();
    }

    function clearFilters() {
      document.getElementById("searchBox").value = "";
      document.getElementById("genreSelect").value = "";
      state.q = "";
      state.genre = "";
      state.page = 1;
      loadCatalog();
      history.replaceState(null, "", "catalog");
    }

    function applyFilters(p) {
      state.q = document.getElementById("searchBox").value.trim();
      state.genre = document.getElementById("genreSelect").value;
      state.page = p || 1;
      loadCatalog();
    }

    async function loadCatalog() {
      const grid = document.getElementById("catalogGrid");
      grid.innerHTML = skeletonGrid(20);

      try {
        // Show ~100 anime per page by fetching a few API pages (25 each),
        // so the catalog feels as full as the home page. Pages are fetched
        // in parallel and failures are tolerated — if Jikan drops one page,
        // we still show whatever loaded instead of killing the whole grid.
        const PER_PAGE = 4;
        const firstPage = (state.page - 1) * PER_PAGE + 1;
        const fetchers = [];
        for (let p = 0; p < PER_PAGE; p++) {
          if (state.q) {
            fetchers.push(JIKAN.search(state.q, firstPage + p));
          } else if (state.genre) {
            fetchers.push(JIKAN.byGenre(state.genre, firstPage + p));
          } else {
            fetchers.push(JIKAN.catalog(firstPage + p));
          }
        }
        const settled = await Promise.allSettled(fetchers);
        const results = settled
          .filter((s) => s.status === "fulfilled" && s.value && s.value.data)
          .map((s) => s.value);

        grid.innerHTML = "";
        await JIKAN.loadEdits();
        let count = 0;
        results.forEach((res) => {
          res.data.forEach((a) => {
            grid.appendChild(JIKAN.card(a));
            count++;
          });
        });

        if (!count) {
          grid.innerHTML = `<div class="empty-state">No anime found. Try a different search.</div>`;
        }

        // Use the first successful response for pagination metadata
        const metaRes = results[0] || settled.find((s) => s.status === "fulfilled")?.value;
        const total = metaRes?.pagination?.items?.total;
        const apiLast = metaRes?.pagination?.last_visible_page || state.page;
        const lastPage = Math.max(state.page, Math.ceil(apiLast / PER_PAGE));
        const rt = document.getElementById("resultsTitle");
        if (rt) {
          rt.textContent = state.q
            ? `Results for "${state.q}"`
            : state.genre
              ? "By genre"
              : "Latest titles";
        }
        document.getElementById("pageInfo").textContent =
          total ? `Page ${state.page} of ${lastPage} (${total.toLocaleString()} titles)` : `Page ${state.page} of ${lastPage}`;
        document.getElementById("prevBtn").style.visibility = state.page > 1 ? "visible" : "hidden";
        document.getElementById("nextBtn").style.visibility = state.page < lastPage ? "visible" : "hidden";
      } catch (err) {
        grid.innerHTML = `<div class="empty-state">Could not load anime. Please try again later.</div>`;
      }
    }

    async function loadGenres() {
      const sel = document.getElementById("genreSelect");
      try {
        const genres = await JIKAN.genres();
        genres.forEach((g) => {
          const opt = document.createElement("option");
          opt.value = g.mal_id;
          opt.textContent = g.name;
          sel.appendChild(opt);
        });
      } catch (err) {
        // genre list failed; filtering by genre just won't be available
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (state.q) document.getElementById("searchBox").value = state.q;
      loadGenres();
      loadCatalog();
    });
  </script>
</body>
</html>
