<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="msvalidate.01" content="4F55345C289F9597335C55566F2B31F9" />

  <title>Browse Anime - OtakuPier</title>
  <meta name="robots" content="index, follow">
  <meta name="description" content="Browse and search the anime catalog on OtakuPier. See what's airing now, trending, and most popular — filter by genre and watch anywhere.">
  <link rel="canonical" href="https://otakupier.2bd.net/pages/catalog.html">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="preconnect" href="https://api.jikan.moe">
  <link rel="preconnect" href="https://graphql.anilist.co">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="../css/style.css?v=15">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="catalog-page">
    <!-- Sticky search bar -->
    <div class="cat-searchbar">
      <div class="search-box">
        <input type="text" id="searchBox" placeholder="Search anime..." autocomplete="off"
               oninput="onSearchInput(this.value)" onkeydown="onSearchKey(event)">
        <div class="search-suggest" id="searchSuggest" hidden></div>
      </div>
      <select id="genreSelect" onchange="applyFilters(1)" aria-label="Filter by genre">
        <option value="">All genres</option>
      </select>
      <button class="btn btn-primary" id="searchBtn" onclick="applyFilters(1)">Search</button>
      <button class="btn btn-outline" onclick="clearFilters()">Clear</button>
    </div>

    <!-- Now Airing hero slideshow (streaming-style spotlight) -->
    <section class="cat-hero" id="catHero" aria-label="Now airing">
      <div class="cat-hero-track" id="heroSlides"></div>
      <button class="cat-hero-arrow prev" id="heroPrev" aria-label="Previous slide">&lsaquo;</button>
      <button class="cat-hero-arrow next" id="heroNext" aria-label="Next slide">&rsaquo;</button>
      <div class="cat-hero-dots" id="heroDots"></div>
      <button class="cat-hero-collapse" id="heroCollapse" aria-label="Hide highlights" title="Hide highlights">&ndash;</button>
    </section>
    <button class="cat-hero-restore" id="heroRestore" hidden>Show highlights</button>

    <!-- Streaming-style rows (shown in default browse state) -->
    <section class="cat-rows" id="catRows">
      <div class="row-section">
        <div class="row-head">
          <h2>Trending Now</h2>
        </div>
        <div class="sc-row-wrap">
          <button class="sc-row-btn prev" aria-label="Scroll left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="sc-row-btn next" aria-label="Scroll right"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
          <div class="scroll-row" id="rowTrending"><div class="skeleton-row"></div></div>
        </div>
      </div>

      <div class="row-section">
        <div class="row-head">
          <h2>Recently Updated</h2>
        </div>
        <div class="sc-row-wrap">
          <button class="sc-row-btn prev" aria-label="Scroll left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="sc-row-btn next" aria-label="Scroll right"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
          <div class="scroll-row" id="rowUpdated"><div class="skeleton-row"></div></div>
        </div>
      </div>

      <div class="row-section">
        <div class="row-head">
          <h2>All Time Popular</h2>
        </div>
        <div class="grid catalog-grid" id="rowPopular"><div class="skeleton-row"></div></div>
      </div>
    </section>

    <!-- Full browse / search grid with pagination -->
    <div class="catalog-body">
      <div class="catalog-results-head">
        <h2 id="resultsTitle">Browse the catalog</h2>
      </div>
      <div class="grid catalog-grid" id="catalogGrid"></div>

      <div class="pagination">
        <button class="btn btn-outline btn-small" id="prevBtn" onclick="goPage(-1)">&larr; Prev</button>
        <span class="page-info" id="pageInfo"></span>
        <button class="btn btn-outline btn-small" id="nextBtn" onclick="goPage(1)">Next &rarr;</button>
      </div>
    </div>
  </main>

  <footer id="siteFooter"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js?v=15"></script>
  <script src="../js/api.js?v=15"></script>
  <script src="../js/app.js?v=15"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    let state = {
      q: params.get("q") || "",
      genre: "",
      page: 1,
    };

    function isFiltered() {
      return state.q || state.genre;
    }

    function goPage(delta) {
      state.page = Math.max(1, state.page + delta);
      loadCatalog();
      scrollToBrowse();
    }

    // Keep the user on the browse grid when paging — the hero and rows at the
    // top never change, so jumping there on every page change is just noise.
    function scrollToBrowse() {
      const el = document.querySelector(".catalog-body");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function clearFilters() {
      document.getElementById("searchBox").value = "";
      document.getElementById("genreSelect").value = "";
      state.q = "";
      state.genre = "";
      state.page = 1;
      showBrowse();
      history.replaceState(null, "", "catalog");
    }

    function applyFilters(p) {
      state.q = document.getElementById("searchBox").value.trim();
      state.genre = document.getElementById("genreSelect").value;
      state.page = p || 1;
      hideSuggest();
      document.getElementById("catHero").style.display = "none";
      document.getElementById("catRows").style.display = "none";
      loadCatalog();
      scrollToBrowse();
    }

    // ---------- Live typeahead suggestions ----------
    let suggestTimer = null;
    let suggestIndex = -1;

    function onSearchInput(v) {
      clearTimeout(suggestTimer);
      const q = v.trim();
      if (q.length < 2) { hideSuggest(); return; }
      suggestTimer = setTimeout(async () => {
        try {
          const items = await JIKAN.suggest(q);
          renderSuggest(items, q);
        } catch (e) { hideSuggest(); }
      }, 220);
    }

    function renderSuggest(items, q) {
      const box = document.getElementById("searchSuggest");
      if (!box) return;
      if (!items.length) { hideSuggest(); return; }
      box.innerHTML = items.map((a, i) => `
        <a class="suggest-item" data-i="${i}" href="${pageHref("anime")}?id=${a.mal_id}">
          <img class="suggest-img" src="${JIKAN.esc(a.images?.jpg?.image_url || JIKAN.PLACEHOLDER)}"
               alt="" loading="lazy"
               onerror="this.onerror=null;this.src=JIKAN.PLACEHOLDER">
          <span class="suggest-body">
            <span class="suggest-title">${JIKAN.esc(JIKAN.title(a))}</span>
            <span class="suggest-meta">${JIKAN.esc(a.type || "Anime")}${a.year ? " · " + a.year : ""}${a.status === "RELEASING" ? " · Airing" : ""}</span>
          </span>
          <span class="suggest-score">${a.score ? "★ " + a.score.toFixed(1) : ""}</span>
        </a>`).join("");
      box.hidden = false;
      suggestIndex = -1;
      box.querySelectorAll(".suggest-item").forEach((el, i) =>
        el.addEventListener("mousedown", (e) => {
          e.preventDefault();
          hideSuggest();
          window.location.href = el.getAttribute("href");
        }));
      box.classList.add("show");
    }

    function moveSuggest(dir) {
      const box = document.getElementById("searchSuggest");
      const items = box ? box.querySelectorAll(".suggest-item") : [];
      if (!items.length) return;
      suggestIndex = (suggestIndex + dir + items.length) % items.length;
      items.forEach((el, i) => el.classList.toggle("is-active", i === suggestIndex));
    }

    function hideSuggest() {
      const box = document.getElementById("searchSuggest");
      if (box) { box.hidden = true; box.classList.remove("show"); }
      suggestIndex = -1;
    }

    function onSearchKey(e) {
      const box = document.getElementById("searchSuggest");
      const open = box && !box.hidden && box.querySelectorAll(".suggest-item").length > 0;
      if (e.key === "Escape") { hideSuggest(); return; }
      if (open && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
        e.preventDefault();
        moveSuggest(e.key === "ArrowDown" ? 1 : -1);
        return;
      }
      if (e.key === "Enter") {
        if (open && suggestIndex >= 0) {
          e.preventDefault();
          const el = box.querySelectorAll(".suggest-item")[suggestIndex];
          if (el) { hideSuggest(); window.location.href = el.getAttribute("href"); return; }
        }
        hideSuggest();
        applyFilters(1);
      }
    }

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-box")) hideSuggest();
    });

    // ---------- Default browse grid (rotating catalog) ----------
    async function loadCatalog() {
      const grid = document.getElementById("catalogGrid");
      grid.innerHTML = skeletonGrid(20);

      try {
        const PER_PAGE = 4;
        const firstPage = (state.page - 1) * PER_PAGE + 1;
        const fetchers = [];
        for (let p = 0; p < PER_PAGE; p++) {
          if (state.q) {
            fetchers.push(JIKAN.smartSearch(state.q, firstPage + p, state.genre || ""));
          } else if (state.genre) {
            fetchers.push(JIKAN.byGenre(state.genre, firstPage + p));
          } else {
            fetchers.push(JIKAN.catalog(firstPage + p));
          }
        }
        const settled = await Promise.allSettled(fetchers);
        const results = settled
          .filter((s) => s.status === "fulfilled" && s.value && s.value.data)
          .map((s) => s.value);

        grid.innerHTML = "";
        await JIKAN.loadEdits();
        let count = 0;
        results.forEach((res) => {
          res.data.forEach((a) => {
            const el = JIKAN.card(a);
            el.style.animationDelay = ((count % 24) * 40) + "ms";
            grid.appendChild(el);
            count++;
          });
        });

        if (!count) {
          grid.innerHTML = results.length
            ? `<div class="empty-state">No anime found for this search. Try a different title or genre.</div>`
            : `<div class="empty-state">Couldn't reach the anime database right now (Jikan/MAL may be down). Try again in a moment.</div>`;
        }

        const metaRes = results[0] || settled.find((s) => s.status === "fulfilled")?.value;
        const total = metaRes?.pagination?.items?.total;
        const apiLast = metaRes?.pagination?.last_visible_page || state.page;
        const lastPage = Math.max(state.page, Math.ceil(apiLast / PER_PAGE));
        const rt = document.getElementById("resultsTitle");
        if (rt) {
          rt.textContent = state.q
            ? `Results for "${state.q}"`
            : state.genre
              ? "By genre"
              : "Browse the catalog";
        }
        document.getElementById("pageInfo").textContent =
          total ? `Page ${state.page} of ${lastPage} (${total.toLocaleString()} titles)` : `Page ${state.page} of ${lastPage}`;
        document.getElementById("prevBtn").style.visibility = state.page > 1 ? "visible" : "hidden";
        document.getElementById("nextBtn").style.visibility = state.page < lastPage ? "visible" : "hidden";
      } catch (err) {
        grid.innerHTML = `<div class="empty-state">Could not load anime. Please try again later.</div>`;
      }
    }

    async function loadGenres() {
      const sel = document.getElementById("genreSelect");
      try {
        const genres = await JIKAN.genres();
        genres.forEach((g) => {
          const opt = document.createElement("option");
          opt.value = g.mal_id;
          opt.textContent = g.name;
          sel.appendChild(opt);
        });
      } catch (err) {}
    }

    // ---------- Streaming rows + hero ----------
    function showBrowse() {
      document.getElementById("catHero").style.display = "";
      document.getElementById("catRows").style.display = "";
      loadHero();
      loadRows();
      loadCatalog();
      history.replaceState(null, "", "catalog");
    }

    async function loadHero() {
      const track = document.getElementById("heroSlides");
      if (!track) return;
      try {
        const res = await JIKAN.airingNow(1);
        const list = (res.data || []).slice(0, 6);
        if (!list.length) { track.innerHTML = ""; return; }
        await JIKAN.loadEdits();
        track.innerHTML = list.map((a, i) => heroSlide(a, i === 0)).join("");
        initHero(list.length);
      } catch (e) { track.innerHTML = ""; }
    }

    function heroSlide(a, active) {
      const title = JIKAN.title(a);
      const img = a.images?.jpg?.image_url || "";
      const bgLayers = a.banner
        ? `url('${JIKAN.esc(a.banner)}'), url('${JIKAN.esc(img)}')`
        : `url('${JIKAN.esc(img)}')`;
      const genres = (a.genres || []).slice(0, 3).map((g) => `<span>${JIKAN.esc(g.name)}</span>`).join("");
      const next = a.nextAiringEpisode;
      let air = "";
      if (a.status === "RELEASING") {
        air = next
          ? ` · Next Ep ${next.episode} in ${JIKAN.esc(JIKAN.countdownLabel(next.airingAt))}`
          : "";
      }
      return `<div class="cat-hero-slide${active ? " active" : ""}" data-i="${a.mal_id}">
        <div class="cat-hero-bg" data-src="${JIKAN.esc(bgLayers)}"${active ? ` style="background-image:${bgLayers}"` : ""}></div>
        <div class="cat-hero-overlay"></div>
        <div class="cat-hero-content">
          <div class="cat-hero-cover"><img data-src="${JIKAN.esc(img)}"${active ? ` src="${JIKAN.esc(img)}"` : ` src="${JIKAN.PLACEHOLDER}"`} alt="${JIKAN.esc(title)}" onerror="this.onerror=null;this.src=JIKAN.PLACEHOLDER"></div>
          <div class="cat-hero-info">
            <span class="cat-hero-badge">Now Airing</span>
            <h2 class="cat-hero-title">${JIKAN.esc(title)}</h2>
            <div class="cat-hero-tags">${genres}${a.score ? `<span class="sc-badge-inline">★ ${a.score.toFixed(1)}</span>` : ""}</div>
            <div class="cat-hero-meta">${JIKAN.esc(a.type || "TV")}${air}</div>
            <div class="cat-hero-actions">
              <a class="btn btn-primary btn-glow" href="${pageHref("anime")}?id=${a.mal_id}">View Details</a>
              <a class="btn btn-outline" href="${pageHref("anime")}?id=${a.mal_id}#watchSlot">▶ Watch Now</a>
            </div>
          </div>
        </div>
      </div>`;
    }

    function initHero(n) {
      const track = document.getElementById("heroSlides");
      const dotsEl = document.getElementById("heroDots");
      let idx = 0, timer = null;
      dotsEl.innerHTML = Array.from({ length: n }, (_, i) =>
        `<button class="cat-hero-dot${i === 0 ? " active" : ""}" data-i="${i}" aria-label="Slide ${i + 1}"></button>`).join("");

      const show = (i) => {
        idx = (i + n) % n;
        track.querySelectorAll(".cat-hero-slide").forEach((s, k) => {
          const on = k === idx;
          s.classList.toggle("active", on);
          if (on) {
            // Hydrate the slide's backdrop + cover lazily on first activation
            // (only the initial slide ships with its media preloaded).
            const bg = s.querySelector(".cat-hero-bg");
            if (bg && bg.dataset.src && !bg.style.backgroundImage) bg.style.backgroundImage = bg.dataset.src;
            const img = s.querySelector("img");
            if (img && img.dataset.src && img.src !== img.dataset.src) img.src = img.dataset.src;
          }
        });
        dotsEl.querySelectorAll(".cat-hero-dot").forEach((d, k) => d.classList.toggle("active", k === idx));
      };

      const start = () => { clearInterval(timer); if (!document.hidden && !collapsed) timer = setInterval(() => show(idx + 1), 5000); };
      const stop = () => clearInterval(timer);

      const hero = document.getElementById("catHero");
      const collapseBtn = document.getElementById("heroCollapse");
      const restoreBtn = document.getElementById("heroRestore");
      let collapsed = localStorage.getItem("otk.catHeroCollapsed") === "1";
      const applyCollapsed = () => {
        hero.classList.toggle("collapsed", collapsed);
        restoreBtn.hidden = !collapsed;
        if (collapsed) {
          hero.style.height = "0px";
          hero.style.minHeight = "0px";
          stop();
        } else {
          hero.style.height = "";
          hero.style.minHeight = "";
          start();
        }
      };
      collapseBtn.addEventListener("click", () => {
        collapsed = true;
        localStorage.setItem("otk.catHeroCollapsed", "1");
        applyCollapsed();
      });
      restoreBtn.addEventListener("click", () => {
        collapsed = false;
        localStorage.setItem("otk.catHeroCollapsed", "0");
        applyCollapsed();
      });
      applyCollapsed();

      document.getElementById("heroPrev").addEventListener("click", () => { show(idx - 1); start(); });
      document.getElementById("heroNext").addEventListener("click", () => { show(idx + 1); start(); });
      dotsEl.addEventListener("click", (e) => {
        const b = e.target.closest(".cat-hero-dot");
        if (b) { show(Number(b.dataset.i)); start(); }
      });
      hero.addEventListener("mouseenter", stop);
      hero.addEventListener("mouseleave", start);
      document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); else start(); });
      let tx = null;
      hero.addEventListener("touchstart", (e) => { tx = e.changedTouches[0].clientX; stop(); }, { passive: true });
      hero.addEventListener("touchend", (e) => {
        if (tx === null) return;
        const dx = e.changedTouches[0].clientX - tx;
        tx = null;
        if (Math.abs(dx) > 40) { show(idx + (dx < 0 ? 1 : -1)); start(); }
      }, { passive: true });
      start();
    }

    async function loadRows() {
      const loadRow = (id, fetcher) => {
        const row = document.getElementById(id);
        if (!row) return;
        fetcher(1).then((res) => {
          row.innerHTML = "";
          (res?.data || []).slice(0, 20).forEach((a) => row.appendChild(JIKAN.streamCard(a)));
          row.dispatchEvent(new Event("scroll"));
        }).catch(() => { row.innerHTML = `<div class="empty-state">Could not load.</div>`; });
      };
      loadRow("rowTrending", () => JIKAN.aniBrowse({ sort: ["TRENDING_DESC"] }));
      loadRow("rowUpdated", () => JIKAN.aniBrowse({ sort: ["UPDATED_AT_DESC"] }));
      loadRow("rowPopular", () => JIKAN.aniBrowse({ sort: ["POPULARITY_DESC"] }));
    }

    function setupScrollRow(el) {
      if (!el || el.dataset.scwired) return;
      el.dataset.scwired = "1";
      const wrap = el.closest(".sc-row-wrap");
      if (!wrap) return;
      const prev = wrap.querySelector(".sc-row-btn.prev");
      const next = wrap.querySelector(".sc-row-btn.next");
      const updateEdges = () => {
        const max = el.scrollWidth - el.clientWidth;
        const atStart = el.scrollLeft <= 2;
        const atEnd = el.scrollLeft >= max - 2;
        if (prev) prev.classList.toggle("off", atStart);
        if (next) next.classList.toggle("off", atEnd);
        wrap.classList.toggle("show-fade-l", !atStart);
        wrap.classList.toggle("show-fade-r", !atEnd);
      };
      el.addEventListener("scroll", updateEdges, { passive: true });
      // Native smooth scroll landing exactly on a card boundary. Using the
      // browser's own smooth scroll (plus proximity snap) behaves identically
      // in Chrome and Firefox — Chrome's mandatory snap otherwise re-snaps mid
      // animation, which is what made the buttons appear to not work there.
      const snapStep = () => {
        const gap = parseFloat(getComputedStyle(el).gap) || 0;
        const w = (el.firstElementChild ? el.firstElementChild.offsetWidth : 0) + gap;
        return Math.max(w, 320);
      };
      let settleTimer = null;
      const animateTo = (dir) => {
        const w = snapStep();
        const max = el.scrollWidth - el.clientWidth;
        const cur = el.scrollLeft;
        // Advance roughly one visible page per click, landing exactly on a card
        // boundary so the end position is identical in Chrome and Firefox.
        const cards = Math.max(1, Math.round((el.clientWidth * 0.8) / w));
        const n = dir > 0 ? Math.floor(cur / w) + cards : Math.ceil(cur / w) - cards;
        const target = Math.max(0, Math.min(n * w, max));
        if (Math.abs(target - cur) < 2) return;
        // Disable snap while the native smooth scroll runs — Chrome otherwise
        // re-snaps mid-animation and the row stops short of the target.
        clearTimeout(settleTimer);
        el.classList.add("no-snap");
        el.scrollTo({ left: target, behavior: "smooth" });
        const settle = () => {
          if (Math.abs(el.scrollLeft - target) >= 4) { settleTimer = setTimeout(settle, 120); return; }
          el.classList.remove("no-snap");
        };
        settleTimer = setTimeout(settle, 250);
      };
      if (prev) prev.addEventListener("click", () => animateTo(-1));
      if (next) next.addEventListener("click", () => animateTo(1));
      updateEdges();
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (state.q) {
        document.getElementById("searchBox").value = state.q;
        document.getElementById("catHero").style.display = "none";
        document.getElementById("catRows").style.display = "none";
      }
      loadGenres();
      showBrowse();
      document.querySelectorAll(".scroll-row").forEach(setupScrollRow);
    });
  </script>
</body>
</html>
