<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="msvalidate.01" content="4F55345C289F9597335C55566F2B31F9" />

  <title>Sign Up - OtakuPier</title>
  <meta name="robots" content="index, follow">
  <meta name="description" content="Create a free OtakuPier account to track anime, rank shows, join clubs and chat with fans.">
  <link rel="canonical" href="https://otakupier.2bd.net/pages/signup.html">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="preconnect" href="https://api.jikan.moe">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="../css/style.css?v=8">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <main class="container">
    <div class="auth-wrap">
      <h1>Join OtakuPier</h1>
      <div class="form-error" id="formError" style="display:none;"></div>
      <form id="signupForm">
        <div class="form-group">
          <label for="name">Display name</label>
          <input type="text" id="name" placeholder="e.g. ShonenKing" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" data-toggle-pw placeholder="At least 6 characters" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
      <div class="form-switch">Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </main>

  <footer id="siteFooter"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js?v=8"></script>
  <script src="../js/api.js?v=8"></script>
  <script src="../js/app.js?v=8"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (SUPABASE_READY) {
        setupPasswordToggle();
        setupAuthForm("signupForm", "signup");
      } else {
        document.getElementById("signupForm").innerHTML =
          `<div class="empty-state">Accounts are coming soon — Supabase isn't configured yet.</div>`;
      }
    });
  </script>
</body>
</html>
