<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OtakuPier — Watch &amp; Discover Anime Online: Catalog, Rankings, Reviews</title>
  <meta name="description" content="OtakuPier lets you watch, discover and track anime. Browse the full catalog, seasonal shows, community rankings, reviews, characters and live chat with fellow fans.">
  <meta name="keywords" content="anime, watch anime online, anime catalog, anime rankings, anime reviews, seasonal anime, anime community, otaku">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#7c5cff">
  <link rel="canonical" href="https://otakupier.2bd.net/">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="OtakuPier">
  <meta property="og:title" content="OtakuPier — Watch &amp; Discover Anime Online">
  <meta property="og:description" content="Browse the full anime catalog, seasonal shows, community rankings, reviews and live chat.">
  <meta property="og:url" content="https://otakupier.2bd.net/">
  <meta property="og:image" content="https://otakupier.2bd.net/images/banner.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://api.jikan.moe">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="css/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "OtakuPier",
    "alternateName": "OtakuPier Anime",
    "url": "https://otakupier.2bd.net/",
    "description": "Watch and discover anime online. Browse the catalog, seasonal shows, community rankings, reviews and live chat.",
    "inLanguage": "en",
    "publisher": {
      "@type": "Organization",
      "name": "OtakuPier",
      "logo": { "@type": "ImageObject", "url": "https://otakupier.2bd.net/favicon.svg" }
    }
  }
  </script>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>

  <header class="hero">
    <h1>Welcome to <span>OtakuPier</span></h1>
    <p>Explore the world of anime. Discover titles, characters, episodes, and connect with the community — rankings, reviews, and live chat.</p>
    <a href="pages/catalog.html" class="btn btn-primary">Browse the catalog</a>
  </header>

  <main class="container">
    <section id="trending">
      <div class="section-head">
        <h2>Trending Now</h2>
        <a class="link" href="pages/catalog.html">View all</a>
      </div>
      <div class="grid" id="trendingGrid"></div>
    </section>

    <section id="airing">
      <div class="section-head">
        <h2>Currently Airing</h2>
        <a class="link" href="pages/catalog.html">View all</a>
      </div>
      <div class="grid" id="airingGrid"></div>
    </section>

    <section id="upcoming">
      <div class="section-head">
        <h2>Upcoming</h2>
        <a class="link" href="pages/catalog.html">View all</a>
      </div>
      <div class="grid" id="upcomingGrid"></div>
    </section>

    <section id="toprated">
      <div class="section-head">
        <h2>Top Rated</h2>
        <a class="link" href="pages/rankings.html">See community rankings</a>
      </div>
      <div class="grid" id="topRatedGrid"></div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function loadHome() {
      const trending = document.getElementById("trendingGrid");
      const topRated = document.getElementById("topRatedGrid");
      const airing = document.getElementById("airingGrid");
      const upcoming = document.getElementById("upcomingGrid");

      // Translucent skeleton placeholders while data loads
      [trending, topRated, airing, upcoming].forEach((g) => {
        g.innerHTML = skeletonGrid(12);
      });

      // Track anime already placed so the same title never appears twice
      const seen = new Set();
      const pick = (list) => {
        const fresh = [];
        (list || []).forEach((a) => {
          if (a.mal_id && !seen.has(a.mal_id)) {
            seen.add(a.mal_id);
            fresh.push(a);
          }
        });
        return fresh.slice(0, 25);
      };
      const fill = (grid, list) => {
        const fresh = pick(list);
        grid.innerHTML = "";
        fresh.forEach((a) => grid.appendChild(JIKAN.card(a)));
        return fresh.length > 0;
      };
      const fail = (grid, label) => {
        grid.innerHTML = `<div class="empty-state">${label} unavailable right now. Please try again later.</div>`;
      };

      await JIKAN.loadEdits();

      // Each section loads independently so one flaky Jikan endpoint never
      // blanks the whole home page. Every section has a top-anime fallback.
      async function loadSection(grid, label, primary, fallbackPage) {
        try {
          const res = await primary();
          if (res && res.data && fill(grid, res.data.slice(0, 25))) return;
        } catch (e) {}
        try {
          const fb = await JIKAN.topRated(fallbackPage);
          if (fb && fb.data && fill(grid, fb.data)) return;
        } catch (e) {}
        fail(grid, label);
      }

      await Promise.all([
        loadSection(trending, "Trending", () => JIKAN.topAnime(1), 1),
        loadSection(topRated, "Top Rated", () => JIKAN.topRated(1), 1),
        loadSection(airing, "Currently airing", () => JIKAN.currentSeason(), 2),
        loadSection(upcoming, "Upcoming", () => JIKAN.upcomingSeason(), 3),
      ]);
    }

    document.addEventListener("DOMContentLoaded", loadHome);
  </script>
</body>
</html>
